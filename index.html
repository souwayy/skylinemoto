<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nyxride (v27.6 - Single Quest)</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; touch-action: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        canvas { display: block; touch-action: none; }
        .hidden { display: none !important; }

        #rotateDevice { position: fixed; inset: 0; background: #000; z-index: 100000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        #rotateDevice svg { width: 100px; height: 100px; fill: none; stroke: white; stroke-width: 4; margin-bottom: 30px; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 15px rgba(255,255,255,0.3)); }
        #rotateDevice h2 { font-size: 24px; font-weight: 600; margin: 0; padding: 0 20px; }

        #splashScreen {
            position: fixed; inset: 0; background-color: #000; z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.8s ease-in-out;
        }
        #splashScreen img { width: 100vw; height: 100dvh; object-fit: contain; padding: 10vh 0; box-sizing: border-box; animation: pulseLogo 2s ease-in-out infinite; }
        @keyframes pulseLogo { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.03); opacity: 1; } }

        #mainMenu {
            background: url('menu_bg_new.jpg') no-repeat center center;
            background-size: cover;
            width: 100vw; height: 100dvh;
            position: relative; overflow: hidden;
        }
        
        .menu-btn { position: absolute; cursor: pointer; z-index: 10; touch-action: manipulation; }
        #btn-settings { top: 6%; left: 2%; width: 20vw; }
        #btn-quests { top: 20%; left: 2%; width: 20vw; }
        #btn-shop { top: 34%; left: 2%; width: 20vw; }
        #btn-play { bottom: 8%; right: 2%; width: 28vw; }

        #top-right-ui {
            position: absolute; top: 6%; right: 4%;
            display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
            pointer-events: none; z-index: 11; text-shadow: 2px 2px 4px #000, 0 0 10px #000;
        }
        .ui-text-row { display: flex; align-items: center; gap: 8px; font-weight: bold; color: #fff; }
        .ui-text-row.best { font-size: 20px; color: #ccc; }
        .ui-text-row.coins { font-size: 28px; color: #fff; }
        .ui-text-row.coins img { height: 32px; }

        #bike-block {
            position: absolute;
            bottom: 5%; left: 50%; transform: translateX(-50%); 
            width: 90vw; height: 60vh; 
            pointer-events: none; z-index: 5;
        }
        #menuBikeCanvas { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0px 15px 20px rgba(0,0,0,0.8)); }

        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .top-bar { display: flex; justify-content: space-between; padding: 20px; align-items: flex-start; }
        .stats-left { display: flex; flex-direction: column; gap: 5px; }
        .stat-text { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.8); text-transform: uppercase; }
        
        .stats-right { display: flex; flex-direction: row; align-items: center; gap: 15px; }
        .score { font-size: 36px; font-weight: bold; color: white; text-shadow: 0 2px 5px #000; }
        
        /* UI КВЕСТОВ В ИГРЕ */
        #questWrapper {
            position: absolute; top: 80px; left: 10px;
            display: flex; flex-direction: row; align-items: flex-start;
            pointer-events: none; z-index: 15;
        }
        #btnToggleQuests {
            background: rgba(0,0,0,0.6); border: 1px solid #ffd700; color: #ffd700;
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            pointer-events: auto; cursor: pointer; font-weight: bold; font-size: 16px; transition: transform 0.2s;
        }
        #questPanel {
            background: rgba(0,0,0,0.6); border-left: 3px solid #ffd700;
            padding: 10px 15px; border-radius: 0 8px 8px 0;
            display: flex; flex-direction: column; gap: 8px;
            margin-left: 5px; width: 55vw; max-width: 280px;
            transition: opacity 0.2s, max-height 0.2s;
            overflow: hidden;
        }
        #questPanel.hidden-quests {
            display: none !important;
        }
        .quest-item { color: white; font-size: 13px; font-weight: 600; }
        .quest-item.completed { color: #00ff00; text-decoration: line-through; }
        .quest-bar { height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-top: 3px; width: 100%; overflow: hidden;}
        .quest-fill { height: 100%; background: #ffd700; width: 0%; transition: width 0.3s; }

        /* МЕНЮ КВЕСТОВ */
        #questsScreen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(10, 5, 15, 0.97); display: none; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 70; padding: 20px; box-sizing: border-box;
        }
        .quests-title { color: #fff; font-size: 32px; font-weight: 900; margin-bottom: 20px; letter-spacing: 3px; font-style: italic; }
        .quests-list { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; max-height: 70vh; overflow-y: auto; padding-right: 10px; }
        .quest-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-left: 4px solid #ffd700; padding: 12px 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; }
        .quest-card.taken { border-left-color: #00ff00; background: rgba(0, 255, 0, 0.05); }
        .quest-card-header { display: flex; justify-content: space-between; align-items: center; }
        .quest-card-title { color: #fff; font-size: 15px; font-weight: bold; }
        .quest-card-reward { color: #ffd700; font-size: 14px; font-weight: bold; }
        .quest-card-desc { color: #aaa; font-size: 13px; }
        .quest-card-btn {
            background: #ffd700; color: #000; border: none; border-radius: 6px;
            padding: 6px 12px; font-size: 13px; font-weight: bold; cursor: pointer;
            align-self: flex-end; transition: background 0.2s;
        }
        .quest-card-btn:active { background: #ffaa00; }
        .quest-card-btn:disabled { background: #333; color: #666; cursor: default; }
        .quest-card-btn.cancel-btn { background: #ff3333; color: #fff; }
        .quest-card-btn.cancel-btn:active { background: #cc0000; }

        .btn-game { position: absolute; width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); pointer-events: auto; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-game svg { width: 25px; height: 25px; stroke: rgba(255,255,255,0.8); stroke-width: 2.5; }
        
        #btnLeanBack { bottom: 100px; left: 20px; } 
        #btnLeanForward { bottom: 30px; left: 70px; }
        #btnGas { bottom: 100px; right: 20px; } 
        #btnBrake { bottom: 30px; right: 70px; }

        #btnPause { 
            position: relative; width: 40px; height: 40px; pointer-events: auto; 
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; 
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        #btnPause svg { width: 20px; height: 20px; }

        #pauseScreen, #gameOverScreen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: #0a050f; display: none; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 60; padding: 10px 0; box-sizing: border-box;
        }
        
        .go-header { text-align: center; margin-bottom: 10px; }
        .go-title { font-size: 16px; color: #aaa; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
        .go-distance { font-size: 38px; font-weight: 900; color: #fff; font-style: italic; text-shadow: 0 0 15px rgba(255,100,0,0.5); line-height: 1; }
        
        .go-stats-list {
            display: flex; flex-direction: column; gap: 4px; 
            background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
            min-width: 320px; margin-bottom: 15px;
        }
        .go-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #ddd; font-weight: 600; }
        .go-row .stat-name { flex: 1.2; text-align: left; }
        .go-row .stat-value { flex: 1; text-align: center; color: #fff; font-weight: 900; font-size: 16px; }
        .go-row .stat-coins { flex: 1; text-align: right; color: #ffd700; font-weight: 900; display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 16px;}
        .go-row .stat-coins img { height: 14px; }

        .go-total-reward { display: flex; align-items: center; gap: 8px; font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); margin-bottom: 15px; }
        .go-total-reward img { height: 32px; }

        .go-buttons { display: flex; gap: 15px; }
        .btn-neon {
            background: linear-gradient(135deg, #1a1a1a, #333); color: #fff; border: 2px solid #ff5500;
            padding: 10px 25px; border-radius: 8px; font-size: 16px; font-weight: bold; text-transform: uppercase;
            cursor: pointer; box-shadow: 0 0 10px rgba(255,85,0,0.5), inset 0 0 10px rgba(255,85,0,0.2);
            transition: all 0.2s; font-style: italic; letter-spacing: 1px;
        }
        .btn-neon:active { transform: scale(0.95); box-shadow: 0 0 20px rgba(255,85,0,0.8); }

        .pause-title { color: #fff; font-size: 32px; font-weight: 900; margin-bottom: 15px; letter-spacing: 3px; font-style: italic; }
        .pause-btn { background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); color: #fff; padding: 8px 20px; margin: 5px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 220px; text-align: center; text-transform: uppercase; }
        .pause-btn:active { background: rgba(255,255,255,0.2); }
        
        .version-text { position: absolute; bottom: 5px; right: 5px; color: rgba(255,255,255,0.3); font-size: 12px; z-index: 100; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/planck-js@0.3/dist/planck.min.js"></script>
</head>
<body>

<div id="rotateDevice">
    <svg viewBox="0 0 100 100">
        <g fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="35" y="20" width="30" height="60" rx="4" ry="4">
                <animateTransform attributeName="transform" type="rotate" values="0 50 50; 90 50 50; 90 50 50; 0 50 50" keyTimes="0; 0.4; 0.6; 1" dur="3s" repeatCount="indefinite" />
            </rect>
            <circle cx="50" cy="72" r="2">
                <animateTransform attributeName="transform" type="rotate" values="0 50 50; 90 50 50; 90 50 50; 0 50 50" keyTimes="0; 0.4; 0.6; 1" dur="3s" repeatCount="indefinite" />
            </circle>
            <line x1="45" y1="26" x2="55" y2="26">
                <animateTransform attributeName="transform" type="rotate" values="0 50 50; 90 50 50; 90 50 50; 0 50 50" keyTimes="0; 0.4; 0.6; 1" dur="3s" repeatCount="indefinite" />
            </line>
        </g>
    </svg>
    <h2>Пожалуйста, поверните устройство</h2>
</div>

<div id="splashScreen">
    <img src="splash.png" alt="Souway Games" onerror="this.src='moto.png';">
</div>

<div class="hidden" id="mainMenu">
    <img class="menu-btn" id="btn-settings" src="btn_gear.png" alt="Settings">
    <img class="menu-btn" id="btn-quests" src="btn_quests.png" alt="Quests">
    <img class="menu-btn" id="btn-shop" src="btn_shop.png" alt="Shop">
    <img class="menu-btn" id="btn-play" src="btn_play.png" alt="Play">

    <div id="top-right-ui">
        <div class="ui-text-row best">
            <span>BEST:</span> <span id="menuBestDistance">0</span>M
        </div>
        <div class="ui-text-row coins">
            <img src="coin.png" onerror="this.style.display='none'">
            <span id="menuCoinBalance">0</span>
        </div>
    </div>

    <div id="bike-block">
        <canvas id="menuBikeCanvas" width="1200" height="800"></canvas>
    </div>
</div>

<div class="ui-layer hidden" id="gameUI">
    <div class="top-bar">
        <div class="stats-left">
            <div class="stat-text">Best: <span id="bestDistanceText">0</span>m</div>
            <div class="stat-text" style="color: #fff3d4; display: flex; align-items: center;">
                <img src="coin.png" style="height: 24px; margin-right: 5px;" onerror="this.style.display='none'">
                <span id="coinBalanceText">0</span>
            </div>
        </div>
        
        <div class="stats-right">
            <button id="btnPause">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </button>
            <div class="score"><span id="distanceText">0</span> m</div>
        </div>
    </div>
    
    <!-- Панель квестов со стрелкой -->
    <div id="questWrapper">
        <div id="btnToggleQuests">◀</div>
        <div id="questPanel">
            <!-- Заполняется через JS -->
        </div>
    </div>

    <div class="controls" id="controls">
        <div class="btn-game" id="btnLeanBack"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg></div>
        <div class="btn-game" id="btnLeanForward"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg></div>
        <div class="btn-game" id="btnGas"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
        <div class="btn-game" id="btnBrake"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></svg></div>
    </div>
</div>

<div id="questsScreen">
    <div class="quests-title">КВЕСТЫ</div>
    <div class="quests-list" id="menuQuestList">
        <!-- Заполняется через JS -->
    </div>
    <button class="pause-btn" id="btnCloseQuests" style="margin-top: 20px;">ЗАКРЫТЬ</button>
</div>

<div id="pauseScreen" style="display: none;">
    <div class="pause-title">ПАУЗА</div>
    <button class="pause-btn" id="btnResume">ПРОДОЛЖИТЬ</button>
    <button class="pause-btn" id="btnRestartPause">РЕСТАРТ</button>
    <button class="pause-btn" id="btnSettingsPause">НАСТРОЙКИ</button>
    <button class="pause-btn" id="btnHomePause">В МЕНЮ</button>
</div>

<div id="gameOverScreen">
    <div class="go-header">
        <div class="go-title">Дистанция</div>
        <div class="go-distance"><span id="go-distance">0</span> М</div>
    </div>
    
    <div class="go-stats-list">
        <div class="go-row">
            <span class="stat-name">ВИЛЛИ</span>
            <span class="stat-value" id="go-wheelie">0.0s</span>
            <span class="stat-coins">+<span id="go-coins-wheelie">0</span> <img src="coin.png" onerror="this.style.display='none'"></span>
        </div>
        <div class="go-row">
            <span class="stat-name">СТОППИ</span>
            <span class="stat-value" id="go-stoppie">0.0s</span>
            <span class="stat-coins">+<span id="go-coins-stoppie">0</span> <img src="coin.png" onerror="this.style.display='none'"></span>
        </div>
        <div class="go-row">
            <span class="stat-name">ФРОНТФЛИП</span>
            <span class="stat-value" id="go-frontflips">0</span>
            <span class="stat-coins">+<span id="go-coins-front">0</span> <img src="coin.png" onerror="this.style.display='none'"></span>
        </div>
        <div class="go-row">
            <span class="stat-name">БЭКФЛИП</span>
            <span class="stat-value" id="go-backflips">0</span>
            <span class="stat-coins">+<span id="go-coins-back">0</span> <img src="coin.png" onerror="this.style.display='none'"></span>
        </div>
    </div>

    <div class="go-total-reward">
        <span>ИТОГО:</span>
        <img src="coin.png" onerror="this.style.display='none'">
        <span id="go-total-coins">0</span>
    </div>

    <div class="go-buttons">
        <button class="btn-neon" id="btnHomeGameOver">МЕНЮ</button>
        <button class="btn-neon" id="btnRestartGameOver">РЕСТАРТ</button>
    </div>
</div>

<canvas id="gameCanvas"></canvas>
<div class="version-text">v27.6 (SINGLE QUEST)</div>

<script>
    let gameState = 'splash'; 
    let splashStarted = false;
    
    // --- СИСТЕМА КВЕСТОВ ---
    const QUEST_POOL = [
        { id: 'dist_1k', type: 'dist', text: 'Проедь всего 1000м', target: 1000, reward: 50 },
        { id: 'dist_5k', type: 'dist', text: 'Проедь всего 5000м', target: 5000, reward: 150 },
        { id: 'dist_20k', type: 'dist', text: 'Проедь всего 20000м', target: 20000, reward: 500 },
        { id: 'flips_5', type: 'flips', text: 'Сделай 5 Бэкфлипов', target: 5, reward: 100 },
        { id: 'flips_20', type: 'flips', text: 'Сделай 20 Бэкфлипов', target: 20, reward: 300 },
        { id: 'wheelie_10', type: 'wheelie', text: 'Вилли всего 10с', target: 10, reward: 75 },
        { id: 'wheelie_30', type: 'wheelie', text: 'Вилли всего 30с', target: 30, reward: 200 },
        { id: 'stoppie_5', type: 'stoppie', text: 'Стоппи всего 5с', target: 5, reward: 75 },
        { id: 'stoppie_20', type: 'stoppie', text: 'Стоппи всего 20с', target: 20, reward: 200 },
        { id: 'flips_any_10', type: 'total_flips', text: 'Сделай 10 любых сальто', target: 10, reward: 150 }
    ];

    let questProgress = JSON.parse(localStorage.getItem('questProgress')) || {
        dist: 0, flips: 0, wheelie: 0, stoppie: 0, total_flips: 0
    };
    let completedQuests = JSON.parse(localStorage.getItem('completedQuests')) || [];
    let activeQuestId = localStorage.getItem('activeQuestId') || null; // Только один квест

    let questsPanelOpen = true;

    // Взять квест
    function takeQuest(id) {
        if (activeQuestId) return; // Уже есть активный квест
        
        let q = QUEST_POOL.find(x => x.id === id);
        if (!q || completedQuests.includes(id)) return;

        let progress = questProgress[q.type] || 0;
        if (progress >= q.target) {
            // Уже выполнен - начисляем сразу
            completedQuests.push(id);
            totalCoins += q.reward;
            localStorage.setItem('completedQuests', JSON.stringify(completedQuests));
            localStorage.setItem('totalCoins', totalCoins);
            document.getElementById('menuCoinBalance').innerText = totalCoins;
            document.getElementById('coinBalanceText').innerText = totalCoins;
            renderMenuQuests();
            return;
        }

        activeQuestId = id;
        localStorage.setItem('activeQuestId', activeQuestId);
        renderMenuQuests();
        updateQuestUI();
    }

    // Отменить квест
    function cancelQuest(id) {
        if (activeQuestId === id) {
            activeQuestId = null;
            localStorage.removeItem('activeQuestId');
            renderMenuQuests();
            updateQuestUI();
        }
    }

    // Проверка выполнения
    function checkQuestsCompletion() {
        if (!activeQuestId) return;
        
        let q = QUEST_POOL.find(x => x.id === activeQuestId);
        if (!q) { activeQuestId = null; return; }

        let progress = questProgress[q.type] || 0;
        if (progress >= q.target) {
            // Выполнен!
            completedQuests.push(activeQuestId);
            activeQuestId = null;
            totalCoins += q.reward;
            
            localStorage.setItem('completedQuests', JSON.stringify(completedQuests));
            localStorage.setItem('totalCoins', totalCoins);
            localStorage.removeItem('activeQuestId');
            
            document.getElementById('coinBalanceText').innerText = totalCoins;
            document.getElementById('menuCoinBalance').innerText = totalCoins;
            
            let notif = document.createElement('div');
            notif.style.cssText = 'position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); color:#00ff00; font-size:22px; font-weight:bold; z-index:100; text-shadow:0 0 10px #000; text-align:center;';
            notif.innerText = `КВЕСТ ВЫПОЛНЕН!\n+${q.reward} МОНЕТ`;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 2500);
            
            renderMenuQuests();
            updateQuestUI();
        }
    }

    // Отрисовка меню квестов
    function renderMenuQuests() {
        let list = document.getElementById('menuQuestList');
        if (!list) return;
        list.innerHTML = '';
        
        QUEST_POOL.forEach(q => {
            let isDone = completedQuests.includes(q.id);
            let isTaken = (activeQuestId === q.id);
            let progress = questProgress[q.type] || 0;
            let percent = Math.min(100, (progress / q.target) * 100);
            
            let cardClass = isDone ? '' : (isTaken ? 'taken' : '');
            let btnHtml = '';
            
            if (isDone) {
                btnHtml = `<button class="quest-card-btn" disabled>ВЫПОЛНЕН</button>`;
            } else if (isTaken) {
                btnHtml = `<button class="quest-card-btn cancel-btn" onclick="cancelQuest('${q.id}')">ОТМЕНИТЬ</button>`;
            } else {
                // Если есть активный квест, блокируем кнопку
                let isBlocked = activeQuestId !== null;
                btnHtml = `<button class="quest-card-btn" ${isBlocked ? 'disabled' : ''} onclick="takeQuest('${q.id}')">ВЗЯТЬ</button>`;
            }

            let html = `
                <div class="quest-card ${cardClass}">
                    <div class="quest-card-header">
                        <div class="quest-card-title">${q.text}</div>
                        <div class="quest-card-reward">+${q.reward} 🪙</div>
                    </div>
                    <div class="quest-card-desc">Прогресс: ${Math.min(Math.floor(progress), q.target)} / ${q.target}</div>
                    <div class="quest-bar"><div class="quest-fill" style="width: ${percent}%; background: ${isDone ? '#00ff00' : '#ffd700'}"></div></div>
                    ${btnHtml}
                </div>
            `;
            list.innerHTML += html;
        });
    }

        updateQuestProgress('total_flips', questProgress.total_flips + backflipCount + frontflipCount);
        updateQuestProgress('wheelie', questProgress.wheelie + maxWheelieTime);
        updateQuestProgress('stoppie', questProgress.stoppie + maxStoppieTime);

        checkQuestsCompletion();

        document.getElementById('go-distance').innerText = dist;
        document.getElementById('go-wheelie').innerText = maxWheelieTime.toFixed(1) + "s";
        document.getElementById('go-coins-wheelie').innerText = coinsWheelie;
        document.getElementById('go-stoppie').innerText = maxStoppieTime.toFixed(1) + "s";
        document.getElementById('go-coins-stoppie').innerText = coinsStoppie;
        document.getElementById('go-frontflips').innerText = frontflipCount;
        document.getElementById('go-coins-front').innerText = coinsFront;
        document.getElementById('go-backflips').innerText = backflipCount;
        document.getElementById('go-coins-back').innerText = coinsBack;
        document.getElementById('go-total-coins').innerText = totalEarned;

        document.getElementById('gameOverScreen').style.display = 'flex';
        if (isAudioInitialized) { idleGain.gain.setValueAtTime(0, audioCtx.currentTime); revGain.gain.setValueAtTime(0, audioCtx.currentTime); windGain.gain.setValueAtTime(0, audioCtx.currentTime); }
    }

    function updateBirds(dt) {
        birdSpawnTimer -= dt;
        if (birdSpawnTimer <= 0) {
            let flockSize = Math.floor(Math.random() * 3) + 2;
            let spawnX = cameraX + canvas.width + 50; 
            let startY = canvas.height * 0.2 + Math.random() * 60;
            for (let i = 0; i < flockSize; i++) birds.push({ x: spawnX + Math.random() * 60, y: startY + Math.random() * 40, speed: 30 + Math.random() * 20, wingPhase: Math.random() * Math.PI * 2, wingSpeed: 8 + Math.random() * 4 });
            birdSpawnTimer = 8 + Math.random() * 10;
        }
        for (let i = birds.length - 1; i >= 0; i--) {
            let b = birds[i];
            b.x -= b.speed * dt; b.wingPhase += b.wingSpeed * dt;
            if (b.x < cameraX - 200) birds.splice(i, 1);
        }
    }

    function drawBirds() {
        ctx.strokeStyle = '#2a1533';
        ctx.lineWidth = 2; ctx.lineCap = 'round';
        for (let b of birds) {
            let flap = Math.sin(b.wingPhase) * 6;
            ctx.beginPath(); ctx.moveTo(b.x - 10, b.y - flap); ctx.quadraticCurveTo(b.x - 5, b.y, b.x, b.y); ctx.quadraticCurveTo(b.x + 5, b.y, b.x + 10, b.y - flap); ctx.stroke();
        }
    }

    function drawTerrain() { 
        ctx.fillStyle = '#000'; ctx.strokeStyle = '#000'; 
        ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cameraX - 100, groundY + 2000); 
        let sx = Math.floor(cameraX) - 100; let ex = Math.floor(cameraX) + (canvas.width / zoom) + 100; 
        for (let x = sx; x <= ex; x += 2) ctx.lineTo(x, getTerrainY(x)); 
        ctx.lineTo(ex, groundY + 2000); ctx.closePath(); ctx.fill(); ctx.stroke(); 
    }
    
    function drawWheel(wheel) { 
        ctx.save(); 
        ctx.translate(wheel.getPosition().x * SCALE, wheel.getPosition().y * SCALE); 
        ctx.rotate(wheel.getAngle()); 
        let r = wheelRadius * SCALE; 
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill(); 
        if (currentBike.name === "CTM 300 EXC") { 
            ctx.strokeStyle = '#111'; ctx.lineWidth = 2; 
            for (let i = 0; i < 16; i++) { 
                let angle = (i / 16) * Math.PI * 2; 
                ctx.beginPath(); ctx.moveTo(Math.cos(angle) * (r - 1.5), Math.sin(angle) * (r - 1.5)); ctx.lineTo(Math.cos(angle) * (r + 1), Math.sin(angle) * (r + 1)); ctx.stroke(); 
            } 
        } 
        ctx.beginPath(); ctx.arc(0, 0, r - 3.5, 0, Math.PI * 2); ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.stroke(); 
        ctx.strokeStyle = '#555'; ctx.lineWidth = 1; 
        let spokes = currentBike.name === "CTM 300 EXC" ? 6 : 8; 
        for (let i = 0; i < spokes; i++) { 
            let angle = (i / spokes) * Math.PI * 2; 
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(angle) * (r - 3.5), Math.sin(angle) * (r - 3.5)); ctx.stroke(); 
        } 
        ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI * 2); ctx.fillStyle = '#444'; ctx.fill(); 
        ctx.restore(); 
    }
    
    function spawnDust(x, y, sx, t) { if (particles.length > 80) return; let c = t === 'brake' ? 2 : 1, bvy = t === 'brake' ? -5 : -2; for (let i = 0; i < c; i++) { particles.push({ x: x + (Math.random() - 0.5) * 8, y: y, baseVx: -Math.random() * 3, vy: bvy, radius: 3 + Math.random() * 4, growth: 1 + Math.random(), alphaMax: 0.4, alpha: 0.4, age: 0, maxAge: 1.0 + Math.random() }); } }
    function updateParticles(dt) { for (let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.age += dt; let pr = p.age / p.maxAge; if (pr >= 1) { particles.splice(i, 1); continue; } p.x += p.baseVx * (1 + pr); p.vy += 0.15; p.y += p.vy; p.radius += p.growth; p.alpha = p.alphaMax * Math.pow(1 - pr, 1.5); if (p.alpha <= 0.01) particles.splice(i, 1); } }
    function drawParticles() { for (let p of particles) { let g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius); g.addColorStop(0, `rgba(140, 105, 75, ${p.alpha})`); g.addColorStop(1, 'rgba(200, 160, 120, 0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); } }

    let lastTime = performance.now();
    function update() {
        requestAnimationFrame(update); 
        
        if (gameState === 'paused') return; 

        try {
            let dt = (performance.now() - lastTime) / 1000; lastTime = performance.now(); if (dt > 0.1) dt = 0.1; 

            if (gameState === 'playing' && chassis) {
                world.step(1/60, dt, 3); let ws = Math.abs(wheelRear.getAngularVelocity()); let ls = Math.abs(chassis.getLinearVelocity().x) * SCALE; 
                let cx = chassis.getPosition().x * SCALE; let cy = chassis.getPosition().y * SCALE; let gu = getTerrainY(cx); let ia = (cy < gu - 25); 
                let a = chassis.getAngle(); let da = a - lastAngle; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI;
                if (ia) { 
                    accumulatedRotation += da; currentAirTime += dt; if (currentAirTime > maxAirTime) maxAirTime = currentAirTime; 
                    if (!flipCounted && Math.abs(accumulatedRotation) >= Math.PI * 1.7 && currentAirTime > 0.3) { 
                        if (accumulatedRotation > 0) frontflipCount++; 
                        else backflipCount++; 
                        flipCounted = true; 
                    } 
                } 
                else {
                    currentAirTime = 0; accumulatedRotation = 0; flipCounted = false;
                    if (a < -0.3 && ls > 5) { currentWheelieTime += dt; if (currentWheelieTime > maxWheelieTime) maxWheelieTime = currentWheelieTime; } else { currentWheelieTime = 0; }
                    if (a > 0.3 && ls > 5) { currentStoppieTime += dt; if (currentStoppieTime > maxStoppieTime) maxStoppieTime = currentStoppieTime; } else { currentStoppieTime = 0; }
                    if (ls > 5) { dustTimer += dt; if (dustTimer > 0.06) { let wp = wheelRear.getPosition(); let dx = wp.x * SCALE; let dy = wp.y * SCALE + (wheelRadius * SCALE); if (window.isBrake && ls > 10) spawnDust(dx, dy, chassis.getLinearVelocity().x * SCALE, 'brake'); else if (window.isGas) spawnDust(dx, dy, chassis.getLinearVelocity().x * SCALE, 'gas'); else if (ls > 15) spawnDust(dx, dy, chassis.getLinearVelocity().x * SCALE, 'roll'); dustTimer = 0; } } else { dustTimer = 0.05; }
                }
                lastAngle = a; 

                if (window.isGas) { jointRear.setMotorSpeed(currentBike.motor.speed); jointFront.setMotorSpeed(currentBike.motor.speed); jointRear.setMaxMotorTorque(currentBike.motor.torque); jointFront.setMaxMotorTorque(currentBike.motor.torque); } else if (window.isBrake) { jointRear.setMotorSpeed(0); jointFront.setMotorSpeed(0); jointRear.setMaxMotorTorque(currentBike.motor.brake); jointFront.setMaxMotorTorque(currentBike.motor.brake); } else { jointRear.setMaxMotorTorque(0); jointFront.setMaxMotorTorque(0); }
                let tp = 20; let mts = 2.5; if (window.isLeanBack) { if (chassis.getAngularVelocity() > -mts) chassis.applyTorque(-tp, true); } else if (window.isLeanForward) { if (chassis.getAngularVelocity() < mts) chassis.applyTorque(tp, true); }
                if (isAudioInitialized) { if (window.isGas) { idleGain.gain.cancelScheduledValues(audioCtx.currentTime); idleGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05); } else { idleGain.gain.cancelScheduledValues(audioCtx.currentTime); idleGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.1); } let tr = window.isGas ? 0.8 : 0; let tw = Math.min(0.3, 0.05 + ws * 0.15); revGain.gain.setTargetAtTime(tr, audioCtx.currentTime, 0.1); windGain.gain.setTargetAtTime(tw, audioCtx.currentTime, 0.1); if (window.isGas && revSource) { let trate = 1.0 + (ws * 0.3); let frate = Math.min(1.3, trate); revSource.playbackRate.setTargetAtTime(frate, audioCtx.currentTime, 0.1); let tf = Math.max(1000, 2500 - (ws * 1000)); revFilter.frequency.setTargetAtTime(tf, audioCtx.currentTime, 0.1); previousGasState = true; } else { previousGasState = false; } if (!window.isGas && ws > 2) { popTimer += dt; if (popTimer > 1.0 && Math.random() < 0.02) { playPop(); popTimer = 0; } } else { popTimer = 0; } }
                if (chassis.getPosition().y > groundY + 1000) triggerGameOver();
                
                let targetZoom = maxZoom - Math.min(0.4, ls * 0.008); zoom += (targetZoom - zoom) * 0.02; 
                let tcx = (chassis.getPosition().x * SCALE) - ((canvas.width * 0.3) / zoom); cameraX += (tcx - cameraX) * 0.1; 
                let groundLevel = getTerrainY(cx) - 100; let tcy = (canvas.height * 0.55) - Math.max(chassis.getPosition().y * SCALE, groundLevel); cameraY += (tcy - cameraY) * 0.1;
                
                generateTerrain(); cleanupTerrain(); updateParticles(dt);
                updateBirds(dt);

                document.getElementById('distanceText').innerText = Math.max(0, Math.floor(((chassis.getPosition().x * SCALE) - startX) / 14)); 
                document.getElementById('coinBalanceText').innerText = totalCoins + Math.floor(Math.max(0, Math.floor(((chassis.getPosition().x * SCALE) - startX) / 14)) / 100);
                if (Math.max(0, Math.floor(((chassis.getPosition().x * SCALE) - startX) / 14)) > maxDistance) { maxDistance = Math.max(0, Math.floor(((chassis.getPosition().x * SCALE) - startX) / 14)); localStorage.setItem('bestDistance', maxDistance); document.getElementById('bestDistanceText').innerText = maxDistance; }
            }

            if (gameState === 'playing' || gameState === 'gameover') {
                ctx.clearRect(0, 0, canvas.width, canvas.height); 
                
                const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
                g.addColorStop(0, '#1a0b2e'); g.addColorStop(0.3, '#4a154b'); g.addColorStop(0.6, '#e63946'); g.addColorStop(1, '#ff9f1c'); 
                ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                let sx = canvas.width * 0.75; let sy = canvas.height * 0.25; 
                let sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 100);
                sg.addColorStop(0, 'rgba(255, 230, 150, 0.6)'); sg.addColorStop(1, 'rgba(255, 230, 150, 0)'); 
                ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 100, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffe680'; ctx.beginPath(); ctx.arc(sx, sy, 28, 0, Math.PI * 2); ctx.fill();

                ctx.save(); ctx.translate(-cameraX * 0.1, 0); drawBirds(); ctx.restore();

                ctx.save(); 
                ctx.scale(zoom, zoom); ctx.translate(0, cameraY); ctx.translate(-cameraX, 0);
                drawTerrain();
                if (gameState !== 'gameover' && chassis) {
                    drawParticles(); 
                    ctx.save(); 
                    ctx.translate(chassis.getPosition().x * SCALE, chassis.getPosition().y * SCALE); 
                    ctx.rotate(chassis.getAngle());
                    if (bikeImage.complete) ctx.drawImage(bikeImage, -45, -45, 90, 54); 
                    ctx.restore(); 
                    drawWheel(wheelRear); 
                    drawWheel(wheelFront);
                }
                ctx.restore(); 
            }
        } catch (error) {
            console.error(error);
        }
    }

    window.addEventListener('load', checkOrientation); 
    checkOrientation(); resizeCanvas(); update();
</script>
