<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nyxride (v16.5)</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; touch-action: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
        canvas { display: block; touch-action: none; }
        .hidden { display: none !important; }

        /* --- ЭКРАН ПОВОРОТА --- */
        #rotateDevice { position: fixed; inset: 0; background: #000; z-index: 100000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; }
        #rotateDevice svg { width: 100px; height: 100px; fill: none; stroke: white; stroke-width: 4; margin-bottom: 30px; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 15px rgba(255,255,255,0.3)); }
        #rotateDevice h2 { font-size: 24px; font-weight: 600; margin: 0; padding: 0 20px; }

        /* --- ЗАСТАВКА --- */
        #splashScreen {
            position: fixed; inset: 0; background-color: #000; z-index: 99999;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.8s ease-in-out;
        }
        #splashScreen img { width: 100vw; height: 100vh; object-fit: contain; padding: 10vh 0; box-sizing: border-box; animation: pulseLogo 2s ease-in-out infinite; }
        @keyframes pulseLogo { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.03); opacity: 1; } }

        /* --- ГЛАВНОЕ МЕНЮ --- */
        #mainMenu {
            background: url('menu_bg.jpg') no-repeat center bottom;
            background-size: cover; width: 100vw; height: 100vh;
            position: relative; overflow: hidden;
        }
        
        .menu-logo {
            position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
            font-size: 46px; font-weight: 900; color: #fff; letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(255,100,0,0.8), 0 5px 15px rgba(0,0,0,0.9);
            text-transform: uppercase; pointer-events: none; font-style: italic; z-index: 10;
        }

        .menu-header {
            position: absolute; top: 0; left: 0; width: 100%; padding: 15px 20px;
            box-sizing: border-box; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10;
        }
        .coin-display {
            display: flex; align-items: center; background: rgba(0,0,0,0.8);
            padding: 6px 15px; border-radius: 8px; border: 2px solid #555;
            color: #fff; font-size: 20px; font-weight: bold; margin-right: 15px;
        }
        .coin-display img { height: 24px; margin-right: 8px; }

        /* Общие стили для кнопок (ПРАВИЛЬНЫЕ ПРОПОРЦИИ) */
        .sprite-btn {
            background-image: url('ui_buttons.png'); 
            background-size: 500% 200%; /* Сетка 5x2 */
            background-color: transparent !important;
            border: none; 
            outline: none;
            pointer-events: auto; 
            cursor: pointer; 
            transition: transform 0.1s, filter 0.2s; 
            -webkit-appearance: none;
            background-repeat: no-repeat;
        }
        .sprite-btn:active { transform: scale(0.9); filter: brightness(1.5); }
        
        .btn-shop { background-position: 0% 100%; width: 55px; height: 55px; }
        .btn-settings { background-position: 25% 100%; width: 50px; height: 50px; }
        .btn-quests { background-position: 50% 100%; width: 50px; height: 50px; }
        
        /* Кнопка PLAY (исправлены пропорции, чтобы не было черного фона) */
        .btn-play { 
            background-position: 0% 0%; 
            width: 190px; 
            height: 70px; /* Правильное соотношение сторон */
            position: absolute; 
            bottom: 30px; 
            right: 20px; 
            z-index: 20; 
            opacity: 0.85;
        }

        /* Статистика (Слева от байка) */
        .bike-stats {
            position: absolute; top: 55%; left: 3%; transform: translateY(-50%);
            width: 210px; padding: 10px;
            pointer-events: none; background: rgba(10, 5, 15, 0.85);
            border-radius: 10px; border: 2px solid rgba(255,255,255,0.15); z-index: 10;
            backdrop-filter: blur(5px); box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .bike-name { color: #fff; font-size: 15px; font-weight: 900; text-align: center; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .stat-row { display: flex; align-items: center; margin-bottom: 6px; }
        .stat-label { color: #ccc; font-size: 11px; width: 95px; font-weight: bold; }
        .stat-bar-bg { flex-grow: 1; height: 8px; background: #222; border-radius: 4px; overflow: hidden; border: 1px solid #000; }
        .stat-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff3333, #ffcc00, #33ff33); transition: width 0.4s ease; }

        /* Байк по центру, поднят на пол гаража */
        .bike-carousel {
            position: absolute; bottom: 12%; left: 55%; transform: translateX(-50%);
            display: flex; justify-content: center; align-items: flex-end; pointer-events: none; z-index: 10;
        }
        #menuBikeCanvas { 
            width: 300px; height: 200px; 
            filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.8));
        }

        /* --- ИГРОВОЙ ИНТЕРФЕЙС --- */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .top-bar { display: flex; justify-content: space-between; padding: 20px; align-items: flex-start; }
        .stats-left { display: flex; flex-direction: column; gap: 5px; }
        .stat-text { font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.8); text-transform: uppercase; }
        .stats-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        .score { font-size: 36px; font-weight: bold; color: white; text-shadow: 0 2px 5px #000; }
        
        .btn-game { position: absolute; width: 65px; height: 65px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.3); pointer-events: auto; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-game svg { width: 35px; height: 35px; stroke: white; stroke-width: 2.5; }
        #btnLeanBack { bottom: 150px; left: 20px; } #btnLeanForward { bottom: 60px; left: 60px; }
        #btnGas { bottom: 150px; right: 20px; } #btnBrake { bottom: 60px; right: 60px; }

        #btnPause { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 50px; height: 50px; pointer-events: auto; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.2); border-radius: 8px; }

        /* --- ЭКРАНЫ ПАУЗЫ / СМЕРТИ --- */
        #pauseScreen, #gameOverScreen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(10,5,15,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 60;
        }
        .pause-title { color: #fff; font-size: 45px; font-weight: 900; margin-bottom: 40px; letter-spacing: 5px; font-style: italic;}
        .pause-btn { background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); color: #fff; padding: 15px 40px; margin: 10px; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; width: 250px; text-align: center; text-transform: uppercase; }
        .score-header { font-size: 36px; font-weight: 900; color: #fff; margin-bottom: 20px; font-style: italic; letter-spacing: 3px; }
        .score-list { width: 100%; max-width: 500px; padding: 0 30px; }
        .score-row { display: flex; justify-content: space-between; padding: 12px 0; font-size: 18px; color: #ddd; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .score-row.high-score { font-size: 22px; font-weight: bold; color: #fff; border: none; margin-top: 15px; }
        .score-row.reward-row { font-size: 26px; font-weight: bold; color: #ffd700; border: none; margin-top: 10px; align-items: center; }
        .gameover-buttons { display: flex; gap: 30px; margin-top: 40px; }
        .icon-btn { cursor: pointer; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; }
        .icon-btn svg { width: 40px; height: 40px; stroke: #fff; stroke-width: 2.5; }
        .version-text { position: absolute; bottom: 5px; left: 5px; color: rgba(255,255,255,0.3); font-size: 12px; z-index: 100; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/planck-js@0.3/dist/planck.min.js"></script>
</head>
<body>

<!-- ЭКРАН ПОВОРОТА -->
<div id="rotateDevice">
    <svg viewBox="0 0 100 100">
        <g fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="35" y="20" width="30" height="60" rx="4" ry="4">
                <animateTransform attributeName="transform" type="rotate" values="0 50 50; 90 50 50; 90 50 50; 0 50 50" keyTimes="0; 0.4; 0.6; 1" dur="3s" repeatCount="indefinite" />
            </rect>
            <circle cx="50" cy="72" r="2">
                <animateTransform attributeName="transform" type="rotate" values="0 50 50; 90 50 50; 90 50 50; 0 50 50" keyTimes="0; 0.4; 0.6; 1" dur="3s" repeatCount="indefinite" />
            </circle>
            <line x1="45" y1="26" x2="55" y2="26">
                <animateTransform attributeName="transform" type="rotate" values="0 50 50; 90 50 50; 90 50 50; 0 50 50" keyTimes="0; 0.4; 0.6; 1" dur="3s" repeatCount="indefinite" />
            </line>
        </g>
    </svg>
    <h2>Пожалуйста, поверните устройство</h2>
</div>

<!-- ЗАСТАВКА -->
<div id="splashScreen">
    <img src="splash.png" alt="Souway Games" onerror="this.src='moto.png';">
</div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div class="hidden" id="mainMenu">
    <div class="menu-logo">NYXRIDE</div>
    
    <div class="menu-header">
        <div style="display: flex; gap: 10px; pointer-events: auto;">
            <button class="sprite-btn btn-quests" id="btnMenuQuests"></button>
            <button class="sprite-btn btn-settings" id="btnMenuSettings"></button>
        </div>
        <div style="display: flex; align-items: center;">
            <div class="coin-display">
                <img src="coin.png" onerror="this.style.display='none'">
                <span id="menuCoinBalance">0</span>
            </div>
            <button class="sprite-btn btn-shop" id="btnMenuShop"></button>
        </div>
    </div>

    <!-- Статистика -->
    <div class="bike-stats">
        <div class="bike-name" id="menuBikeName">CTM 300 EXC</div>
        <div class="stat-row"><div class="stat-label">СКОРОСТЬ</div><div class="stat-bar-bg"><div class="stat-bar-fill" id="statSpeed"></div></div></div>
        <div class="stat-row"><div class="stat-label">РАЗГОН</div><div class="stat-bar-bg"><div class="stat-bar-fill" id="statAccel"></div></div></div>
        <div class="stat-row"><div class="stat-label">СТАБИЛЬНОСТЬ</div><div class="stat-bar-bg"><div class="stat-bar-fill" id="statStabil"></div></div></div>
    </div>

    <!-- Байк -->
    <div class="bike-carousel">
        <canvas id="menuBikeCanvas" width="300" height="200"></canvas>
    </div>

    <!-- Кнопка PLAY -->
    <button class="sprite-btn btn-play" id="btnMenuPlay"></button>
</div>

<!-- ИГРОВОЙ ИНТЕРФЕЙС -->
<div class="ui-layer hidden" id="gameUI">
    <div class="top-bar">
        <div class="stats-left">
            <div class="stat-text">Best: <span id="bestDistanceText">0</span>m</div>
            <div class="stat-text" style="color: #fff3d4; display: flex; align-items: center;">
                <img src="coin.png" style="height: 24px; margin-right: 5px;" onerror="this.style.display='none'">
                <span id="coinBalanceText">0</span>
            </div>
        </div>
        <div class="stats-right">
            <div class="score"><span id="distanceText">0</span> m</div>
        </div>
    </div>
    <button id="btnPause"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></button>
    <div class="controls" id="controls">
        <div class="btn-game" id="btnLeanBack"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg></div>
        <div class="btn-game" id="btnLeanForward"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg></div>
        <div class="btn-game" id="btnGas"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
        <div class="btn-game" id="btnBrake"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></svg></div>
    </div>
</div>

<!-- ЭКРАН ПАУЗЫ -->
<div class="hidden" id="pauseScreen">
    <div class="pause-title">PAUSED</div>
    <button class="pause-btn" id="btnResume">CONTINUE</button>
    <button class="pause-btn" id="btnRestartPause">RESTART</button>
    <button class="pause-btn" id="btnHomePause">MAIN MENU</button>
</div>

<!-- ЭКРАН СМЕРТИ -->
<div id="gameOverScreen">
    <div class="score-header">SCORE</div>
    <div class="score-list">
        <div class="score-row"><span>Distance</span><span><span id="go-distance">0m</span></span></div>
        <div class="score-row"><span>Max Air Time</span><span><span id="go-airtime">0.0s</span></span></div>
        <div class="score-row"><span>Total Flips</span><span><span id="go-flips">0</span></span></div>
        <div class="score-row high-score"><span>BEST DISTANCE</span><span id="go-highscore">0</span></div>
        <div class="score-row reward-row"><span>REWARD</span><span><span id="go-coins">0</span> <img src="coin.png" style="height: 28px; vertical-align: middle;"></span></div>
    </div>
    <div class="gameover-buttons">
        <div class="icon-btn" id="btnHomeGameOver"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div>
        <div class="icon-btn" id="btnRestartGameOver"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>
<div class="version-text">v16.5</div>

<script>
    let gameState = 'splash'; 
    let splashStarted = false;
    
    const BIKE_CATALOG = [
        { id: 'cayo', name: "CAYO 125 TRAIL", density: 2.2, suspension: { freq: 4.5, damp: 0.8 }, motor: { speed: 35, torque: 40, brake: 50 } },
        { id: 'ctm', name: "CTM 300 EXC", density: 1.2, suspension: { freq: 5.5, damp: 0.7 }, motor: { speed: 50, torque: 60, brake: 100 } }
    ];
    let currentBikeIndex = 1; 
    let currentBike = BIKE_CATALOG[currentBikeIndex];

    let totalCoins = parseInt(localStorage.getItem('totalCoins')) || 0;
    let maxDistance = parseInt(localStorage.getItem('bestDistance')) || 0;
    
    let maxAirTime = 0, currentAirTime = 0;
    let frontflipCount = 0, backflipCount = 0;
    let accumulatedRotation = 0, lastAngle = 0, flipCounted = false;
    let maxWheelieTime = 0, currentWheelieTime = 0;
    let maxStoppieTime = 0, currentStoppieTime = 0;
    let particles = [], dustTimer = 0;

    const SCALE = 30; 
    let groundY = 0; 
    const startX = 50000;
    let terrainOffset = 0; 
    let cameraX = 0, cameraY = 0; 
    const zoom = 1.1; 

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        if (window.innerHeight > window.innerWidth) return;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        groundY = canvas.height - 80; 
    }

    function startSplashSequence() {
        if (splashStarted) return;
        splashStarted = true;
        setTimeout(() => {
            document.getElementById('splashScreen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splashScreen').classList.add('hidden');
                document.getElementById('mainMenu').classList.remove('hidden');
                gameState = 'menu';
                updateMenuUI();
            }, 800);
        }, 2000);
    }

    function checkOrientation() {
        const rotate = document.getElementById('rotateDevice');
        if (window.innerHeight > window.innerWidth) {
            rotate.style.display = 'flex';
        } else {
            rotate.style.display = 'none';
            if (gameState === 'splash') startSplashSequence();
        }
    }
    window.addEventListener('resize', () => { checkOrientation(); resizeCanvas(); });
    window.addEventListener('orientationchange', () => setTimeout(() => { checkOrientation(); resizeCanvas(); }, 200));

    // --- АУДИО ---
    let audioCtx, idleBuffer, popBuffer, windBuffer, revBuffer;
    let idleSource, windSource, revSource;
    let idleGain, revGain, windGain, revFilter, revTremoloGain, revLfoTone, revLfoToneGain, revLfoVol, revLfoVolGain;
    let isAudioInitialized = false, previousGasState = false, popTimer = 0; 

    async function loadAudio(url) {
        try {
            const response = await fetch(url); if (!response.ok) return null;
            const arrayBuffer = await response.arrayBuffer(); return await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) { return null; }
    }
    function createSeamlessBuffer(buffer, crossfadeTime = 2.0) {
        const sampleRate = buffer.sampleRate; const crossfadeSamples = Math.floor(crossfadeTime * sampleRate);
        const originalLength = buffer.length; const newLength = originalLength - crossfadeSamples;
        if (newLength <= 0) return buffer;
        const newBuffer = audioCtx.createBuffer(buffer.numberOfChannels, newLength, sampleRate);
        for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
            const originalData = buffer.getChannelData(channel); const newData = newBuffer.getChannelData(channel);
            for (let i = 0; i < newLength - crossfadeSamples; i++) newData[i] = originalData[i];
            for (let i = 0; i < crossfadeSamples; i++) { const ratio = i / crossfadeSamples; newData[newLength - crossfadeSamples + i] = (originalData[newLength - crossfadeSamples + i] * Math.cos(ratio * 0.5 * Math.PI)) + (originalData[i] * Math.sin(ratio * 0.5 * Math.PI)); }
        }
        return newBuffer;
    }
    async function initAudio() {
        if (isAudioInitialized) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            idleBuffer = await loadAudio('engine_idle.mp3'); popBuffer = await loadAudio('engine_pop.mp3'); windBuffer = await loadAudio('wind.mp3');
            let rawRevBuffer = await loadAudio('engine_rev.mp3'); if (rawRevBuffer) revBuffer = createSeamlessBuffer(rawRevBuffer, 2.0);

            idleGain = audioCtx.createGain(); revGain = audioCtx.createGain(); windGain = audioCtx.createGain(); revTremoloGain = audioCtx.createGain();
            idleGain.gain.value = 0; revGain.gain.value = 0; windGain.gain.value = 0; revTremoloGain.gain.value = 0.9; 
            revFilter = audioCtx.createBiquadFilter(); revFilter.type = 'lowpass'; revFilter.frequency.value = 2500; 
            idleGain.connect(audioCtx.destination); revFilter.connect(revTremoloGain); revTremoloGain.connect(revGain); revGain.connect(audioCtx.destination); windGain.connect(audioCtx.destination);

            revLfoTone = audioCtx.createOscillator(); revLfoTone.type = 'sine'; revLfoTone.frequency.value = 0.3; 
            revLfoToneGain = audioCtx.createGain(); revLfoToneGain.gain.value = 0.01; 
            revLfoTone.connect(revLfoToneGain); revLfoTone.start();
            revLfoVol = audioCtx.createOscillator(); revLfoVol.type = 'sine'; revLfoVol.frequency.value = 0.2; 
            revLfoVolGain = audioCtx.createGain(); revLfoVolGain.gain.value = 0.1; 
            revLfoVol.connect(revLfoVolGain); revLfoVolGain.connect(revTremoloGain.gain); revLfoVol.start();

            if (idleBuffer) { idleSource = audioCtx.createBufferSource(); idleSource.buffer = idleBuffer; idleSource.loop = true; idleSource.connect(idleGain); idleSource.start(); }
            if (revBuffer) { revSource = audioCtx.createBufferSource(); revSource.buffer = revBuffer; revSource.loop = true; revSource.connect(revFilter); revLfoToneGain.connect(revSource.playbackRate); revSource.start(0); }
            if (windBuffer) { windSource = audioCtx.createBufferSource(); windSource.buffer = windBuffer; windSource.loop = true; windSource.connect(windGain); windSource.start(); }
            else {
                const bufferSize = audioCtx.sampleRate * 2; const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate); const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1; windSource = audioCtx.createBufferSource(); windSource.buffer = buffer; windSource.loop = true;
                const windFilter = audioCtx.createBiquadFilter(); windFilter.type = 'lowpass'; windFilter.frequency.value = 600; windSource.connect(windFilter); windFilter.connect(windGain); windSource.start();
            }
            isAudioInitialized = true;
        } catch (e) { console.log("Ошибка аудио: ", e); }
    }
    function startRevSound() {
        if (!isAudioInitialized || !revBuffer) return;
        if (revSource) { try { revSource.stop(); revLfoToneGain.disconnect(revSource.playbackRate); } catch(e){} }
        revSource = audioCtx.createBufferSource(); revSource.buffer = revBuffer; revSource.loop = true;
        revLfoToneGain.connect(revSource.playbackRate); revSource.connect(revFilter);
        const randomOffset = Math.random() * (revBuffer.duration - 1); revSource.start(0, randomOffset);
    }
    function playPop() {
        if (!popBuffer || !audioCtx) return;
        const popSource = audioCtx.createBufferSource(); const popGain = audioCtx.createGain();
        popSource.buffer = popBuffer; popSource.connect(popGain); popGain.connect(audioCtx.destination); popGain.gain.value = 1.0; popSource.start();
    }

    // --- МЕНЮ ---
    const bikeImage = new Image(); bikeImage.src = 'moto.png';
    const menuCanvas = document.getElementById('menuBikeCanvas');
    const menuCtx = menuCanvas.getContext('2d');

    function drawMenuBike() {
        menuCtx.clearRect(0, 0, menuCanvas.width, menuCanvas.height);
        menuCtx.save();
        
        // Приземляем байк на пол холста (чуть выше нижнего края)
        menuCtx.translate(menuCanvas.width / 2, menuCanvas.height - 30);
        
        // Увеличиваем всего лишь чуть-чуть (было 2.0, стало 1.3)
        menuCtx.scale(1.3, 1.3);
        
        if (bikeImage.complete && bikeImage.naturalWidth !== 0) menuCtx.drawImage(bikeImage, -45, -45, 90, 54);
        
        let r = 10; let wheelBase = 23;
        
        // Заднее колесо
        menuCtx.beginPath(); menuCtx.arc(-wheelBase, 0, r, 0, Math.PI * 2); menuCtx.fillStyle = '#000'; menuCtx.fill();
        menuCtx.beginPath(); menuCtx.arc(-wheelBase, 0, r - 3.5, 0, Math.PI * 2); menuCtx.strokeStyle = '#222'; menuCtx.lineWidth = 2; menuCtx.stroke();
        menuCtx.strokeStyle = '#555'; menuCtx.lineWidth = 1;
        for (let i = 0; i < 6; i++) { let a = (i / 6) * Math.PI * 2; menuCtx.beginPath(); menuCtx.moveTo(-wheelBase, 0); menuCtx.lineTo(-wheelBase + Math.cos(a) * (r - 3.5), Math.sin(a) * (r - 3.5)); menuCtx.stroke(); }
        menuCtx.beginPath(); menuCtx.arc(-wheelBase, 0, 2, 0, Math.PI * 2); menuCtx.fillStyle = '#444'; menuCtx.fill();

        // Переднее колесо
        menuCtx.beginPath(); menuCtx.arc(wheelBase, 0, r, 0, Math.PI * 2); menuCtx.fillStyle = '#000'; menuCtx.fill();
        menuCtx.beginPath(); menuCtx.arc(wheelBase, 0, r - 3.5, 0, Math.PI * 2); menuCtx.strokeStyle = '#222'; menuCtx.lineWidth = 2; menuCtx.stroke();
        menuCtx.strokeStyle = '#555'; menuCtx.lineWidth = 1;
        for (let i = 0; i < 6; i++) { let a = (i / 6) * Math.PI * 2; menuCtx.beginPath(); menuCtx.moveTo(wheelBase, 0); menuCtx.lineTo(wheelBase + Math.cos(a) * (r - 3.5), Math.sin(a) * (r - 3.5)); menuCtx.stroke(); }
        menuCtx.beginPath(); menuCtx.arc(wheelBase, 0, 2, 0, Math.PI * 2); menuCtx.fillStyle = '#444'; menuCtx.fill();
        
        menuCtx.restore();
    }
    bikeImage.onload = () => { drawMenuBike(); };

    function updateMenuUI() {
        currentBike = BIKE_CATALOG[currentBikeIndex];
        document.getElementById('menuBikeName').innerText = currentBike.name;
        let speedPct = (currentBike.motor.speed / 60) * 100;
        let accelPct = (currentBike.motor.torque / 70) * 100;
        let stabilPct = (currentBike.density / 2.5) * 100; 
        document.getElementById('statSpeed').style.width = Math.min(100, speedPct) + '%';
        document.getElementById('statAccel').style.width = Math.min(100, accelPct) + '%';
        document.getElementById('statStabil').style.width = Math.min(100, stabilPct) + '%';
        document.getElementById('menuCoinBalance').innerText = totalCoins;
        drawMenuBike();
    }

    document.getElementById('btnMenuPlay').addEventListener('click', () => {
        initAudio(); 
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('gameUI').classList.remove('hidden');
        document.getElementById('gameOverScreen').style.display = 'none';
        resizeCanvas(); gameState = 'playing'; resetGame();
    });

    // --- ФИЗИКА И ИГРА ---
    const pl = planck; const world = new pl.World({ gravity: pl.Vec2(0, 10) });
    world.on('begin-contact', (contact) => {
        if (gameState !== 'playing') return;
        const dataA = contact.getFixtureA().getUserData(); const dataB = contact.getFixtureB().getUserData();
        if ((dataA === 'head' && dataB === 'terrain') || (dataB === 'head' && dataA === 'terrain')) triggerGameOver();
    });

    function hash32(a, b, c) { let h = (a | 0) ^ Math.imul(b | 0, 0x9E3779B1) ^ Math.imul(c | 0, 0x85EBCA77); h ^= h >>> 16; h = Math.imul(h, 0x85EBCA6B); h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
    let sessionSeed = 0; const zoneCache = new Map(); 
    function getDepthForDist(distM) { if (distM < 800) return null; if (distM < 2000) return { min: 15, max: 20 }; if (distM < 5000) return { min: 25, max: 35 }; if (distM < 10000) return { min: 35, max: 45 }; return { min: 45, max: 60 }; }
    function erosionProfile(lx, ew, fw, xw, d, s) { let t = ew + fw + xw; if (lx < 0 || lx > t) return 0; if (lx < ew) { let p = lx / ew; return d * p * p * (3 - 2 * p); } if (lx < ew + fw) { let p = (lx - ew) / fw; return d + s * p; } let p = (lx - ew - fw) / xw; return (d + s) * (1 - p * p * (3 - 2 * p)); }
    function getTerrainYNoErosion(x) { let y = groundY; let u = x + terrainOffset; let df = x - startX; let hs = Math.min(2.0, 1.0 + (Math.max(0, df) / 20000)); let bh = Math.sin(u * 0.001) * 80 * hs; let m = Math.sin(u * 0.015) * 2; let sh = Math.pow(Math.sin(u * 0.003), 3) * 180; let g = Math.pow(Math.max(0, Math.sin(u * 0.00125)), 6); let k = sh * g; let my = y - bh - k - m; if (df < 1000) { let f = Math.max(0, df / 1000); let fy = groundY - (df * 0.02); return fy * (1 - f) + my * f; } return my; }
    function isOnKicker(x) { let u = x + terrainOffset; return Math.abs(Math.pow(Math.sin(u * 0.003), 3) * 180 * Math.pow(Math.max(0, Math.sin(u * 0.00125)), 6)) > 50; }
    function buildErosionZone(cs, ci, zi, dr, wt) {
        let emin = dr.min * 1.5; let emax = dr.max * 2.5; let xmin = dr.min * 1.2; let xmax = dr.max * 2.0;
        let gmin, gmax, cmin, cmax; if (wt === 1) { gmin = 15; gmax = 35; cmin = 1; cmax = 3; } else if (wt === 2) { gmin = 10; gmax = 25; cmin = 2; cmax = 4; } else { gmin = 8; gmax = 20; cmin = 3; cmax = 5; }
        let zl = 600 + hash32(sessionSeed, ci, 2 + zi * 10) * 600; let zs = cs + 1500 + hash32(sessionSeed, ci, 1 + zi * 10) * 6000;
        let att = 0; while (att < 3 && (isOnKicker(zs) || isOnKicker(zs + zl))) { zs += 500; att++; } if (zs + zl > cs + 9900) return null;
        let c = cmin + Math.floor(hash32(sessionSeed, ci, 3 + zi * 10) * (cmax - cmin + 1)); let h = [], cur = 0;
        for (let i = 0; i < c; i++) {
            if (i > 0) cur += gmin + hash32(sessionSeed, ci, 100 + i + zi * 20) * (gmax - gmin);
            let ew = emin + hash32(sessionSeed, ci, 200 + i + zi * 20) * (emax - emin); let fw = 15 + hash32(sessionSeed, ci, 300 + i + zi * 20) * 15;
            let xw = xmin + hash32(sessionSeed, ci, 400 + i + zi * 20) * (xmax - xmin); let tw = ew + fw + xw; if (cur + tw > zl) break;
            let d = dr.min + hash32(sessionSeed, ci, 500 + i + zi * 20) * (dr.max - dr.min); let s = (hash32(sessionSeed, ci, 600 + i + zi * 20) - 0.5) * 6;
            h.push({ x: zs + cur, entryW: ew, floorW: fw, exitW: xw, depth: d, slope: s }); cur += tw;
        }
        if (h.length === 0) return null; return { type: 'erosion', start: zs, end: zs + zl, holes: h };
    }
    function computeZones(ci) { let cs = ci * 10000; let cd = cs / 10; let dr = getDepthForDist(cd); if (!dr) return []; let zc = 1; if (cd >= 12000) zc = 3; else if (cd >= 6000) zc = 2; let wt = 1; if (cd >= 10000) wt = 3; else if (cd >= 5000) wt = 2; let z = []; for (let i = 0; i < zc; i++) { let nz = buildErosionZone(cs, ci, i, dr, wt); if (nz) z.push(nz); } return z; }
    function getZonesCached(ci) { if (!zoneCache.has(ci)) zoneCache.set(ci, computeZones(ci)); return zoneCache.get(ci); }
    function getTerrainY(x) { let my = getTerrainYNoErosion(x); let z = getZonesCached(Math.floor(x / 10000)); for (let n of z) { if (x >= n.start && x <= n.end) { for (let h of n.holes) { let lx = x - h.x; if (lx >= 0 && lx <= h.entryW + h.floorW + h.exitW) my += erosionProfile(lx, h.entryW, h.floorW, h.exitW, h.depth, h.slope); } } } return my; }

    let terrainBodies = [], lastGeneratedX = startX - 1500; 
    function generateTerrain() { while (lastGeneratedX < cameraX + (canvas.width / zoom) + 1000) { let v = []; for (let i = 0; i <= 200; i++) v.push(pl.Vec2((lastGeneratedX + i) / SCALE, getTerrainY(lastGeneratedX + i) / SCALE)); const c = world.createBody(); let f = c.createFixture(pl.Chain(v, false), { friction: 1.0, restitution: 0.0 }); f.setUserData('terrain'); terrainBodies.push({ body: c, endX: lastGeneratedX + 200 }); lastGeneratedX += 200; } }
    function cleanupTerrain() { for (let i = terrainBodies.length - 1; i >= 0; i--) { if (terrainBodies[i].endX < cameraX - 1500) { world.destroyBody(terrainBodies[i].body); terrainBodies.splice(i, 1); } } }

    const wheelRadius = 10 / SCALE; const wheelBase = 23 / SCALE; let chassis, wheelRear, wheelFront, jointRear, jointFront;
    function createBike(x, y) {
        if (chassis) { world.destroyBody(chassis); world.destroyBody(wheelRear); world.destroyBody(wheelFront); }
        chassis = world.createBody({ position: pl.Vec2(x / SCALE, y / SCALE), type: 'dynamic', bullet: true }); chassis.createFixture(pl.Box(53 / SCALE / 2, 6 / SCALE / 2, pl.Vec2(0, -18 / SCALE)), { density: currentBike.density, friction: 0.3 });
        let hs = pl.Circle(8 / SCALE); hs.m_p.set(0, -35 / SCALE); let hf = chassis.createFixture(hs, { isSensor: true }); hf.setUserData('head');
        wheelRear = world.createBody({ position: pl.Vec2((x - wheelBase * SCALE) / SCALE, y / SCALE), type: 'dynamic', bullet: true }); wheelRear.createFixture(pl.Circle(wheelRadius), { density: 1.0, friction: 1.0 });
        wheelFront = world.createBody({ position: pl.Vec2((x + wheelBase * SCALE) / SCALE, y / SCALE), type: 'dynamic', bullet: true }); wheelFront.createFixture(pl.Circle(wheelRadius), { density: 1.0, friction: 1.0 });
        jointRear = world.createJoint(pl.WheelJoint({ motorSpeed: 0, maxMotorTorque: currentBike.motor.torque, enableMotor: true, frequencyHz: currentBike.suspension.freq, dampingRatio: currentBike.suspension.damp }, chassis, wheelRear, wheelRear.getPosition(), pl.Vec2(0, 1)));
        jointFront = world.createJoint(pl.WheelJoint({ motorSpeed: 0, maxMotorTorque: currentBike.motor.torque, enableMotor: true, frequencyHz: currentBike.suspension.freq, dampingRatio: currentBike.suspension.damp }, chassis, wheelFront, wheelFront.getPosition(), pl.Vec2(0, 1)));
    }

    window.isGas = false; window.isBrake = false; window.isLeanBack = false; window.isLeanForward = false;
    function bindBtn(id, v) { const el = document.getElementById(id); el.addEventListener('touchstart', e => { e.preventDefault(); if(gameState === 'playing') window[v] = true; }); el.addEventListener('touchend', e => { e.preventDefault(); window[v] = false; }); el.addEventListener('mousedown', e => { e.preventDefault(); if(gameState === 'playing') window[v] = true; }); el.addEventListener('mouseup', e => { e.preventDefault(); window[v] = false; }); }
    bindBtn('btnGas', 'isGas'); bindBtn('btnBrake', 'isBrake'); bindBtn('btnLeanBack', 'isLeanBack'); bindBtn('btnLeanForward', 'isLeanForward');

    document.getElementById('btnPause').addEventListener('click', () => { if (gameState === 'playing') { gameState = 'paused'; document.getElementById('pauseScreen').style.display = 'flex'; } });
    document.getElementById('btnResume').addEventListener('click', () => { gameState = 'playing'; document.getElementById('pauseScreen').style.display = 'none'; });
    document.getElementById('btnRestartPause').addEventListener('click', () => { document.getElementById('pauseScreen').style.display = 'none'; gameState = 'playing'; resetGame(); });
    document.getElementById('btnHomePause').addEventListener('click', () => { document.getElementById('pauseScreen').style.display = 'none'; document.getElementById('gameUI').classList.add('hidden'); document.getElementById('mainMenu').classList.remove('hidden'); gameState = 'menu'; updateMenuUI(); });
    document.getElementById('btnRestartGameOver').addEventListener('click', () => { document.getElementById('gameOverScreen').style.display = 'none'; gameState = 'playing'; resetGame(); });
    document.getElementById('btnHomeGameOver').addEventListener('click', () => { document.getElementById('gameOverScreen').style.display = 'none'; document.getElementById('gameUI').classList.add('hidden'); document.getElementById('mainMenu').classList.remove('hidden'); gameState = 'menu'; updateMenuUI(); });

    function resetGame() {
        sessionSeed = Math.floor(Math.random() * 0xFFFFFFFF); zoneCache.clear(); terrainOffset = Math.random() * 10000;
        for (let b of terrainBodies) world.destroyBody(b.body); terrainBodies = []; lastGeneratedX = startX - 1500; cameraX = startX - (canvas.width * 0.3);
        createBike(startX, getTerrainY(startX) - 60); generateTerrain();
        window.isGas = false; window.isBrake = false; window.isLeanBack = false; window.isLeanForward = false;
        maxAirTime = 0; currentAirTime = 0; frontflipCount = 0; backflipCount = 0; flipCounted = false;
        accumulatedRotation = 0; lastAngle = chassis.getAngle(); maxWheelieTime = 0; currentWheelieTime = 0;
        maxStoppieTime = 0; currentStoppieTime = 0; particles = []; dustTimer = 0; popTimer = 0;
        document.getElementById('coinBalanceText').innerText = totalCoins; document.getElementById('distanceText').innerText = "0";
        if (isAudioInitialized) { idleGain.gain.setValueAtTime(0.4, audioCtx.currentTime); revGain.gain.setValueAtTime(0, audioCtx.currentTime); windGain.gain.setValueAtTime(0, audioCtx.currentTime); if (revFilter) revFilter.frequency.value = 2500; startRevSound(); }
    }

    function triggerGameOver() {
        gameState = 'gameover'; window.isGas = false; 
        let dist = Math.max(0, Math.floor(((chassis.getPosition().x * SCALE) - startX) / 10));
        let earnedCoins = Math.floor(dist / 100) + Math.floor(maxAirTime) + (frontflipCount + backflipCount) * 10;
        totalCoins += earnedCoins; localStorage.setItem('totalCoins', totalCoins);
        if (dist > maxDistance) { maxDistance = dist; localStorage.setItem('bestDistance', maxDistance); }
        document.getElementById('go-distance').innerText = dist + "m"; document.getElementById('go-airtime').innerText = maxAirTime.toFixed(1) + "s";
        document.getElementById('go-flips').innerText = (frontflipCount + backflipCount); document.getElementById('go-highscore').innerText = maxDistance + "m";
        document.getElementById('go-coins').innerText = earnedCoins; document.getElementById('gameOverScreen').style.display = 'flex';
        if (isAudioInitialized) { idleGain.gain.setValueAtTime(0, audioCtx.currentTime); revGain.gain.setValueAtTime(0, audioCtx.currentTime); windGain.gain.setValueAtTime(0, audioCtx.currentTime); }
    }

    function drawMountainLayer(yOff, h, c, p) { ctx.fillStyle = c; ctx.beginPath(); let sx = Math.floor(cameraX) - 100; let ex = Math.floor(cameraX) + (canvas.width / zoom) + 100; ctx.moveTo(sx, groundY + 2000); for (let x = sx; x <= ex; x += 10) { let wx = x + p; let j = Math.abs(Math.sin(wx * 0.004)) * h; let n = Math.sin(wx * 0.02) * (h * 0.15) + Math.cos(wx * 0.01) * (h * 0.1); ctx.lineTo(x, groundY - yOff - j - n); } ctx.lineTo(ex, groundY + 2000); ctx.closePath(); ctx.fill(); }
    function drawTerrain() { ctx.fillStyle = '#000'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cameraX - 100, groundY + 2000); let sx = Math.floor(cameraX) - 100; let ex = Math.floor(cameraX) + (canvas.width / zoom) + 100; for (let x = sx; x <= ex; x += 2) ctx.lineTo(x, getTerrainY(x)); ctx.lineTo(ex, groundY + 2000); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    function drawWheel(wheel) { ctx.save(); ctx.translate(wheel.getPosition().x * SCALE, wheel.getPosition().y * SCALE); ctx.rotate(wheel.getAngle()); let r = wheelRadius * SCALE; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill(); ctx.beginPath(); ctx.arc(0, 0, r - 3.5, 0, Math.PI * 2); ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.stroke(); ctx.strokeStyle = '#555'; ctx.lineWidth = 1; for (let i = 0; i < 6; i++) { let a = (i / 6) * Math.PI * 2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * (r - 3.5), Math.sin(a) * (r - 3.5)); ctx.stroke(); } ctx.restore(); }
    function spawnDust(x, y, sx, t) { if (particles.length > 80) return; let c = t === 'brake' ? 2 : 1, bvy = t === 'brake' ? -5 : -2; for (let i = 0; i < c; i++) { particles.push({ x: x + (Math.random() - 0.5) * 8, y: y, baseVx: -Math.random() * 3, vy: bvy, radius: 3 + Math.random() * 4, growth: 1 + Math.random(), alphaMax: 0.4, alpha: 0.4, age: 0, maxAge: 1.0 + Math.random() }); } }
    function updateParticles(dt) { for (let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.age += dt; let pr = p.age / p.maxAge; if (pr >= 1) { particles.splice(i, 1); continue; } p.x += p.baseVx * (1 + pr); p.vy += 0.15; p.y += p.vy; p.radius += p.growth; p.alpha = p.alphaMax * Math.pow(1 - pr, 1.5); if (p.alpha <= 0.01) particles.splice(i, 1); } }
    function drawParticles() { for (let p of particles) { let g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius); g.addColorStop(0, `rgba(140, 105, 75, ${p.alpha})`); g.addColorStop(1, 'rgba(200, 160, 120, 0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); } }

    let lastTime = performance.now();
    function update() {
        requestAnimationFrame(update); let dt = (performance.now() - lastTime) / 1000; lastTime = performance.now(); if (dt > 0.1) dt = 0.1; 

        if (gameState === 'playing' && chassis) {
            world.step(1/60, dt, 3); let ws = Math.abs(wheelRear.getAngularVelocity()); let ls = Math.abs(chassis.getLinearVelocity().x) * SCALE; 
            let cx = chassis.getPosition().x * SCALE; let cy = chassis.getPosition().y * SCALE; let gu = getTerrainY(cx); let ia = (cy < gu - 25); 
            let a = chassis.getAngle(); let da = a - lastAngle; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI;
            if (ia) { accumulatedRotation += da; currentAirTime += dt; if (currentAirTime > maxAirTime) maxAirTime = currentAirTime; if (!flipCounted && Math.abs(accumulatedRotation) >= Math.PI * 1.7 && currentAirTime > 0.3) { if (accumulatedRotation > 0) frontflipCount++; else backflipCount++; flipCounted = true; } } 
            else {
                currentAirTime = 0; accumulatedRotation = 0; flipCounted = false;
                if (a < -0.3 && ls > 5) { currentWheelieTime += dt; if (currentWheelieTime > maxWheelieTime) maxWheelieTime = currentWheelieTime; } else { currentWheelieTime = 0; }
                if (a > 0.3 && ls > 5) { currentStoppieTime += dt; if (currentStoppieTime > maxStoppieTime) maxStoppieTime = currentStoppieTime; } else { currentStoppieTime = 0; }
                if (ls > 5) { dustTimer += dt; if (dustTimer > 0.06) { let wp = wheelRear.getPosition(); let dx = wp.x * SCALE; let dy = wp.y * SCALE + (wheelRadius * SCALE); if (window.isBrake && ls > 10) spawnDust(dx, dy, chassis.getLinearVelocity().x * SCALE, 'brake'); else if (window.isGas) spawnDust(dx, dy, chassis.getLinearVelocity().x * SCALE, 'gas'); else if (ls > 15) spawnDust(dx, dy, chassis.getLinearVelocity().x * SCALE, 'roll'); dustTimer = 0; } } else { dustTimer = 0.05; }
            }
            lastAngle = a; 
            if (window.isGas) { jointRear.setMotorSpeed(currentBike.motor.speed); jointFront.setMotorSpeed(currentBike.motor.speed); jointRear.setMaxMotorTorque(currentBike.motor.torque); jointFront.setMaxMotorTorque(currentBike.motor.torque); } else if (window.isBrake) { jointRear.setMotorSpeed(0); jointFront.setMotorSpeed(0); jointRear.setMaxMotorTorque(currentBike.motor.brake); jointFront.setMaxMotorTorque(currentBike.motor.brake); } else { jointRear.setMaxMotorTorque(0); jointFront.setMaxMotorTorque(0); }
            let tp = 20; let mts = 2.5; if (window.isLeanBack) { if (chassis.getAngularVelocity() > -mts) chassis.applyTorque(-tp, true); } else if (window.isLeanForward) { if (chassis.getAngularVelocity() < mts) chassis.applyTorque(tp, true); }
            if (isAudioInitialized) { if (window.isGas) { idleGain.gain.cancelScheduledValues(audioCtx.currentTime); idleGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05); } else { idleGain.gain.cancelScheduledValues(audioCtx.currentTime); idleGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.1); } let tr = window.isGas ? 0.8 : 0; let tw = Math.min(0.3, 0.05 + ws * 0.15); revGain.gain.setTargetAtTime(tr, audioCtx.currentTime, 0.1); windGain.gain.setTargetAtTime(tw, audioCtx.currentTime, 0.1); if (window.isGas && revSource) { let trate = 1.0 + (ws * 0.3); let frate = Math.min(1.3, trate); revSource.playbackRate.setTargetAtTime(frate, audioCtx.currentTime, 0.1); let tf = Math.max(1000, 2500 - (ws * 1000)); revFilter.frequency.setTargetAtTime(tf, audioCtx.currentTime, 0.1); previousGasState = true; } else { previousGasState = false; } if (!window.isGas && ws > 2) { popTimer += dt; if (popTimer > 1.0 && Math.random() < 0.02) { playPop(); popTimer = 0; } } else { popTimer = 0; } }
            if (chassis.getPosition().y > groundY + 1000) triggerGameOver();
            let tcx = (chassis.getPosition().x * SCALE) - ((canvas.width * 0.3) / zoom); cameraX += (tcx - cameraX) * 0.1; 
            let tcy = (canvas.height * 0.5) - (chassis.getPosition().y * SCALE); cameraY += (tcy - cameraY) * 0.1;
            generateTerrain(); cleanupTerrain(); updateParticles(dt);
            let cd = Math.max(0, Math.floor(((chassis.getPosition().x * SCALE) - startX) / 10)); document.getElementById('distanceText').innerText = cd; document.getElementById('coinBalanceText').innerText = totalCoins + Math.floor(cd / 100);
            if (cd > maxDistance) { maxDistance = cd; localStorage.setItem('bestDistance', maxDistance); document.getElementById('bestDistanceText').innerText = maxDistance; }
        }

        if (gameState === 'playing' || gameState === 'gameover' || gameState === 'paused') {
            ctx.clearRect(0, 0, canvas.width, canvas.height); const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
            g.addColorStop(0, '#2b0b46'); g.addColorStop(0.4, '#842a66'); g.addColorStop(0.7, '#e65c41'); g.addColorStop(1, '#f5a354'); ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
            let sx = canvas.width * 0.75; let sy = canvas.height * 0.35; let sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 150);
            sg.addColorStop(0, 'rgba(255, 243, 212, 0.8)'); sg.addColorStop(1, 'rgba(255, 243, 212, 0)'); ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 150, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff3d4'; ctx.beginPath(); ctx.arc(sx, sy, 45, 0, Math.PI * 2); ctx.fill();
            ctx.save(); ctx.scale(zoom, zoom); ctx.translate(-cameraX, cameraY); drawMountainLayer(180, 120, '#2d163d', cameraX * 0.2); drawMountainLayer(100, 180, '#15081c', cameraX * 0.5); ctx.restore();
            ctx.save(); ctx.scale(zoom, zoom); ctx.translate(0, cameraY); ctx.translate(-cameraX, 0);
            drawTerrain();
            if (gameState !== 'gameover' && chassis) {
                drawParticles(); ctx.save(); ctx.translate(chassis.getPosition().x * SCALE, chassis.getPosition().y * SCALE); ctx.rotate(chassis.getAngle());
                if (bikeImage.complete) ctx.drawImage(bikeImage, -45, -45, 90, 54); 
                ctx.restore(); drawWheel(wheelRear); drawWheel(wheelFront);
            }
            ctx.restore(); 
        }
    }

    window.addEventListener('load', checkOrientation); 
    checkOrientation(); resizeCanvas(); update();
</script>
