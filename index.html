<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skyline Moto</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            touch-action: none; -webkit-user-select: none; user-select: none; 
            font-family: sans-serif;
        }
        canvas { display: block; touch-action: none; }

        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        .top-bar {
            display: flex; justify-content: space-between; padding: 20px;
        }
        .btn-ui {
            background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.4);
            border-radius: 10px; color: white; padding: 6px 14px;
            font-size: 18px; font-weight: bold; pointer-events: auto;
        }
        .score {
            font-size: 28px; font-weight: bold; color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* --- КНОПКИ СТРОГО ПО ДИАГОНАЛИ --- */
        .btn {
            position: absolute;
            width: 70px; height: 70px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.05); 
            border: 3px solid rgba(255, 255, 255, 0.5);
            display: flex; align-items: center; justify-content: center;
            pointer-events: auto; color: white;
            transition: background 0.1s;
        }
        .btn:active { background: rgba(255, 255, 255, 0.3); }
        
        .btn svg {
            width: 32px; height: 32px; fill: none; stroke: rgba(255, 255, 255, 0.7);
            stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
        }

        /* Расположение кнопок (лесенкой) */
        #btnLeanBack    { bottom: 120px; left: 25px; }  /* Левая верхняя */
        #btnLeanForward { bottom: 30px;  left: 80px; }  /* Левая нижняя */
        
        #btnGas         { bottom: 120px; right: 25px; } /* Правая верхняя */
        #btnBrake       { bottom: 30px;  right: 80px; } /* Правая нижняя */
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="ui-layer">
    <div class="top-bar">
        <div class="btn-ui">II</div>
        <div class="score"><span id="distanceText">0</span> m</div>
    </div>

    <!-- Кнопки -->
    <div class="btn" id="btnLeanBack">
        <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
    </div>
    <div class="btn" id="btnLeanForward">
        <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg>
    </div>
    
    <div class="btn" id="btnGas">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="rgba(255,255,255,0.6)" stroke="none"/></svg>
    </div>
    <div class="btn" id="btnBrake">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M4.93 4.93l14.14 14.14"/></svg>
    </div>
</div>

<script>
    document.addEventListener('touchmove', function(e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
    }, { passive: false });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();

    const Engine = Matter.Engine,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite,
          Constraint = Matter.Constraint,
          Body = Matter.Body;

    const engine = Engine.create();
    const world = engine.world;
    engine.gravity.y = 1.2; 

    const startX = 50000;
    let groundY = canvas.height - 80; 
    let ground = Bodies.rectangle(startX, groundY + 50, 100000, 100, { isStatic: true });

    // --- ФИЗИКА (МАЛЕНЬКИЕ КОЛЕСА, КОРОТКАЯ БАЗА) ---
    const wheelRadius = 11; // Тонкие, аккуратные колеса
    const wheelBase = 30;   // Расстояние от центра рамы до колеса (всего 60px между ними)
    
    const wheelRear = Bodies.circle(startX - wheelBase, 100, wheelRadius, { density: 0.05, friction: 1 });
    const wheelFront = Bodies.circle(startX + wheelBase, 100, wheelRadius, { density: 0.05, friction: 1 });
    const chassis = Bodies.rectangle(startX, 90, 70, 15, { density: 0.1, inertia: Infinity }); 

    const suspensionRear = Constraint.create({ 
        bodyA: wheelRear, pointB: { x: -wheelBase, y: 0 }, bodyB: chassis, 
        stiffness: 0.2, damping: 0.4, length: 0 
    });
    const suspensionFront = Constraint.create({ 
        bodyA: wheelFront, pointB: { x: wheelBase, y: 0 }, bodyB: chassis, 
        stiffness: 0.2, damping: 0.4, length: 0 
    });

    const moto = Composite.create({ bodies: [wheelRear, wheelFront, chassis], constraints: [suspensionRear, suspensionFront] });
    Composite.add(world, [ground, moto]);

    const bikeImage = new Image();
    bikeImage.src = 'moto.png'; 
    let isImageLoaded = false;
    bikeImage.onload = () => { isImageLoaded = true; };

    window.isGas = false; window.isBrake = false; window.isLeanBack = false; window.isLeanForward = false;

    function bindBtn(id, variableName) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); window[variableName] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); window[variableName] = false; });
        el.addEventListener('touchcancel', (e) => { e.preventDefault(); window[variableName] = false; });
    }
    
    bindBtn('btnGas', 'isGas');
    bindBtn('btnBrake', 'isBrake');
    bindBtn('btnLeanBack', 'isLeanBack');
    bindBtn('btnLeanForward', 'isLeanForward');

    let cameraX = startX - (canvas.width * 0.3);
    const zoom = 1.1; 

    let maxDistance = 0;
    const distanceText = document.getElementById('distanceText');

    function drawMountainLayer(yOffset, height, color, parallaxOffset) {
        ctx.fillStyle = color;
        ctx.beginPath();
        let startDrawX = Math.floor(cameraX) - 100;
        let endDrawX = Math.floor(cameraX) + (canvas.width / zoom) + 100;
        ctx.moveTo(startDrawX, canvas.height * 1.5);
        for (let x = startDrawX; x <= endDrawX; x += 10) {
            let worldX = x + parallaxOffset;
            let y = (canvas.height - yOffset) - Math.sin(worldX * 0.005) * height - Math.cos(worldX * 0.01) * (height / 2);
            ctx.lineTo(x, y);
        }
        ctx.lineTo(endDrawX, canvas.height * 1.5);
        ctx.closePath();
        ctx.fill();
    }

    function drawTerrain() {
        ctx.fillStyle = '#000'; 
        ctx.beginPath();
        let startDrawX = Math.floor(cameraX) - 100;
        let endDrawX = Math.floor(cameraX) + (canvas.width / zoom) + 100;
        let terrainY = canvas.height - 80;
        
        ctx.moveTo(startDrawX, canvas.height * 1.5);
        ctx.lineTo(startDrawX, terrainY);
        ctx.lineTo(endDrawX, terrainY);
        ctx.lineTo(endDrawX, canvas.height * 1.5);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        for (let x = startDrawX; x <= endDrawX; x += 20) {
            let patch = Math.sin(x * 0.03); 
            if (patch > 0.6) {
                let y = terrainY; 
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath(); 
                    ctx.moveTo(x + (i * 4) - 4, y + 2);
                    ctx.lineTo(x + (i * 4) - 4 + Math.sin(x * 0.1 + i) * 6, y - (6 + Math.cos(x * 0.2 + i) * 4)); 
                    ctx.stroke();
                }
            }
        }
    }

    // --- ТОНКИЕ КОЛЕСА (БЕЗ АВТОМОБИЛЬНОГО ДИСКА) ---
    function drawWheel(wheel) {
        ctx.save();
        ctx.translate(wheel.position.x, wheel.position.y);
        ctx.rotate(wheel.angle);
        
        // Черная шина
        ctx.fillStyle = '#000'; 
        ctx.beginPath(); ctx.arc(0, 0, wheelRadius, 0, Math.PI * 2); ctx.fill();

        // Тонкий темный обод
        ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, wheelRadius - 2, 0, Math.PI * 2); ctx.stroke();

        // Тонкие спицы (крестик)
        ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
        for (let i = 0; i < 4; i++) {
            let angle = (i / 4) * Math.PI * 2;
            ctx.beginPath(); 
            ctx.moveTo(0, 0); 
            ctx.lineTo(Math.cos(angle) * (wheelRadius - 2), Math.sin(angle) * (wheelRadius - 2)); 
            ctx.stroke();
        }
        ctx.restore();
    }

    function update() {
        if (window.isGas) { 
            Body.setAngularVelocity(wheelRear, 0.4); 
            Body.setAngularVelocity(wheelFront, 0.4); 
        }
        if (window.isBrake) { 
            Body.setAngularVelocity(wheelRear, 0); 
            Body.setAngularVelocity(wheelFront, 0); 
        }
        
        if (window.isLeanBack) {
            Body.applyForce(chassis, chassis.position, { x: 0, y: -0.003 });
        }
        if (window.isLeanForward) {
            Body.applyForce(chassis, chassis.position, { x: 0, y: 0.003 });
        }

        let targetCameraX = chassis.position.x - ((canvas.width * 0.3) / zoom);
        cameraX += (targetCameraX - cameraX) * 0.1; 
        
        let currentDistance = Math.max(0, Math.floor((chassis.position.x - startX) / 10));
        if (currentDistance > maxDistance) {
            maxDistance = currentDistance;
            distanceText.innerText = maxDistance;
        }

        if (chassis.position.y > canvas.height + 200) {
            let spawnX = cameraX + (canvas.width * 0.3) / zoom;
            Body.setPosition(chassis, { x: spawnX, y: 100 });
            Body.setPosition(wheelRear, { x: spawnX - wheelBase, y: 100 });
            Body.setPosition(wheelFront, { x: spawnX + wheelBase, y: 100 });
            Body.setVelocity(chassis, { x: 0, y: 0 }); Body.setVelocity(wheelRear, { x: 0, y: 0 }); Body.setVelocity(wheelFront, { x: 0, y: 0 });
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#1a0b2e'); gradient.addColorStop(0.4, '#5a2b58'); gradient.addColorStop(0.7, '#d96b4e'); gradient.addColorStop(1, '#f5c26b');
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#fff3d4'; ctx.beginPath(); ctx.arc(canvas.width * 0.75, canvas.height * 0.35, 45, 0, Math.PI * 2); ctx.fill();

        ctx.save();
        ctx.scale(zoom, zoom);
        ctx.translate(0, (canvas.height * (1 - zoom)) / zoom);
        ctx.translate(-cameraX, 0);

        drawMountainLayer(120, 60, '#3a2354', cameraX * 0.2);
        drawMountainLayer(60, 100, '#1e1129', cameraX * 0.5);
        drawTerrain();

        // --- МОТОЦИКЛ (ОРИГИНАЛЬНЫЙ РАЗМЕР, БЕЗ РАСТЯГИВАНИЯ) ---
        ctx.save();
        ctx.translate(chassis.position.x, chassis.position.y);
        ctx.rotate(chassis.angle);
        
        if (isImageLoaded) {
            // Размер 90x54 (оригинальные пропорции)
            ctx.drawImage(bikeImage, -45, -35, 90, 54); 
        }
        ctx.restore();

        drawWheel(wheelRear);
        drawWheel(wheelFront);

        ctx.restore(); 
        requestAnimationFrame(update);
    }

    const runner = Runner.create();
    Runner.run(runner, engine);
    update();
    window.addEventListener('resize', () => { resizeCanvas(); groundY = canvas.height - 80; Body.setPosition(ground, { x: startX, y: groundY + 50 }); });
</script>
</body>
</html>
