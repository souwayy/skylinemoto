<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skyline Moto</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            touch-action: none; -webkit-user-select: none; user-select: none; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas { display: block; touch-action: none; }

        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        .top-bar {
            display: flex; justify-content: space-between; padding: 20px;
            align-items: flex-start;
        }
        
        .stats-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .stat-text {
            font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .stats-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }
        .clock {
            font-size: 18px;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            font-family: monospace;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .score {
            font-size: 32px; font-weight: bold; color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            line-height: 1;
        }

        .btn {
            position: absolute;
            width: 55px; height: 55px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.4) 100%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(0,0,0,0.5), inset 0 0 8px rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            pointer-events: auto; color: white;
            transition: transform 0.1s, background 0.1s;
        }
        .btn:active { 
            transform: scale(0.95);
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, rgba(0,0,0,0.5) 100%);
        }
        
        .btn svg {
            width: 28px; height: 28px; fill: none; stroke: rgba(255, 255, 255, 0.9);
            stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.5));
        }

        #btnLeanBack    { bottom: 100px; left: 15px; }
        #btnLeanForward { bottom: 30px;  left: 50px; }
        #btnGas         { bottom: 100px; right: 15px; }
        #btnBrake       { bottom: 30px;  right: 50px; }

        .controls { display: none; } 
        .controls.active { display: block; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.4);
            pointer-events: auto;
            transition: opacity 0.3s;
            z-index: 20;
        }
        .overlay h1 {
            font-size: 42px; color: white; text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }
        .overlay p {
            font-size: 18px; color: rgba(255,255,255,0.8);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        
        #gameOverScreen { 
            display: none; 
            background: #000; 
            justify-content: flex-end; 
            padding-bottom: 100px;
        }
        #gameOverScreen p {
            color: rgba(255,255,255,0.8);
            font-size: 20px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/planck-js@0.3/dist/planck.min.js"></script>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="ui-layer">
    <div class="top-bar">
        <div class="stats-left">
            <div class="stat-text">Best: <span id="bestDistanceText">0</span>m</div>
        </div>
        
        <div class="stats-right">
            <div class="clock" id="clockText">00:00</div>
            <div class="score"><span id="distanceText">0</span> m</div>
        </div>
    </div>
    
    <div class="controls" id="controls">
        <div class="btn" id="btnLeanBack">
            <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
        </div>
        <div class="btn" id="btnLeanForward">
            <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg>
        </div>
        
        <div class="btn" id="btnGas">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>

        <div class="btn" id="btnBrake">
            <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></svg>
        </div>
    </div>

    <div class="overlay" id="startScreen">
        <h1>Skyline Moto</h1>
        <p>Нажми, чтобы начать</p>
    </div>

    <div class="overlay" id="gameOverScreen">
        <p>Tap to continue</p>
    </div>
</div>

<script>
    const ENABLE_AUDIO = true; 
    const SCALE = 30; 

    document.addEventListener('touchmove', function(e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();

    // --- МИР PLANET (BOX2D) ---
    const pl = planck;
    const world = new pl.World({ gravity: pl.Vec2(0, 10) });

    const startX = 50000;
    let groundY = canvas.height - 80; 
    let terrainOffset = 0; 
    let gameState = 'start';
    let maxDistance = parseInt(localStorage.getItem('bestDistance')) || 0;
    document.getElementById('bestDistanceText').innerText = maxDistance;
    
    let cameraX = startX - (canvas.width * 0.3);
    let cameraY = 0; 
    const zoom = 1.1; 
    
    // --- ГЕНЕРАЦИЯ ЗЕМЛИ ---
    function noise(x) {
        let i = Math.floor(x);
        let f = x - i;
        let u = f * f * (3.0 - 2.0 * f);
        let r1 = Math.sin(i * 12.9898) * 43758.5453;
        let r2 = Math.sin((i + 1) * 12.9898) * 43758.5453;
        r1 = r1 - Math.floor(r1);
        r2 = r2 - Math.floor(r2);
        return r1 * (1 - u) + r2 * u;
    }

    function getTerrainY(x) {
        let y = groundY;
        
        // 1. Базовый ландшафт (плавные волны)
        y -= noise((x + terrainOffset) * 0.001) * 100;  
        y -= noise((x + terrainOffset) * 0.005) * 30;   
        
        // 2. Ямы и трамплины (пологие, без стен)
        let feature = noise((x + terrainOffset) * 0.0008); 
        
        if (feature > 0.65) {
            // ТРАМПЛИН
            let p = (feature - 0.65) / 0.35; 
            let ramp = Math.sin(p * Math.PI) * 120; 
            y -= ramp;
        } else if (feature < 0.35) {
            // ЯМА
            let p = (0.35 - feature) / 0.35; 
            let pit = Math.sin(p * Math.PI) * 150;  
            y += pit;
        }
        
        return y;
    }

    let terrainBodies = [];
    let lastGeneratedX = startX - 1500; 
    const chunkWidth = 2; 
    const chunkSize = 100; 

    function generateTerrain() {
        while (lastGeneratedX < cameraX + (canvas.width / zoom) + 1000) {
            let vertices = [];
            for (let i = 0; i < chunkSize; i++) {
                let px = lastGeneratedX + (i * chunkWidth);
                let py = getTerrainY(px);
                vertices.push(pl.Vec2(px / SCALE, py / SCALE));
            }
            
            const chain = world.createBody();
            const chainShape = pl.Chain(vertices, false);
            chain.createFixture(chainShape, {
                friction: 1.0,
                restitution: 0.0
            });
            
            terrainBodies.push({ body: chain, startX: lastGeneratedX, endX: lastGeneratedX + (chunkSize * chunkWidth) });
            lastGeneratedX += chunkSize * chunkWidth;
        }
    }

    function cleanupTerrain() {
        for (let i = terrainBodies.length - 1; i >= 0; i--) {
            if (terrainBodies[i].endX < cameraX - 1500) {
                world.destroyBody(terrainBodies[i].body);
                terrainBodies.splice(i, 1);
            }
        }
    }

    // --- БАЙК ---
    const wheelRadius = 10 / SCALE; 
    const wheelBase = 23 / SCALE; 
    
    let chassis, wheelRear, wheelFront;
    let jointRear, jointFront;

    function createBike(x, y) {
        if (chassis) {
            world.destroyBody(chassis);
            world.destroyBody(wheelRear);
            world.destroyBody(wheelFront);
        }

        chassis = world.createBody({ position: pl.Vec2(x / SCALE, y / SCALE), type: 'dynamic' });
        chassis.createFixture(pl.Box(60 / SCALE / 2, 15 / SCALE / 2), { density: 1.2, friction: 0.3 });

        wheelRear = world.createBody({ position: pl.Vec2((x - wheelBase * SCALE) / SCALE, y / SCALE), type: 'dynamic' });
        wheelRear.createFixture(pl.Circle(wheelRadius), { density: 1.0, friction: 1.0 });

        wheelFront = world.createBody({ position: pl.Vec2((x + wheelBase * SCALE) / SCALE, y / SCALE), type: 'dynamic' });
        wheelFront.createFixture(pl.Circle(wheelRadius), { density: 1.0, friction: 1.0 });

        jointRear = world.createJoint(pl.WheelJoint({
            motorSpeed: 0,
            maxMotorTorque: 60,
            enableMotor: true,
            frequencyHz: 4.5,
            dampingRatio: 0.7,
            collideConnected: false
        }, chassis, wheelRear, wheelRear.getPosition(), pl.Vec2(0, 1)));

        jointFront = world.createJoint(pl.WheelJoint({
            motorSpeed: 0,
            maxMotorTorque: 60,
            enableMotor: true,
            frequencyHz: 4.5,
            dampingRatio: 0.7,
            collideConnected: false
        }, chassis, wheelFront, wheelFront.getPosition(), pl.Vec2(0, 1)));
    }

    const bikeImage = new Image();
    bikeImage.src = 'moto.png'; 
    let isImageLoaded = false;
    bikeImage.onload = () => { isImageLoaded = true; };

    window.isGas = false; window.isBrake = false; 
    window.isLeanBack = false; window.isLeanForward = false;

    setInterval(() => {
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        document.getElementById('clockText').innerText = timeStr;
    }, 1000);

    // --- ЗВУК ---
    let audioCtx;
    let idleBuffer, popBuffer, windBuffer, revBuffer;
    let idleSource, windSource, revSource;
    let idleGain, revGain, windGain;
    let revFilter, revTremoloGain;
    let revLfoTone, revLfoToneGain, revLfoVol, revLfoVolGain;   
    let isAudioInitialized = false;
    let previousGasState = false;
    
    async function loadAudio(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) return null;
            const arrayBuffer = await response.arrayBuffer();
            return await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) { return null; }
    }

    function createSeamlessBuffer(buffer, crossfadeTime = 2.0) {
        const sampleRate = buffer.sampleRate;
        const crossfadeSamples = Math.floor(crossfadeTime * sampleRate);
        const originalLength = buffer.length;
        const newLength = originalLength - crossfadeSamples;
        if (newLength <= 0) return buffer;
        const newBuffer = audioCtx.createBuffer(buffer.numberOfChannels, newLength, sampleRate);
        for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
            const originalData = buffer.getChannelData(channel);
            const newData = newBuffer.getChannelData(channel);
            for (let i = 0; i < newLength - crossfadeSamples; i++) newData[i] = originalData[i];
            for (let i = 0; i < crossfadeSamples; i++) {
                const ratio = i / crossfadeSamples;
                newData[newLength - crossfadeSamples + i] = (originalData[newLength - crossfadeSamples + i] * Math.cos(ratio * 0.5 * Math.PI)) + (originalData[i] * Math.sin(ratio * 0.5 * Math.PI));
            }
        }
        return newBuffer;
    }

    async function initAudio() {
        if (!ENABLE_AUDIO || isAudioInitialized) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            idleBuffer = await loadAudio('engine_idle.mp3');
            popBuffer = await loadAudio('engine_pop.mp3');
            windBuffer = await loadAudio('wind.mp3');
            let rawRevBuffer = await loadAudio('engine_rev.mp3');
            if (rawRevBuffer) revBuffer = createSeamlessBuffer(rawRevBuffer, 2.0);

            idleGain = audioCtx.createGain(); revGain = audioCtx.createGain(); windGain = audioCtx.createGain(); revTremoloGain = audioCtx.createGain();
            idleGain.gain.value = 0; revGain.gain.value = 0; windGain.gain.value = 0; revTremoloGain.gain.value = 0.9; 
            
            revFilter = audioCtx.createBiquadFilter(); revFilter.type = 'lowpass'; revFilter.frequency.value = 2500; 

            idleGain.connect(audioCtx.destination);
            revFilter.connect(revTremoloGain); revTremoloGain.connect(revGain); revGain.connect(audioCtx.destination);
            windGain.connect(audioCtx.destination);

            revLfoTone = audioCtx.createOscillator(); revLfoTone.type = 'sine'; revLfoTone.frequency.value = 0.3; 
            revLfoToneGain = audioCtx.createGain(); revLfoToneGain.gain.value = 0.01; 
            revLfoTone.connect(revLfoToneGain); revLfoTone.start();

            revLfoVol = audioCtx.createOscillator(); revLfoVol.type = 'sine'; revLfoVol.frequency.value = 0.2; 
            revLfoVolGain = audioCtx.createGain(); revLfoVolGain.gain.value = 0.1; 
            revLfoVol.connect(revLfoVolGain); revLfoVolGain.connect(revTremoloGain.gain); revLfoVol.start();

            if (idleBuffer) {
                idleSource = audioCtx.createBufferSource(); idleSource.buffer = idleBuffer; idleSource.loop = true; idleSource.connect(idleGain); idleSource.start();
            }
            if (revBuffer) {
                revSource = audioCtx.createBufferSource(); revSource.buffer = revBuffer; revSource.loop = true; revSource.connect(revFilter);
                revLfoToneGain.connect(revSource.playbackRate); revSource.start(0); 
            }
            if (windBuffer) {
                windSource = audioCtx.createBufferSource(); windSource.buffer = windBuffer; windSource.loop = true; windSource.connect(windGain); windSource.start();
            } else {
                const bufferSize = audioCtx.sampleRate * 2; 
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1; 
                windSource = audioCtx.createBufferSource(); windSource.buffer = buffer; windSource.loop = true;
                const windFilter = audioCtx.createBiquadFilter(); windFilter.type = 'lowpass'; windFilter.frequency.value = 600; 
                windSource.connect(windFilter); windFilter.connect(windGain); windSource.start();
            }
            isAudioInitialized = true;
        } catch (e) { console.log("Ошибка аудио: ", e); }
    }

    function startRevSound() {
        if (!isAudioInitialized || !revBuffer) return;
        if (revSource) { try { revSource.stop(); revLfoToneGain.disconnect(revSource.playbackRate); } catch(e){} }
        revSource = audioCtx.createBufferSource(); revSource.buffer = revBuffer; revSource.loop = true;
        revLfoToneGain.connect(revSource.playbackRate); revSource.connect(revFilter);
        const randomOffset = Math.random() * (revBuffer.duration - 1); revSource.start(0, randomOffset);
    }

    function playPop() {
        if (!ENABLE_AUDIO || !popBuffer || !audioCtx) return;
        const popSource = audioCtx.createBufferSource(); const popGain = audioCtx.createGain();
        popSource.buffer = popBuffer; popSource.connect(popGain); popGain.connect(audioCtx.destination); popGain.gain.value = 1.0; popSource.start();
    }

    function bindBtn(id, variableName) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); if(gameState === 'playing') window[variableName] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); window[variableName] = false; });
        el.addEventListener('touchcancel', (e) => { e.preventDefault(); window[variableName] = false; });
    }
    
    bindBtn('btnGas', 'isGas'); bindBtn('btnBrake', 'isBrake'); bindBtn('btnLeanBack', 'isLeanBack'); bindBtn('btnLeanForward', 'isLeanForward');

    function resetGame() {
        terrainOffset = Math.random() * 10000;
        
        for (let i = 0; i < terrainBodies.length; i++) world.destroyBody(terrainBodies[i].body);
        terrainBodies = [];
        lastGeneratedX = startX - 1500;
        cameraX = startX - (canvas.width * 0.3);
        
        let startHillY = getTerrainY(startX);
        let startY = startHillY - 15;
        
        createBike(startX, startY);
        generateTerrain();

        window.isGas = false; window.isBrake = false; window.isLeanBack = false; window.isLeanForward = false;
        
        if (ENABLE_AUDIO && isAudioInitialized) {
            idleGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            revGain.gain.setValueAtTime(0, audioCtx.currentTime);
            windGain.gain.setValueAtTime(0, audioCtx.currentTime);
            if (revFilter) revFilter.frequency.value = 2500;
            startRevSound();
        }
        document.getElementById('distanceText').innerText = "0";
    }

    document.getElementById('startScreen').addEventListener('touchstart', async (e) => {
        e.preventDefault();
        await initAudio(); 
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('controls').classList.add('active');
        resetGame();
        gameState = 'playing';
    });

    document.getElementById('gameOverScreen').addEventListener('touchstart', (e) => {
        e.preventDefault();
        document.getElementById('gameOverScreen').style.display = 'none';
        resetGame(); 
        gameState = 'playing';
    });

    function drawMountainLayer(yOffset, height, color, parallaxOffset) {
        ctx.fillStyle = color;
        ctx.beginPath();
        let startDrawX = Math.floor(cameraX) - 100;
        let endDrawX = Math.floor(cameraX) + (canvas.width / zoom) + 100;
        ctx.moveTo(startDrawX, canvas.height * 2);
        for (let x = startDrawX; x <= endDrawX; x += 10) {
            let worldX = x + parallaxOffset;
            let y = (canvas.height - yOffset) - Math.sin(worldX * 0.005) * height - Math.cos(worldX * 0.01) * (height / 2);
            ctx.lineTo(x, y);
        }
        ctx.lineTo(endDrawX, canvas.height * 2); ctx.closePath(); ctx.fill();
    }

    function drawTerrain() {
        ctx.fillStyle = '#000'; 
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4; 
        
        ctx.beginPath();
        ctx.moveTo(cameraX - 100, canvas.height + 2000);
        
        for (let chunk of terrainBodies) {
            let vertices = chunk.body.getFixtureList().getShape().m_vertices;
            for (let i = 0; i < vertices.length; i++) {
                ctx.lineTo(vertices[i].x * SCALE, vertices[i].y * SCALE);
            }
        }
        
        ctx.lineTo(lastGeneratedX, canvas.height + 2000);
        ctx.closePath(); ctx.fill(); ctx.stroke();
    }

    function drawWheel(wheel) {
        ctx.save();
        ctx.translate(wheel.getPosition().x * SCALE, wheel.getPosition().y * SCALE);
        ctx.rotate(wheel.getAngle());
        ctx.fillStyle = '#000'; 
        ctx.beginPath(); ctx.arc(0, 0, wheelRadius * SCALE, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, wheelRadius * SCALE - 2, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
    }

    let lastDisplayedDistance = -1;
    let lastTime = performance.now();

    function update() {
        requestAnimationFrame(update);
        
        let currentTime = performance.now();
        let dt = (currentTime - lastTime) / 1000;
        lastTime = currentTime;
        
        world.step(1/60, dt, 3);

        if (gameState === 'playing' && chassis) {
            let speed = Math.abs(wheelRear.getAngularVelocity());

            if (window.isGas) {
                jointRear.setMotorSpeed(50); 
                jointFront.setMotorSpeed(50);
                jointRear.setMaxMotorTorque(60); 
                jointFront.setMaxMotorTorque(60);
            } else if (window.isBrake) {
                jointRear.setMotorSpeed(0);
                jointFront.setMotorSpeed(0);
                jointRear.setMaxMotorTorque(100); 
                jointFront.setMaxMotorTorque(100);
            } else {
                jointRear.setMaxMotorTorque(0);
                jointFront.setMaxMotorTorque(0);
            }

            // Наклоны
            let tiltPower = 20;      
            let maxTiltSpeed = 2.5;  

            if (window.isLeanBack) {
                if (chassis.getAngularVelocity() > -maxTiltSpeed) {
                    chassis.applyTorque(-tiltPower, true);
                }
            } 
            else if (window.isLeanForward) {
                if (chassis.getAngularVelocity() < maxTiltSpeed) {
                    chassis.applyTorque(tiltPower, true);
                }
            }

            if (ENABLE_AUDIO && isAudioInitialized) {
                if (window.isGas) {
                    idleGain.gain.cancelScheduledValues(audioCtx.currentTime);
                    idleGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
                } else {
                    idleGain.gain.cancelScheduledValues(audioCtx.currentTime);
                    idleGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.1);
                }

                let targetRev = window.isGas ? 0.8 : 0;    
                let targetWind = Math.min(0.3, 0.05 + speed * 0.15); 

                revGain.gain.setTargetAtTime(targetRev, audioCtx.currentTime, 0.1);
                windGain.gain.setTargetAtTime(targetWind, audioCtx.currentTime, 0.1);

                if (window.isGas && revSource) {
                    let targetRate = 1.0 + (speed * 0.3); 
                    let finalRate = Math.min(1.3, targetRate);
                    revSource.playbackRate.setTargetAtTime(finalRate, audioCtx.currentTime, 0.1);
                    let targetFreq = Math.max(1000, 2500 - (speed * 1000));
                    revFilter.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
                    previousGasState = true;
                } else {
                    if (previousGasState === true) {
                        if (Math.random() > 0.5) playPop();
                        previousGasState = false;
                    }
                }
            }

            let headX = chassis.getPosition().x + Math.sin(chassis.getAngle()) * (35 / SCALE);
let headY = chassis.getPosition().y - Math.cos(chassis.getAngle()) * (35 / SCALE);
let groundUnderHead = getTerrainY(headX * SCALE) / SCALE;

if (headY >= groundUnderHead || chassis.getPosition().y > canvas.height / SCALE + 10) {
    gameState = 'gameover';
                document.getElementById('gameOverScreen').style.display = 'flex';
                if (ENABLE_AUDIO && isAudioInitialized) {
                    idleGain.gain.setValueAtTime(0, audioCtx.currentTime);
                    revGain.gain.setValueAtTime(0, audioCtx.currentTime);
                    windGain.gain.setValueAtTime(0, audioCtx.currentTime);
                }
            }

            let targetCameraX = (chassis.getPosition().x * SCALE) - ((canvas.width * 0.3) / zoom);
            cameraX += (targetCameraX - cameraX) * 0.1; 
            let targetCameraY = (canvas.height * 0.5) - (chassis.getPosition().y * SCALE);
            cameraY += (targetCameraY - cameraY) * 0.1;
            
            generateTerrain();
            cleanupTerrain();

            let currentDistance = Math.max(0, Math.floor(((chassis.getPosition().x * SCALE) - startX) / 10));
            if (currentDistance !== lastDisplayedDistance) {
                document.getElementById('distanceText').innerText = currentDistance;
                lastDisplayedDistance = currentDistance;
            }
            if (currentDistance > maxDistance) {
                maxDistance = currentDistance;
                localStorage.setItem('bestDistance', maxDistance);
                document.getElementById('bestDistanceText').innerText = maxDistance;
            }
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#1a0b2e'); gradient.addColorStop(0.4, '#5a2b58'); gradient.addColorStop(0.7, '#d96b4e'); gradient.addColorStop(1, '#f5c26b');
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

        let sunX = canvas.width * 0.75; let sunY = canvas.height * 0.35;
        let sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 150);
        sunGlow.addColorStop(0, 'rgba(255, 243, 212, 0.8)'); sunGlow.addColorStop(0.5, 'rgba(255, 243, 212, 0.2)'); sunGlow.addColorStop(1, 'rgba(255, 243, 212, 0)');
        ctx.fillStyle = sunGlow; ctx.beginPath(); ctx.arc(sunX, sunY, 150, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff3d4'; ctx.beginPath(); ctx.arc(sunX, sunY, 45, 0, Math.PI * 2); ctx.fill();

        ctx.save();
        ctx.scale(zoom, zoom);
        ctx.translate(0, cameraY);
        ctx.translate(-cameraX, 0);

        drawMountainLayer(120, 60, '#3a2354', cameraX * 0.2);
        drawMountainLayer(60, 100, '#1e1129', cameraX * 0.5);
        
        drawTerrain();

        if (gameState !== 'gameover' && chassis) {
            ctx.save();
            ctx.translate(chassis.getPosition().x * SCALE, chassis.getPosition().y * SCALE);
            ctx.rotate(chassis.getAngle());
            if (isImageLoaded) ctx.drawImage(bikeImage, -45, -45, 90, 54); 
            ctx.restore();
            drawWheel(wheelRear);
            drawWheel(wheelFront);
        }

        ctx.restore(); 
    }

    update();
</script>
