<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skyline Moto</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();

    const Engine = Matter.Engine,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite;

    const engine = Engine.create();
    const world = engine.world;
    engine.gravity.y = 0.8; 

    // Физическая земля (невидимая линия, об которую бьется мотоцикл)
    let groundY = canvas.height - 80; 
    let ground = Bodies.rectangle(
        canvas.width / 2, 
        groundY + 50, 
        canvas.width * 5, 
        100, 
        { isStatic: true }
    );

    // Тестовый объект
    let testBike = Bodies.rectangle(
        canvas.width / 2, 
        100, 
        60, 30, 
        { density: 0.05, friction: 0.5 }
    );

    Composite.add(world, [ground, testBike]);

    let offset1 = 0, offset2 = 0, offset3 = 0;

    function drawMountainLayer(yOffset, height, color, offset) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        for (let x = 0; x <= canvas.width; x += 10) {
            let y = canvas.height - yOffset 
                    - Math.sin((x + offset) * 0.005) * height 
                    - Math.cos((x + offset) * 0.01) * (height / 2);
            ctx.lineTo(x, y);
        }
        ctx.lineTo(canvas.width, canvas.height);
        ctx.closePath();
        ctx.fill();
    }

    // --- НОВАЯ ИДЕАЛЬНАЯ ЗЕМЛЯ (Как в Mountain Bike) ---
    function drawTerrain(offset) {
        ctx.fillStyle = '#000000'; // Сплошной черный
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);

        // Проходим по всей ширине экрана (шаг 3 для плавности)
        for (let x = 0; x <= canvas.width; x += 3) {
            // Базовая линия земли
            let y = canvas.height - 80;

            // 1. Плавные большие холмы
            y -= Math.sin((x + offset) * 0.005) * 25;
            
            // 2. Средние кочки/кусты
            y -= Math.cos((x + offset) * 0.02) * 10;

            // 3. Острые травинки (высокая частота)
            // Math.abs делает пики острыми, а не волнистыми
            let sharpGrass = Math.abs(Math.sin((x + offset) * 0.15)) * 12;
            
            // Рисуем травинки не везде, а "пучками" (условие > 0)
            if (Math.sin((x + offset) * 0.03) > 0) {
                y -= sharpGrass;
            }

            ctx.lineTo(x, y);
        }

        ctx.lineTo(canvas.width, canvas.height);
        ctx.closePath();
        ctx.fill();
    }

    function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Закат
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#1a0b2e');
        gradient.addColorStop(0.4, '#5a2b58');
        gradient.addColorStop(0.7, '#d96b4e');
        gradient.addColorStop(1, '#f5c26b');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Солнце
        ctx.fillStyle = '#fff3d4';
        ctx.beginPath();
        ctx.arc(canvas.width * 0.75, canvas.height * 0.35, 45, 0, Math.PI * 2);
        ctx.fill();

        // 3. Задние горы
        drawMountainLayer(120, 60, '#3a2354', offset1);
        drawMountainLayer(60, 100, '#1e1129', offset2);
        
        // 4. Наша новая черная земля с травой
        drawTerrain(offset3);

        // 5. Рисуем мотоцикл (тестовый квадрат)
        ctx.save();
        ctx.translate(testBike.position.x, testBike.position.y);
        ctx.rotate(testBike.angle);
        ctx.fillStyle = '#000000'; 
        ctx.fillRect(-30, -15, 60, 30); 
        ctx.restore();

        // 6. Движение
        let bgSpeed = testBike.velocity.x * 1.5; 
        offset1 += bgSpeed * 0.3;
        offset2 += bgSpeed * 0.6;
        offset3 += bgSpeed * 1.0;

        requestAnimationFrame(update);
    }

    const runner = Runner.create();
    Runner.run(runner, engine);
    update();

    window.addEventListener('resize', () => {
        resizeCanvas();
        groundY = canvas.height - 80;
        Matter.Body.setPosition(ground, { x: canvas.width / 2, y: groundY + 50 });
        if (testBike.position.y > canvas.height) {
            Matter.Body.setPosition(testBike, { x: canvas.width / 2, y: 100 });
            Matter.Body.setVelocity(testBike, { x: 0, y: 0 });
        }
    });
</script>
</body>
</html>
