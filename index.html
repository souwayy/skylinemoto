<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skyline Moto</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();

    const Engine = Matter.Engine,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite,
          Constraint = Matter.Constraint,
          Body = Matter.Body;

    const engine = Engine.create();
    const world = engine.world;
    engine.gravity.y = 1; 

    const startX = 50000;

    let groundY = canvas.height - 80; 
    let ground = Bodies.rectangle(startX, groundY + 50, 100000, 100, { isStatic: true });

    // --- ФИЗИКА МОТОЦИКЛА ---
    const wheelRadius = 20;
    const wheelRear = Bodies.circle(startX - 40, 100, wheelRadius, { density: 0.05, friction: 1 });
    const wheelFront = Bodies.circle(startX + 40, 100, wheelRadius, { density: 0.05, friction: 1 });
    const chassis = Bodies.rectangle(startX, 90, 80, 20, { density: 0.1 });

    const suspensionRear = Constraint.create({ bodyA: wheelRear, pointB: { x: -40, y: 0 }, bodyB: chassis, stiffness: 0.1, damping: 0.1 });
    const suspensionFront = Constraint.create({ bodyA: wheelFront, pointB: { x: 40, y: 0 }, bodyB: chassis, stiffness: 0.1, damping: 0.1 });

    const moto = Composite.create({ bodies: [wheelRear, wheelFront, chassis], constraints: [suspensionRear, suspensionFront] });
    Composite.add(world, [ground, moto]);

    // --- ЗАГРУЖАЕМ ТВОЮ КАРТИНКУ ---
    const bikeImage = new Image();
    bikeImage.src = 'moto.png'; // Имя твоего файла
    
    let isImageLoaded = false;
    bikeImage.onload = () => { isImageLoaded = true; };

    // --- УПРАВЛЕНИЕ ---
    let isGas = false, isBrake = false;
    window.addEventListener('touchstart', (e) => {
        if (e.touches[0].clientX > window.innerWidth / 2) isGas = true; else isBrake = true;
    });
    window.addEventListener('touchend', () => { isGas = false; isBrake = false; });

    // --- КАМЕРА ---
    let cameraX = startX - (canvas.width * 0.3);
    const zoom = 0.7; 

    function drawMountainLayer(yOffset, height, color, parallaxOffset) {
        ctx.fillStyle = color;
        ctx.beginPath();
        let startDrawX = cameraX - 100, endDrawX = cameraX + (canvas.width / zoom) + 100;
        ctx.moveTo(startDrawX, canvas.height * 1.5);
        for (let x = startDrawX; x <= endDrawX; x += 10) {
            let worldX = x + parallaxOffset;
            let y = (canvas.height - yOffset) - Math.sin(worldX * 0.005) * height - Math.cos(worldX * 0.01) * (height / 2);
            ctx.lineTo(x, y);
        }
        ctx.lineTo(endDrawX, canvas.height * 1.5);
        ctx.closePath();
        ctx.fill();
    }

    function drawTerrain() {
        ctx.fillStyle = '#000'; 
        ctx.beginPath();
        let startDrawX = cameraX - 100, endDrawX = cameraX + (canvas.width / zoom) + 100;
        let terrainY = canvas.height - 80;
        ctx.moveTo(startDrawX, canvas.height * 1.5);
        ctx.lineTo(startDrawX, terrainY);
        ctx.lineTo(endDrawX, terrainY);
        ctx.lineTo(endDrawX, canvas.height * 1.5);
        ctx.closePath();
        ctx.fill();

        // Трава
        ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        for (let x = startDrawX; x <= endDrawX; x += 20) {
            if (Math.sin(x * 0.03) > 0.6) {
                let y = terrainY; 
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath(); ctx.moveTo(x + (i * 4) - 4, y + 2);
                    ctx.lineTo(x + (i * 4) - 4 + Math.sin(x * 0.1 + i) * 6, y - (6 + Math.cos(x * 0.2 + i) * 4)); ctx.stroke();
                }
            }
        }
    }

    // --- УЛУЧШЕННЫЕ КОЛЕСА (С протектором) ---
    function drawWheel(wheel) {
        ctx.save();
        ctx.translate(wheel.position.x, wheel.position.y);
        ctx.rotate(wheel.angle);
        
        // Основное колесо
        ctx.fillStyle = '#000'; 
        ctx.beginPath(); 
        ctx.arc(0, 0, wheelRadius, 0, Math.PI * 2); 
        ctx.fill();

        // Протектор (шипы по кругу)
        ctx.strokeStyle = '#333'; 
        ctx.lineWidth = 3;
        for (let i = 0; i < 8; i++) {
            let angle = (i / 8) * Math.PI * 2;
            let x1 = Math.cos(angle) * (wheelRadius - 3);
            let y1 = Math.sin(angle) * (wheelRadius - 3);
            let x2 = Math.cos(angle) * (wheelRadius + 3);
            let y2 = Math.sin(angle) * (wheelRadius + 3);
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        }

        // Спицы (крестик)
        ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-wheelRadius+5, 0); ctx.lineTo(wheelRadius-5, 0);
        ctx.moveTo(0, -wheelRadius+5); ctx.lineTo(0, wheelRadius-5); ctx.stroke();
        
        ctx.restore();
    }

    function update() {
        if (isGas) { Body.setAngularVelocity(wheelRear, 0.3); Body.setAngularVelocity(wheelFront, 0.3); }
        if (isBrake) { Body.setAngularVelocity(wheelRear, 0); Body.setAngularVelocity(wheelFront, 0); }

        let targetCameraX = chassis.position.x - ((canvas.width * 0.3) / zoom);
        cameraX += (targetCameraX - cameraX) * 0.1; 
        
        if (chassis.position.y > canvas.height + 200) {
            let spawnX = cameraX + (canvas.width * 0.3) / zoom;
            Body.setPosition(chassis, { x: spawnX, y: 100 });
            Body.setPosition(wheelRear, { x: spawnX - 40, y: 100 });
            Body.setPosition(wheelFront, { x: spawnX + 40, y: 100 });
            Body.setVelocity(chassis, { x: 0, y: 0 }); Body.setVelocity(wheelRear, { x: 0, y: 0 }); Body.setVelocity(wheelFront, { x: 0, y: 0 });
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#1a0b2e'); gradient.addColorStop(0.4, '#5a2b58'); gradient.addColorStop(0.7, '#d96b4e'); gradient.addColorStop(1, '#f5c26b');
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#fff3d4'; ctx.beginPath(); ctx.arc(canvas.width * 0.75, canvas.height * 0.35, 45, 0, Math.PI * 2); ctx.fill();

        ctx.save();
        ctx.scale(zoom, zoom);
        ctx.translate(0, (canvas.height * (1 - zoom)) / zoom);
        ctx.translate(-cameraX, 0);

        drawMountainLayer(120, 60, '#3a2354', cameraX * 0.2);
        drawMountainLayer(60, 100, '#1e1129', cameraX * 0.5);
        drawTerrain();

        // --- РИСУЕМ МОТОЦИКЛ ---
        ctx.save();
        ctx.translate(chassis.position.x, chassis.position.y);
        ctx.rotate(chassis.angle);
        
        if (isImageLoaded) {
            // Если мотоцикл "прыгает" или колеса не под ним, меняй эти 4 цифры:
            // -50 это сдвиг влево/вправо
            // -45 это сдвиг вверх/вниз
            // 100 это ширина картинки
            // 60 это высота картинки
            ctx.drawImage(bikeImage, -50, -45, 100, 60); 
        }
        ctx.restore();

        // Колеса рисуем ПОВЕРХ картинки
        drawWheel(wheelRear);
        drawWheel(wheelFront);

        ctx.restore(); 
        requestAnimationFrame(update);
    }

    const runner = Runner.create();
    Runner.run(runner, engine);
    update();
    window.addEventListener('resize', () => { resizeCanvas(); groundY = canvas.height - 80; Body.setPosition(ground, { x: startX, y: groundY + 50 }); });
</script>
</body>
</html>
