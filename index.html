<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skyline Moto</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            touch-action: none; -webkit-user-select: none; user-select: none; 
            font-family: sans-serif;
        }
        canvas { display: block; touch-action: none; }

        .controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            color: rgba(255, 255, 255, 0.6);
            font-size: 32px;
            font-weight: bold;
            transition: background 0.1s, border-color 0.1s;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.8);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="controls">
    <div class="btn" id="btnBrake">↺</div>
    <div class="btn" id="btnGas">↻</div>
</div>

<script>
    document.addEventListener('touchmove', function(e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
    }, { passive: false });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();

    const Engine = Matter.Engine,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite,
          Constraint = Matter.Constraint,
          Body = Matter.Body;

    const engine = Engine.create();
    const world = engine.world;
    engine.gravity.y = 1; 

    const startX = 50000;
    let groundY = canvas.height - 80; 
    let ground = Bodies.rectangle(startX, groundY + 50, 100000, 100, { isStatic: true });

    // --- ФИЗИКА (КОЛЕСА МЕНЬШЕ И БЛИЖЕ) ---
    const wheelRadius = 12; // Уменьшили радиус
    // Расстояние между колесами сокращено (было 45, стало 35)
    const wheelRear = Bodies.circle(startX - 35, 100, wheelRadius, { density: 0.05, friction: 1 });
    const wheelFront = Bodies.circle(startX + 35, 100, wheelRadius, { density: 0.05, friction: 1 });
    const chassis = Bodies.rectangle(startX, 90, 80, 20, { density: 0.1 });

    // Точки крепления подвески тоже сдвинуты ближе
    const suspensionRear = Constraint.create({ bodyA: wheelRear, pointB: { x: -35, y: -5 }, bodyB: chassis, stiffness: 0.1, damping: 0.1 });
    const suspensionFront = Constraint.create({ bodyA: wheelFront, pointB: { x: 35, y: -5 }, bodyB: chassis, stiffness: 0.1, damping: 0.1 });

    const moto = Composite.create({ bodies: [wheelRear, wheelFront, chassis], constraints: [suspensionRear, suspensionFront] });
    Composite.add(world, [ground, moto]);

    const bikeImage = new Image();
    bikeImage.src = 'moto.png'; 
    let isImageLoaded = false;
    bikeImage.onload = () => { isImageLoaded = true; };

    // --- УПРАВЛЕНИЕ ---
    let isGas = false, isBrake = false;

    document.getElementById('btnGas').addEventListener('touchstart', (e) => { e.preventDefault(); isGas = true; });
    document.getElementById('btnGas').addEventListener('touchend', (e) => { e.preventDefault(); isGas = false; });
    
    document.getElementById('btnBrake').addEventListener('touchstart', (e) => { e.preventDefault(); isBrake = true; });
    document.getElementById('btnBrake').addEventListener('touchend', (e) => { e.preventDefault(); isBrake = false; });

    window.addEventListener('touchstart', (e) => {
        if(e.target.classList.contains('btn')) return;
        if (e.touches[0].clientX > window.innerWidth / 2) isGas = true; else isBrake = true;
    });
    window.addEventListener('touchend', (e) => {
        if(e.target.classList.contains('btn')) return;
        isGas = false; isBrake = false;
    });

    // --- КАМЕРА (ЕЩЕ БЛИЖЕ) ---
    let cameraX = startX - (canvas.width * 0.3);
    const zoom = 1.25; // Было 1.15, теперь 1.25

    function drawMountainLayer(yOffset, height, color, parallaxOffset) {
        ctx.fillStyle = color;
        ctx.beginPath();
        let startDrawX = cameraX - 100, endDrawX = cameraX + (canvas.width / zoom) + 100;
        ctx.moveTo(startDrawX, canvas.height * 1.5);
        for (let x = startDrawX; x <= endDrawX; x += 10) {
            let worldX = x + parallaxOffset;
            let y = (canvas.height - yOffset) - Math.sin(worldX * 0.005) * height - Math.cos(worldX * 0.01) * (height / 2);
            ctx.lineTo(x, y);
        }
        ctx.lineTo(endDrawX, canvas.height * 1.5);
        ctx.closePath();
        ctx.fill();
    }

    function drawTerrain() {
        ctx.fillStyle = '#000'; 
        ctx.beginPath();
        let startDrawX = cameraX - 100, endDrawX = cameraX + (canvas.width / zoom) + 100;
        let terrainY = canvas.height - 80;
        ctx.moveTo(startDrawX, canvas.height * 1.5);
        ctx.lineTo(startDrawX, terrainY);
        ctx.lineTo(endDrawX, terrainY);
        ctx.lineTo(endDrawX, canvas.height * 1.5);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.lineCap = 'round';
        for (let x = startDrawX; x <= endDrawX; x += 20) {
            if (Math.sin(x * 0.03) > 0.6) {
                let y = terrainY; 
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath(); ctx.moveTo(x + (i * 4) - 4, y + 2);
                    ctx.lineTo(x + (i * 4) - 4 + Math.sin(x * 0.1 + i) * 6, y - (6 + Math.cos(x * 0.2 + i) * 4)); ctx.stroke();
                }
            }
        }
    }

    function drawWheel(wheel) {
        ctx.save();
        ctx.translate(wheel.position.x, wheel.position.y);
        ctx.rotate(wheel.angle);
        
        // Внешняя шина
        ctx.fillStyle = '#000'; 
        ctx.beginPath(); ctx.arc(0, 0, wheelRadius, 0, Math.PI * 2); ctx.fill();

        // Обод
        ctx.fillStyle = '#111'; 
        ctx.beginPath(); ctx.arc(0, 0, wheelRadius - 2, 0, Math.PI * 2); ctx.fill();

        // Протектор
        ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
        for (let i = 0; i < 8; i++) {
            let angle = (i / 8) * Math.PI * 2;
            ctx.beginPath(); 
            ctx.moveTo(Math.cos(angle) * (wheelRadius - 1), Math.sin(angle) * (wheelRadius - 1)); 
            ctx.lineTo(Math.cos(angle) * (wheelRadius + 1), Math.sin(angle) * (wheelRadius + 1)); 
            ctx.stroke();
        }

        // Спицы
        ctx.strokeStyle = '#333'; ctx.lineWidth = 1;
        for (let i = 0; i < 6; i++) {
            let angle = (i / 6) * Math.PI * 2;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(angle) * (wheelRadius - 2), Math.sin(angle) * (wheelRadius - 2)); ctx.stroke();
        }

        // Ступица
        ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    function update() {
        if (isGas) { Body.setAngularVelocity(wheelRear, 0.4); Body.setAngularVelocity(wheelFront, 0.4); }
        if (isBrake) { Body.setAngularVelocity(wheelRear, 0); Body.setAngularVelocity(wheelFront, 0); }

        let targetCameraX = chassis.position.x - ((canvas.width * 0.3) / zoom);
        cameraX += (targetCameraX - cameraX) * 0.1; 
        
        if (chassis.position.y > canvas.height + 200) {
            let spawnX = cameraX + (canvas.width * 0.3) / zoom;
            Body.setPosition(chassis, { x: spawnX, y: 100 });
            Body.setPosition(wheelRear, { x: spawnX - 35, y: 100 });
            Body.setPosition(wheelFront, { x: spawnX + 35, y: 100 });
            Body.setVelocity(chassis, { x: 0, y: 0 }); Body.setVelocity(wheelRear, { x: 0, y: 0 }); Body.setVelocity(wheelFront, { x: 0, y: 0 });
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#1a0b2e'); gradient.addColorStop(0.4, '#5a2b58'); gradient.addColorStop(0.7, '#d96b4e'); gradient.addColorStop(1, '#f5c26b');
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#fff3d4'; ctx.beginPath(); ctx.arc(canvas.width * 0.75, canvas.height * 0.35, 45, 0, Math.PI * 2); ctx.fill();

        ctx.save();
        ctx.scale(zoom, zoom);
        ctx.translate(0, (canvas.height * (1 - zoom)) / zoom);
        ctx.translate(-cameraX, 0);

        drawMountainLayer(120, 60, '#3a2354', cameraX * 0.2);
        drawMountainLayer(60, 100, '#1e1129', cameraX * 0.5);
        drawTerrain();

        // --- МОТОЦИКЛ (УВЕЛИЧЕН, КОЛЕСА В АРКАХ) ---
        ctx.save();
        ctx.translate(chassis.position.x, chassis.position.y);
        ctx.rotate(chassis.angle);
        
        if (isImageLoaded) {
            // Картинка стала больше (90 на 54), сдвиг центрирует её над колесами
            ctx.drawImage(bikeImage, -45, -35, 90, 54); 
        }
        ctx.restore();

        drawWheel(wheelRear);
        drawWheel(wheelFront);

        ctx.restore(); 
        requestAnimationFrame(update);
    }

    const runner = Runner.create();
    Runner.run(runner, engine);
    update();
    window.addEventListener('resize', () => { resizeCanvas(); groundY = canvas.height - 80; Body.setPosition(ground, { x: startX, y: groundY + 50 }); });
</script>
</body>
</html>
