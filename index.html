<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skyline Moto</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();

    const Engine = Matter.Engine,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite,
          Constraint = Matter.Constraint,
          Body = Matter.Body;

    const engine = Engine.create();
    const world = engine.world;
    engine.gravity.y = 1; 

    // --- ЗЕМЛЯ ---
    let groundY = canvas.height - 80; 
    let ground = Bodies.rectangle(50000, groundY + 50, 100000, 100, { isStatic: true });

    // --- ФИЗИКА МОТОЦИКЛА ---
    const wheelRadius = 20;
    const wheelRear = Bodies.circle(canvas.width / 2 - 40, 100, wheelRadius, { density: 0.05, friction: 1 });
    const wheelFront = Bodies.circle(canvas.width / 2 + 40, 100, wheelRadius, { density: 0.05, friction: 1 });
    
    // Рама (физический прямоугольник, который мы будем красиво рисовать)
    const chassis = Bodies.rectangle(canvas.width / 2, 90, 80, 20, { density: 0.1 });

    const suspensionRear = Constraint.create({
        bodyA: wheelRear, pointB: { x: -40, y: 0 }, bodyB: chassis, stiffness: 0.1, damping: 0.1
    });
    const suspensionFront = Constraint.create({
        bodyA: wheelFront, pointB: { x: 40, y: 0 }, bodyB: chassis, stiffness: 0.1, damping: 0.1
    });

    const moto = Composite.create({
        bodies: [wheelRear, wheelFront, chassis],
        constraints: [suspensionRear, suspensionFront]
    });

    Composite.add(world, [ground, moto]);

    // --- УПРАВЛЕНИЕ ---
    let isGas = false;
    let isBrake = false;

    window.addEventListener('touchstart', (e) => {
        const touchX = e.touches[0].clientX;
        if (touchX > window.innerWidth / 2) isGas = true;
        else isBrake = true;
    });

    window.addEventListener('touchend', () => {
        isGas = false;
        isBrake = false;
    });

    // --- КАМЕРА И МАСШТАБ ---
    let cameraX = 0; 
    const zoom = 0.7; // Зум (отдаление)

    // --- ОТРИСОВКА ФОНА ---
    function drawMountainLayer(yOffset, height, color, offset) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height * 1.5);
        for (let x = 0; x <= canvas.width / zoom; x += 10) {
            let worldX = x + offset;
            let y = (canvas.height - yOffset) 
                    - Math.sin(worldX * 0.005) * height 
                    - Math.cos(worldX * 0.01) * (height / 2);
            ctx.lineTo(x, y);
        }
        ctx.lineTo(canvas.width / zoom, canvas.height * 1.5);
        ctx.closePath();
        ctx.fill();
    }

    function drawTerrain(offset) {
        ctx.fillStyle = '#000000'; 
        ctx.beginPath();
        ctx.moveTo(0, canvas.height * 1.5);
        let terrainY = canvas.height - 80;
        ctx.lineTo(0, terrainY);
        ctx.lineTo(canvas.width / zoom, terrainY);
        ctx.lineTo(canvas.width / zoom, canvas.height * 1.5);
        ctx.closePath();
        ctx.fill();

        // Трава
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        for (let x = 0; x <= canvas.width / zoom; x += 20) {
            let worldX = x + offset;
            let patch = Math.sin(worldX * 0.03); 
            if (patch > 0.6) {
                let y = terrainY; 
                for (let i = 0; i < 3; i++) {
                    let startX = x + (i * 4) - 4;
                    let lean = Math.sin(worldX * 0.1 + i) * 6;
                    let height = 6 + Math.cos(worldX * 0.2 + i) * 4;
                    ctx.beginPath();
                    ctx.moveTo(startX, y + 2);
                    ctx.lineTo(startX + lean, y - height);
                    ctx.stroke();
                }
            }
        }
    }

    // --- НОВАЯ ОТРИСОВКА КОЛЕСА (Только черный силуэт, без белых спиц) ---
    function drawWheel(wheel) {
        ctx.save();
        ctx.translate(wheel.position.x, wheel.position.y);
        ctx.rotate(wheel.angle);
        
        // Само колесо
        ctx.fillStyle = '#000'; 
        ctx.beginPath();
        ctx.arc(0, 0, wheelRadius, 0, Math.PI * 2);
        ctx.fill();
        
        // Рисуем маленькую точку в центре, чтобы визуально видеть вращение
        ctx.fillStyle = '#222'; // Едва заметный темно-серый
        ctx.beginPath();
        ctx.arc(wheelRadius * 0.5, 0, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    // --- НОВАЯ ОТРИСОВКА МОТОЦИКЛА (Векторный силуэт) ---
    function drawMotoSilhouette() {
        ctx.save();
        ctx.translate(chassis.position.x, chassis.position.y);
        ctx.rotate(chassis.angle);
        
        ctx.fillStyle = '#000'; // Черный цвет
        
        // 1. Рисуем кузов мотоцикла (бак, сиденье, вилка)
        ctx.beginPath();
        ctx.moveTo(-30, 5);       // Задняя часть
        ctx.lineTo(-15, -10);     // Сиденье
        ctx.lineTo(10, -10);      // Бак
        ctx.lineTo(30, -5);       // Рулевая колонка
        ctx.lineTo(25, 10);       // Передний обтекатель
        ctx.lineTo(-20, 10);      // Низ рамы
        ctx.closePath();
        ctx.fill();

        // 2. Рисуем вилку переднего колеса (линия вниз)
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#000';
        ctx.beginPath();
        ctx.moveTo(28, -5);
        ctx.lineTo(40, 20); // Идет к центру переднего колеса
        ctx.stroke();

        // 3. Рисуем водителя (сгорбленный силуэт)
        // Туловище (наклонено вперед)
        ctx.beginPath();
        ctx.moveTo(-15, -10); // Точка на сиденье
        ctx.lineTo(0, -30);   // Спина
        ctx.lineTo(15, -15);  // Грудь
        ctx.lineTo(5, -5);    // Живот
        ctx.closePath();
        ctx.fill();

        // Руки (тянутся к рулю)
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo(5, -20);
        ctx.lineTo(25, -5); // К рулю
        ctx.stroke();

        // Шлем (круг)
        ctx.beginPath();
        ctx.arc(-2, -35, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    function update() {
        if (isGas) {
            Body.setAngularVelocity(wheelRear, 0.3);
            Body.setAngularVelocity(wheelFront, 0.3);
        }
        if (isBrake) {
            Body.setAngularVelocity(wheelRear, 0);
            Body.setAngularVelocity(wheelFront, 0);
        }

        // --- ЛОГИКА КАМЕРЫ ---
        let targetCameraX = chassis.position.x - ((canvas.width * 0.3) / zoom);
        cameraX += (targetCameraX - cameraX) * 0.1; 
        
        // Респавн, если упал
        if (chassis.position.y > canvas.height + 200) {
            let spawnX = cameraX + (canvas.width * 0.3) / zoom;
            Body.setPosition(chassis, { x: spawnX, y: 100 });
            Body.setPosition(wheelRear, { x: spawnX - 40, y: 100 });
            Body.setPosition(wheelFront, { x: spawnX + 40, y: 100 });
            Body.setVelocity(chassis, { x: 0, y: 0 });
            Body.setVelocity(wheelRear, { x: 0, y: 0 });
            Body.setVelocity(wheelFront, { x: 0, y: 0 });
        }

        // --- ОТРИСОВКА ---
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Фон
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#1a0b2e');
        gradient.addColorStop(0.4, '#5a2b58');
        gradient.addColorStop(0.7, '#d96b4e');
        gradient.addColorStop(1, '#f5c26b');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Солнце
        ctx.fillStyle = '#fff3d4';
        ctx.beginPath();
        ctx.arc(canvas.width * 0.75, canvas.height * 0.35, 45, 0, Math.PI * 2);
        ctx.fill();

        // --- ВКЛЮЧАЕМ МАСШТАБ ДЛЯ МИРА ---
        ctx.save();
        ctx.scale(zoom, zoom);
        ctx.translate(0, (canvas.height * (1 - zoom)) / zoom);
        ctx.translate(-cameraX, 0);

        // Рисуем мир
        drawMountainLayer(120, 60, '#3a2354', cameraX * 0.2);
        drawMountainLayer(60, 100, '#1e1129', cameraX * 0.5);
        drawTerrain(cameraX);

        // Рисуем мотоцикл и колеса
        drawMotoSilhouette();
        drawWheel(wheelRear);
        drawWheel(wheelFront);

        ctx.restore(); // Возвращаем масштаб

        requestAnimationFrame(update);
    }

    const runner = Runner.create();
    Runner.run(runner, engine);
    update();

    window.addEventListener('resize', () => {
        resizeCanvas();
        groundY = canvas.height - 80;
        Body.setPosition(ground, { x: 50000, y: groundY + 50 });
    });
</script>
</body>
</html>
