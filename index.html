<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skyline Moto (Auto Hitbox)</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            touch-action: none; -webkit-user-select: none; user-select: none; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas { display: block; touch-action: none; }

        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        .top-bar {
            display: flex; justify-content: space-between; padding: 20px;
            align-items: flex-start;
        }
        
        .stats-left {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .stat-text {
            font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
        }
        
        .stats-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
        }
        .clock {
            font-size: 18px;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            font-family: monospace;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
        .score {
            font-size: 32px; font-weight: bold; color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            line-height: 1;
        }

        .btn {
            position: absolute;
            width: 55px; height: 55px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.4) 100%);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 10px rgba(0,0,0,0.5), inset 0 0 8px rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            pointer-events: auto; color: white;
            transition: transform 0.1s, background 0.1s;
        }
        .btn:active { 
            transform: scale(0.95);
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, rgba(0,0,0,0.5) 100%);
        }
        
        .btn svg {
            width: 28px; height: 28px; fill: none; stroke: rgba(255, 255, 255, 0.9);
            stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.5));
        }

        #btnLeanBack    { bottom: 100px; left: 15px; }
        #btnLeanForward { bottom: 30px;  left: 50px; }
        #btnGas         { bottom: 100px; right: 15px; }
        #btnBrake       { bottom: 30px;  right: 50px; }

        .controls { display: none; } 
        .controls.active { display: block; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6);
            pointer-events: auto;
            transition: opacity 0.3s;
            z-index: 20;
        }
        .overlay h1 {
            font-size: 42px; color: white; text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }
        .overlay p {
            font-size: 18px; color: rgba(255,255,255,0.8);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        
        #gameOverScreen { 
            display: none; 
            background: #0f1410;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            padding: 10px 20px;
            box-sizing: border-box;
        }
        
        .score-header {
            text-align: center;
            font-size: 18px; 
            font-weight: bold;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .score-list {
            width: 100%;
            max-width: 600px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0; 
            font-size: 15px; 
            color: #e0e0e0;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .score-row.high-score {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border-bottom: none;
            margin-top: 5px;
        }

        .score-row.reward-row {
            font-size: 18px;
            font-weight: bold;
            color: #a6ff00; 
            border-bottom: none;
            align-items: center;
        }

        .coin-icon {
            height: 18px;
            width: auto;
            display: inline-block;
            vertical-align: middle;
            margin-left: 6px;
            border-radius: 50%;
        }

        .icon-btn {
            position: absolute;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.1s;
        }
        .icon-btn:active { transform: scale(0.9); }

        .home-btn { top: 15px; right: 20px; }
        .restart-btn { bottom: 15px; right: 20px; }

        .icon-btn svg {
            width: 40px; height: 40px; fill: #fff;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/planck-js@0.3/dist/planck.min.js"></script>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="ui-layer">
    <div class="top-bar">
        <div class="stats-left">
            <div class="stat-text">Best: <span id="bestDistanceText">0</span>m</div>
            <div class="stat-text" style="color: #a6ff00;">
                <img src="coin.png" id="coinIconTop" class="coin-icon" style="height: 20px; margin-right: 5px;" onerror="this.style.display='none'">
                <span id="coinBalanceText">0</span>
            </div>
        </div>
        
        <div class="stats-right">
            <div class="clock" id="clockText">00:00</div>
            <div class="score"><span id="distanceText">0</span> m</div>
        </div>
    </div>
    
    <div class="controls" id="controls">
        <div class="btn" id="btnLeanBack">
            <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
        </div>
        <div class="btn" id="btnLeanForward">
            <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg>
        </div>
        <div class="btn" id="btnGas">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
        <div class="btn" id="btnBrake">
            <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></svg>
        </div>
    </div>

    <div class="overlay" id="startScreen">
        <h1>Skyline Moto</h1>
        <p>Нажми, чтобы начать</p>
    </div>

    <div class="overlay" id="gameOverScreen">
        <div class="icon-btn home-btn" id="btnHome">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>

        <div class="score-header">SCORE</div>
        
        <div class="score-list">
            <div class="score-row">
                <span>Distance</span>
                <span id="go-distance">0m</span>
            </div>
            <div class="score-row">
                <span>Riding on the front wheel</span>
                <span id="go-stoppie">0s</span>
            </div>
            <div class="score-row">
                <span>Riding on the rear wheel</span>
                <span id="go-wheelie">0s</span>
            </div>
            <div class="score-row">
                <span>Frontflips</span>
                <span id="go-frontflips">0</span>
            </div>
            <div class="score-row">
                <span>Backflips</span>
                <span id="go-backflips">0</span>
            </div>
            <div class="score-row">
                <span>Total score</span>
                <span id="go-totalscore">0</span>
            </div>
            
            <div class="score-row high-score">
                <span>HIGH SCORE</span>
                <span id="go-highscore">0</span>
            </div>
            
            <div class="score-row reward-row">
                <span>REWARD</span>
                <span>
                    <span id="go-coins">0</span>
                    <img src="coin.png" class="coin-icon" onerror="this.style.display='none'">
                </span>
            </div>
        </div>

        <div class="icon-btn restart-btn" id="btnRestart">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </div>
    </div>
</div>

<script>
    const ENABLE_AUDIO = true; 
    const SCALE = 30; 
    const DEBUG_PHYSICS = true; // Включен режим отладки

    const BIKE_CATALOG = {
        ktr_300: {
            name: "KTR 300 EXC",
            density: 1.2,
            suspension: { freq: 4.5, damp: 0.7 },
            motor: { speed: 50, torque: 60, brake: 100 }
        }
    };
    let currentBike = BIKE_CATALOG.ktr_300;

    let totalCoins = parseInt(localStorage.getItem('totalCoins')) || 0;
    document.getElementById('coinBalanceText').innerText = totalCoins;
    
    let maxAirTime = 0;
    let currentAirTime = 0;
    
    let frontflipCount = 0;
    let backflipCount = 0;
    let accumulatedRotation = 0; 
    let lastAngle = 0;

    let maxWheelieTime = 0; 
    let currentWheelieTime = 0;
    
    let maxStoppieTime = 0; 
    let currentStoppieTime = 0;

    // Данные для авто-хитбокса
    let hitboxData = null;

    document.addEventListener('touchmove', function(e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

    const pl = planck;
    const world = new pl.World({ gravity: pl.Vec2(0, 10) });

    // --- ФИЗИЧЕСКИЕ СТОЛКНОВЕНИЯ ---
    world.on('begin-contact', (contact) => {
        if (gameState !== 'playing') return;
        
        const fixA = contact.getFixtureA();
        const fixB = contact.getFixtureB();
        const dataA = fixA.getUserData();
        const dataB = fixB.getUserData();

        const isTerrain = (dataA === 'terrain' || dataB === 'terrain');
        if (!isTerrain) return;

        const bikePart = dataA === 'terrain' ? dataB : dataA;

        if (bikePart === 'head') {
            triggerGameOver();
        }
        else if (bikePart === 'nose' || bikePart === 'tail' || bikePart === 'body') {
            jointRear.setMotorSpeed(0); jointFront.setMotorSpeed(0);
            jointRear.setMaxMotorTorque(0); jointFront.setMaxMotorTorque(0);
        }
    });

    const startX = 50000;
    let groundY = canvas.height - 80; 
    let terrainOffset = 0; 
    let gameState = 'start';
    let maxDistance = parseInt(localStorage.getItem('bestDistance')) || 0;
    document.getElementById('bestDistanceText').innerText = maxDistance;
    
    let cameraX = startX - (canvas.width * 0.3);
    let cameraY = 0; 
    const zoom = 1.1; 
    
    function noise(x) {
        let i = Math.floor(x);
        let f = x - i;
        let u = f * f * (3.0 - 2.0 * f);
        let r1 = Math.sin(i * 12.9898) * 43758.5453;
        let r2 = Math.sin((i + 1) * 12.9898) * 43758.5453;
        r1 = r1 - Math.floor(r1);
        r2 = r2 - Math.floor(r2);
        return r1 * (1 - u) + r2 * u;
    }

    function getTerrainY(x) {
        let y = groundY;
        y -= noise((x + terrainOffset) * 0.001) * 100;  
        y -= noise((x + terrainOffset) * 0.005) * 30;   
        
        let feature = noise((x + terrainOffset) * 0.0008); 
        
        if (feature > 0.6) {
            let p = (feature - 0.6) / 0.4; 
            let ramp = Math.sin(p * Math.PI) * 160; 
            y -= ramp;
        } else if (feature < 0.4) {
            let p = (0.4 - feature) / 0.4; 
            let pit = Math.sin(p * Math.PI) * 180;  
            y += pit;
        }
        return y;
    }

    let terrainBodies = [];
    let lastGeneratedX = startX - 1500; 
    const chunkWidth = 2; 
    const chunkSize = 100; 

    function generateTerrain() {
        while (lastGeneratedX < cameraX + (canvas.width / zoom) + 1000) {
            let vertices = [];
            for (let i = 0; i < chunkSize; i++) {
                let px = lastGeneratedX + (i * chunkWidth);
                let py = getTerrainY(px);
                vertices.push(pl.Vec2(px / SCALE, py / SCALE));
            }
            
            const chain = world.createBody();
            const chainShape = pl.Chain(vertices, false);
            let terrainFixture = chain.createFixture(chainShape, { friction: 1.0, restitution: 0.0 });
            terrainFixture.setUserData('terrain');
            
            terrainBodies.push({ body: chain, startX: lastGeneratedX, endX: lastGeneratedX + (chunkSize * chunkWidth) });
            lastGeneratedX += chunkSize * chunkWidth;
        }
    }

    function cleanupTerrain() {
        for (let i = terrainBodies.length - 1; i >= 0; i--) {
            if (terrainBodies[i].endX < cameraX - 1500) {
                world.destroyBody(terrainBodies[i].body);
                terrainBodies.splice(i, 1);
            }
        }
    }

    const wheelRadius = 10 / SCALE; 
    const wheelBase = 23 / SCALE; 
    
    let chassis, wheelRear, wheelFront;
    let jointRear, jointFront;

    function createBike(x, y) {
        if (chassis) {
            world.destroyBody(chassis);
            world.destroyBody(wheelRear);
            world.destroyBody(wheelFront);
        }

        chassis = world.createBody({ position: pl.Vec2(x / SCALE, y / SCALE), type: 'dynamic' });
        
        // Если хитбокс не просканирован (картинка не загрузилась), используем заглушку
        if (hitboxData) {
            // 1. Днище (основа, чтобы не проваливаться)
            let bodyFixture = chassis.createFixture(pl.Box(hitboxData.bodyW, hitboxData.bodyH, pl.Vec2(hitboxData.bodyX, hitboxData.bodyY)), { density: currentBike.density, friction: 0.3 });
            bodyFixture.setUserData('body');

            // 2. Голова (для смерти)
            let headFixture = chassis.createFixture(pl.Circle(hitboxData.headR, pl.Vec2(hitboxData.headX, hitboxData.headY)), { density: 0.1 });
            headFixture.setUserData('head');

            // 3. Нос (для кувырка)
            let noseFixture = chassis.createFixture(pl.Circle(hitboxData.noseR, pl.Vec2(hitboxData.noseX, hitboxData.noseY)), { density: 0.1 });
            noseFixture.setUserData('nose');

            // 4. Хвост (чтобы не проваливался задом)
            let tailFixture = chassis.createFixture(pl.Circle(hitboxData.tailR, pl.Vec2(hitboxData.tailX, hitboxData.tailY)), { density: 0.1 });
            tailFixture.setUserData('tail');
        } else {
            // Заглушка, если картинки нет
            chassis.createFixture(pl.Box(50 / SCALE, 10 / SCALE), { density: currentBike.density, friction: 0.3 }).setUserData('body');
            chassis.createFixture(pl.Circle(10 / SCALE, pl.Vec2(0, -20 / SCALE)), { density: 0.1 }).setUserData('head');
        }

        wheelRear = world.createBody({ position: pl.Vec2((x - wheelBase * SCALE) / SCALE, y / SCALE), type: 'dynamic' });
        wheelRear.createFixture(pl.Circle(wheelRadius), { density: 1.0, friction: 1.0 });

        wheelFront = world.createBody({ position: pl.Vec2((x + wheelBase * SCALE) / SCALE, y / SCALE), type: 'dynamic' });
        wheelFront.createFixture(pl.Circle(wheelRadius), { density: 1.0, friction: 1.0 });

        jointRear = world.createJoint(pl.WheelJoint({
            motorSpeed: 0, maxMotorTorque: currentBike.motor.torque, enableMotor: true,
            frequencyHz: currentBike.suspension.freq, dampingRatio: currentBike.suspension.damp, collideConnected: false
        }, chassis, wheelRear, wheelRear.getPosition(), pl.Vec2(0, 1)));

        jointFront = world.createJoint(pl.WheelJoint({
            motorSpeed: 0, maxMotorTorque: currentBike.motor.torque, enableMotor: true,
            frequencyHz: currentBike.suspension.freq, dampingRatio: currentBike.suspension.damp, collideConnected: false
        }, chassis, wheelFront, wheelFront.getPosition(), pl.Vec2(0, 1)));
    }

    const bikeImage = new Image();
    bikeImage.src = 'moto.png'; 
    let isImageLoaded = false;
    
    // --- АВТОМАТИЧЕСКИЙ ХИТБОКС ---
    bikeImage.onload = () => { 
        isImageLoaded = true; 
        
        const scanCanvas = document.createElement('canvas');
        const scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
        scanCanvas.width = bikeImage.width;
        scanCanvas.height = bikeImage.height;
        scanCtx.drawImage(bikeImage, 0, 0);
        
        try {
            const imgData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height).data;
            let minX = scanCanvas.width, maxX = 0, minY = scanCanvas.height, maxY = 0;
            
            // Ищем крайние непрозрачные пиксели
            for (let y = 0; y < scanCanvas.height; y++) {
                for (let x = 0; x < scanCanvas.width; x++) {
                    let alpha = imgData[(y * scanCanvas.width + x) * 4 + 3];
                    if (alpha > 128) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            // Вычисляем координаты относительно центра картинки
            let cx = scanCanvas.width / 2;
            let cy = scanCanvas.height / 2;

            // Переводим в физические координаты (делим на SCALE)
            // Голова (верхняя точка)
            hitboxData = {
                headX: (0) / SCALE, 
                headY: (minY - cy) / SCALE, 
                headR: 8 / SCALE,
                
                noseX: (maxX - cx) / SCALE, 
                noseY: (0) / SCALE, 
                noseR: 10 / SCALE,
                
                tailX: (minX - cx) / SCALE, 
                tailY: (0) / SCALE, 
                tailR: 10 / SCALE,
                
                bodyX: (0) / SCALE, 
                bodyY: (maxY - cy - 10) / SCALE, // Чуть выше самого низа (чтобы колеса не задевали)
                bodyW: 40 / SCALE, 
                bodyH: 10 / SCALE
            };
        } catch(e) {
            console.log("Ошибка чтения картинки (CORS или нет файла)", e);
        }
    };

    window.isGas = false; window.isBrake = false; 
    window.isLeanBack = false; window.isLeanForward = false;

    const particles = [];
    function spawnDust(x, y, speedX) {
        if (particles.length > 150) return; 
        for (let i = 0; i < 2; i++) {
            particles.push({
                x: x + (Math.random() - 0.5) * 15, 
                y: y + (Math.random() - 0.5) * 5,
                vx: -speedX * 0.8 - Math.random() * 8, 
                vy: -Math.random() * 4 - 1, 
                radius: Math.random() * 2 + 1, 
                alpha: 1.0, 
                decay: 0.03 + Math.random() * 0.03 
            });
        }
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; 
            p.vx *= 0.96; 
            p.alpha -= p.decay;
            if (p.alpha <= 0) particles.splice(i, 1);
        }
    }

    function drawParticles() {
        ctx.fillStyle = '#999'; 
        for (let p of particles) {
            ctx.globalAlpha = p.alpha; 
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1.0; 
    }

    setInterval(() => {
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        document.getElementById('clockText').innerText = timeStr;
    }, 1000);

    let audioCtx, idleBuffer, popBuffer, windBuffer, revBuffer;
    let idleSource, windSource, revSource;
    let idleGain, revGain, windGain, revFilter, revTremoloGain, revLfoTone, revLfoToneGain, revLfoVol, revLfoVolGain;
    let isAudioInitialized = false, previousGasState = false;
    
    async function loadAudio(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) return null;
            const arrayBuffer = await response.arrayBuffer();
            return await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) { return null; }
    }

    function createSeamlessBuffer(buffer, crossfadeTime = 2.0) {
        const sampleRate = buffer.sampleRate;
        const crossfadeSamples = Math.floor(crossfadeTime * sampleRate);
        const originalLength = buffer.length;
        const newLength = originalLength - crossfadeSamples;
        if (newLength <= 0) return buffer;
        const newBuffer = audioCtx.createBuffer(buffer.numberOfChannels, newLength, sampleRate);
        for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
            const originalData = buffer.getChannelData(channel);
            const newData = newBuffer.getChannelData(channel);
            for (let i = 0; i < newLength - crossfadeSamples; i++) newData[i] = originalData[i];
            for (let i = 0; i < crossfadeSamples; i++) {
                const ratio = i / crossfadeSamples;
                newData[newLength - crossfadeSamples + i] = (originalData[newLength - crossfadeSamples + i] * Math.cos(ratio * 0.5 * Math.PI)) + (originalData[i] * Math.sin(ratio * 0.5 * Math.PI));
            }
        }
        return newBuffer;
    }

    async function initAudio() {
        if (!ENABLE_AUDIO || isAudioInitialized) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            idleBuffer = await loadAudio('engine_idle.mp3');
            popBuffer = await loadAudio('engine_pop.mp3');
            windBuffer = await loadAudio('wind.mp3');
            let rawRevBuffer = await loadAudio('engine_rev.mp3');
            if (rawRevBuffer) revBuffer = createSeamlessBuffer(rawRevBuffer, 2.0);

            idleGain = audioCtx.createGain(); revGain = audioCtx.createGain(); windGain = audioCtx.createGain(); revTremoloGain = audioCtx.createGain();
            idleGain.gain.value = 0; revGain.gain.value = 0; windGain.gain.value = 0; revTremoloGain.gain.value = 0.9; 
            revFilter = audioCtx.createBiquadFilter(); revFilter.type = 'lowpass'; revFilter.frequency.value = 2500; 
            idleGain.connect(audioCtx.destination); revFilter.connect(revTremoloGain); revTremoloGain.connect(revGain); revGain.connect(audioCtx.destination); windGain.connect(audioCtx.destination);

            revLfoTone = audioCtx.createOscillator(); revLfoTone.type = 'sine'; revLfoTone.frequency.value = 0.3; 
            revLfoToneGain = audioCtx.createGain(); revLfoToneGain.gain.value = 0.01; 
            revLfoTone.connect(revLfoToneGain); revLfoTone.start();
            revLfoVol = audioCtx.createOscillator(); revLfoVol.type = 'sine'; revLfoVol.frequency.value = 0.2; 
            revLfoVolGain = audioCtx.createGain(); revLfoVolGain.gain.value = 0.1; 
            revLfoVol.connect(revLfoVolGain); revLfoVolGain.connect(revTremoloGain.gain); revLfoVol.start();

            if (idleBuffer) { idleSource = audioCtx.createBufferSource(); idleSource.buffer = idleBuffer; idleSource.loop = true; idleSource.connect(idleGain); idleSource.start(); }
            if (revBuffer) { revSource = audioCtx.createBufferSource(); revSource.buffer = revBuffer; revSource.loop = true; revSource.connect(revFilter); revLfoToneGain.connect(revSource.playbackRate); revSource.start(0); }
            if (windBuffer) { windSource = audioCtx.createBufferSource(); windSource.buffer = windBuffer; windSource.loop = true; windSource.connect(windGain); windSource.start(); }
            else {
                const bufferSize = audioCtx.sampleRate * 2; const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate); const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1; 
                windSource = audioCtx.createBufferSource(); windSource.buffer = buffer; windSource.loop = true;
                const windFilter = audioCtx.createBiquadFilter(); windFilter.type = 'lowpass'; windFilter.frequency.value = 600; 
                windSource.connect(windFilter); windFilter.connect(windGain); windSource.start();
            }
            isAudioInitialized = true;
        } catch (e) { console.log("Ошибка аудио: ", e); }
    }

    function startRevSound() {
        if (!isAudioInitialized || !revBuffer) return;
        if (revSource) { try { revSource.stop(); revLfoToneGain.disconnect(revSource.playbackRate); } catch(e){} }
        revSource = audioCtx.createBufferSource(); revSource.buffer = revBuffer; revSource.loop = true;
        revLfoToneGain.connect(revSource.playbackRate); revSource.connect(revFilter);
        const randomOffset = Math.random() * (revBuffer.duration - 1); revSource.start(0, randomOffset);
    }

    function playPop() {
        if (!ENABLE_AUDIO || !popBuffer || !audioCtx) return;
        const popSource = audioCtx.createBufferSource(); const popGain = audioCtx.createGain();
        popSource.buffer = popBuffer; popSource.connect(popGain); popGain.connect(audioCtx.destination); popGain.gain.value = 1.0; popSource.start();
    }

    function bindBtn(id, variableName) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); if(gameState === 'playing') window[variableName] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); window[variableName] = false; });
        el.addEventListener('touchcancel', (e) => { e.preventDefault(); window[variableName] = false; });
    }
    bindBtn('btnGas', 'isGas'); bindBtn('btnBrake', 'isBrake'); bindBtn('btnLeanBack', 'isLeanBack'); bindBtn('btnLeanForward', 'isLeanForward');

    function resetGame() {
        terrainOffset = Math.random() * 10000;
        for (let i = 0; i < terrainBodies.length; i++) world.destroyBody(terrainBodies[i].body);
        terrainBodies = []; lastGeneratedX = startX - 1500; cameraX = startX - (canvas.width * 0.3);
        
        let startHillY = getTerrainY(startX);
        let startY = startHillY - 60; 
        
        createBike(startX, startY);
        generateTerrain();

        window.isGas = false; window.isBrake = false; window.isLeanBack = false; window.isLeanForward = false;
        
        maxAirTime = 0; currentAirTime = 0; 
        frontflipCount = 0; backflipCount = 0;
        accumulatedRotation = 0; lastAngle = 0;
        maxWheelieTime = 0; currentWheelieTime = 0;
        maxStoppieTime = 0; currentStoppieTime = 0;
        particles.length = 0;

        if (ENABLE_AUDIO && isAudioInitialized) {
            idleGain.gain.setValueAtTime(0.4, audioCtx.currentTime); revGain.gain.setValueAtTime(0, audioCtx.currentTime); windGain.gain.setValueAtTime(0, audioCtx.currentTime);
            if (revFilter) revFilter.frequency.value = 2500;
            startRevSound();
        }
        document.getElementById('distanceText').innerText = "0";
    }

    function triggerGameOver() {
        gameState = 'gameover';
        
        let dist = Math.floor(((chassis.getPosition().x * SCALE) - startX) / 10);
        let earnedCoins = Math.floor(dist / 100) + ((frontflipCount + backflipCount) * 10);
        
        totalCoins += earnedCoins;
        localStorage.setItem('totalCoins', totalCoins);
        
        document.getElementById('go-distance').innerText = dist + "m";
        document.getElementById('go-stoppie').innerText = maxStoppieTime.toFixed(1) + "s";
        document.getElementById('go-wheelie').innerText = maxWheelieTime.toFixed(1) + "s";
        document.getElementById('go-frontflips').innerText = frontflipCount;
        document.getElementById('go-backflips').innerText = backflipCount;
        document.getElementById('go-totalscore').innerText = dist + (frontflipCount * 100) + (backflipCount * 100);
        document.getElementById('go-highscore').innerText = maxDistance + "m";
        document.getElementById('go-coins').innerText = earnedCoins;
        
        document.getElementById('coinBalanceText').innerText = totalCoins;
        document.getElementById('gameOverScreen').style.display = 'flex';
        
        if (ENABLE_AUDIO && isAudioInitialized) { 
            idleGain.gain.setValueAtTime(0, audioCtx.currentTime); 
            revGain.gain.setValueAtTime(0, audioCtx.currentTime); 
            windGain.gain.setValueAtTime(0, audioCtx.currentTime); 
        }
    }

    document.getElementById('startScreen').addEventListener('touchstart', async (e) => {
        e.preventDefault(); await initAudio(); 
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('controls').classList.add('active');
        resetGame(); gameState = 'playing';
    });

    document.getElementById('btnRestart').addEventListener('touchstart', (e) => {
        e.preventDefault();
        document.getElementById('gameOverScreen').style.display = 'none';
        resetGame(); gameState = 'playing';
    });
    
    document.getElementById('btnHome').addEventListener('touchstart', (e) => {
        e.preventDefault();
        document.getElementById('gameOverScreen').style.display = 'none';
        document.getElementById('startScreen').style.display = 'flex';
        document.getElementById('controls').classList.remove('active');
        gameState = 'start';
        
        if (ENABLE_AUDIO && isAudioInitialized) {
            idleGain.gain.setValueAtTime(0, audioCtx.currentTime);
            revGain.gain.setValueAtTime(0, audioCtx.currentTime);
            windGain.gain.setValueAtTime(0, audioCtx.currentTime);
        }
    });

    function drawMountainLayer(yOffset, height, color, parallaxOffset) {
        ctx.fillStyle = color;
        ctx.beginPath();
        let startDrawX = Math.floor(cameraX) - 100; let endDrawX = Math.floor(cameraX) + (canvas.width / zoom) + 100;
        ctx.moveTo(startDrawX, canvas.height * 2);
        for (let x = startDrawX; x <= endDrawX; x += 10) {
            let worldX = x + parallaxOffset;
            let y = (canvas.height - yOffset) - Math.sin(worldX * 0.005) * height - Math.cos(worldX * 0.01) * (height / 2);
            ctx.lineTo(x, y);
        }
        ctx.lineTo(endDrawX, canvas.height * 2); ctx.closePath(); ctx.fill();
    }

    function drawTerrain() {
        ctx.fillStyle = '#000'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4; 
        ctx.beginPath(); ctx.moveTo(cameraX - 100, canvas.height + 2000);
        for (let chunk of terrainBodies) {
            let vertices = chunk.body.getFixtureList().getShape().m_vertices;
            for (let i = 0; i < vertices.length; i++) ctx.lineTo(vertices[i].x * SCALE, vertices[i].y * SCALE);
        }
        ctx.lineTo(lastGeneratedX, canvas.height + 2000); ctx.closePath(); ctx.fill(); ctx.stroke();
    }

    function drawWheel(wheel) {
        ctx.save();
        ctx.translate(wheel.getPosition().x * SCALE, wheel.getPosition().y * SCALE);
        ctx.rotate(wheel.getAngle());
        ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0, 0, wheelRadius * SCALE, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, wheelRadius * SCALE - 2, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
    }

    let lastDisplayedDistance = -1;
    let lastTime = performance.now();

    function update() {
        requestAnimationFrame(update);
        let currentTime = performance.now();
        let dt = (currentTime - lastTime) / 1000;
        lastTime = currentTime;
        if (dt > 0.1) dt = 0.1; 

        if (gameState === 'playing') {
            world.step(1/60, dt, 3);
            updateParticles();
        }

        if (gameState === 'playing' && chassis) {
            let speed = Math.abs(wheelRear.getAngularVelocity());
            let isAirborne = Math.abs(chassis.getLinearVelocity().y) > 1.5;
            let angle = chassis.getAngle();
            
            if (isAirborne) {
                currentAirTime += dt;
                if (currentAirTime > maxAirTime) maxAirTime = currentAirTime;

                let deltaAngle = angle - lastAngle;
                if (deltaAngle > Math.PI) deltaAngle -= 2 * Math.PI;
                if (deltaAngle < -Math.PI) deltaAngle += 2 * Math.PI;
                
                accumulatedRotation += deltaAngle;
                lastAngle = angle;

                if (Math.abs(accumulatedRotation) >= Math.PI * 2) {
                    if (accumulatedRotation > 0) backflipCount++; 
                    else frontflipCount++; 
                    accumulatedRotation -= Math.sign(accumulatedRotation) * Math.PI * 2;
                }
            } else {
                currentAirTime = 0;
                accumulatedRotation = 0;
                lastAngle = angle; 

                if (angle < -0.3 && Math.abs(chassis.getLinearVelocity().x) > 1) {
                    currentWheelieTime += dt;
                    if (currentWheelieTime > maxWheelieTime) maxWheelieTime = currentWheelieTime;
                } else {
                    currentWheelieTime = 0;
                }

                if (angle > 0.3 && Math.abs(chassis.getLinearVelocity().x) > 1) {
                    currentStoppieTime += dt;
                    if (currentStoppieTime > maxStoppieTime) maxStoppieTime = currentStoppieTime;
                } else {
                    currentStoppieTime = 0;
                }
            }

            if (window.isGas) {
                jointRear.setMotorSpeed(currentBike.motor.speed); jointFront.setMotorSpeed(currentBike.motor.speed);
                jointRear.setMaxMotorTorque(currentBike.motor.torque); jointFront.setMaxMotorTorque(currentBike.motor.torque);
            } else if (window.isBrake) {
                jointRear.setMotorSpeed(0); jointFront.setMotorSpeed(0);
                jointRear.setMaxMotorTorque(currentBike.motor.brake); jointFront.setMaxMotorTorque(currentBike.motor.brake);
            } else {
                jointRear.setMaxMotorTorque(0); jointFront.setMaxMotorTorque(0);
            }

            if (!isAirborne && speed > 5) {
                let dustX = (chassis.getPosition().x * SCALE) - (wheelBase * SCALE * 0.8);
                let dustY = (chassis.getPosition().y * SCALE) + 10;
                spawnDust(dustX, dustY, chassis.getLinearVelocity().x * SCALE);
                if (window.isBrake) spawnDust(dustX, dustY, chassis.getLinearVelocity().x * SCALE);
            }

            let tiltPower = 20; let maxTiltSpeed = 2.5;  
            if (window.isLeanBack) { if (chassis.getAngularVelocity() > -maxTiltSpeed) chassis.applyTorque(-tiltPower, true); } 
            else if (window.isLeanForward) { if (chassis.getAngularVelocity() < maxTiltSpeed) chassis.applyTorque(tiltPower, true); }

            if (ENABLE_AUDIO && isAudioInitialized) {
                if (window.isGas) { idleGain.gain.cancelScheduledValues(audioCtx.currentTime); idleGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05); } 
                else { idleGain.gain.cancelScheduledValues(audioCtx.currentTime); idleGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.1); }
                let targetRev = window.isGas ? 0.8 : 0; let targetWind = Math.min(0.3, 0.05 + speed * 0.15); 
                revGain.gain.setTargetAtTime(targetRev, audioCtx.currentTime, 0.1); windGain.gain.setTargetAtTime(targetWind, audioCtx.currentTime, 0.1);
                if (window.isGas && revSource) {
                    let targetRate = 1.0 + (speed * 0.3); let finalRate = Math.min(1.3, targetRate);
                    revSource.playbackRate.setTargetAtTime(finalRate, audioCtx.currentTime, 0.1);
                    revFilter.frequency.setTargetAtTime(Math.max(1000, 2500 - (speed * 1000)), audioCtx.currentTime, 0.1);
                    previousGasState = true;
                } else { if (previousGasState === true) { if (Math.random() > 0.5) playPop(); previousGasState = false; } }
            }

            if (chassis.getPosition().y > canvas.height / SCALE + 10) {
                triggerGameOver();
            }

            let targetCameraX = (chassis.getPosition().x * SCALE) - ((canvas.width * 0.3) / zoom);
            cameraX += (targetCameraX - cameraX) * 0.1; 
            let targetCameraY = (canvas.height * 0.5) - (chassis.getPosition().y * SCALE);
            cameraY += (targetCameraY - cameraY) * 0.1;
            
            generateTerrain(); cleanupTerrain();

            let currentDistance = Math.max(0, Math.floor(((chassis.getPosition().x * SCALE) - startX) / 10));
            if (currentDistance !== lastDisplayedDistance) { document.getElementById('distanceText').innerText = currentDistance; lastDisplayedDistance = currentDistance; }
            if (currentDistance > maxDistance) { maxDistance = currentDistance; localStorage.setItem('bestDistance', maxDistance); document.getElementById('bestDistanceText').innerText = maxDistance; }
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#1a0b2e'); gradient.addColorStop(0.4, '#5a2b58'); gradient.addColorStop(0.7, '#d96b4e'); gradient.addColorStop(1, '#f5c26b');
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

        let sunX = canvas.width * 0.75; let sunY = canvas.height * 0.35;
        let sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 150);
        sunGlow.addColorStop(0, 'rgba(255, 243, 212, 0.8)'); sunGlow.addColorStop(0.5, 'rgba(255, 243, 212, 0.2)'); sunGlow.addColorStop(1, 'rgba(255, 243, 212, 0)');
        ctx.fillStyle = sunGlow; ctx.beginPath(); ctx.arc(sunX, sunY, 150, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff3d4'; ctx.beginPath(); ctx.arc(sunX, sunY, 45, 0, Math.PI * 2); ctx.fill();

        ctx.save(); ctx.scale(zoom, zoom); ctx.translate(0, cameraY); ctx.translate(-cameraX, 0);
        drawMountainLayer(120, 60, '#3a2354', cameraX * 0.2); drawMountainLayer(60, 100, '#1e1129', cameraX * 0.5);
        drawTerrain();

        if (chassis) {
            ctx.save();
            ctx.translate(chassis.getPosition().x * SCALE, chassis.getPosition().y * SCALE);
            ctx.rotate(chassis.getAngle());
            if (isImageLoaded) ctx.drawImage(bikeImage, -bikeImage.width/2, -bikeImage.height/2, bikeImage.width, bikeImage.height); 
            
            // --- ОТЛАДКА (Блоки строятся автоматически по картинке) ---
            if (DEBUG_PHYSICS) {
                const drawFix = (fixture, color) => {
                    const shape = fixture.getShape();
                    if (shape.getType() === 'polygon') {
                        const vertices = shape.m_vertices;
                        ctx.beginPath();
                        ctx.moveTo(vertices[0].x * SCALE, vertices[0].y * SCALE);
                        for (let i = 1; i < vertices.length; i++) {
                            ctx.lineTo(vertices[i].x * SCALE, vertices[i].y * SCALE);
                        }
                        ctx.closePath();
                        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
                    } else if (shape.getType() === 'circle') {
                        ctx.beginPath();
                        ctx.arc(shape.m_p.x * SCALE, shape.m_p.y * SCALE, shape.m_radius * SCALE, 0, Math.PI * 2);
                        ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
                    }
                };
                let fix = chassis.getFixtureList();
                while (fix) {
                    if (fix.getUserData() === 'body') drawFix(fix, 'red');
                    if (fix.getUserData() === 'head') drawFix(fix, 'yellow');
                    if (fix.getUserData() === 'nose') drawFix(fix, 'cyan');
                    if (fix.getUserData() === 'tail') drawFix(fix, 'magenta');
                    fix = fix.getNext();
                }
            }
            // --- КОНЕЦ ОТЛАДКИ ---
            
            ctx.restore();
            drawWheel(wheelRear); drawWheel(wheelFront);
        }

        drawParticles(); 
        ctx.restore(); 
    }

    update();
</script>
