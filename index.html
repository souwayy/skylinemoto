<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skyline Moto</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();

    const Engine = Matter.Engine,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite,
          Constraint = Matter.Constraint,
          Body = Matter.Body;

    const engine = Engine.create();
    const world = engine.world;
    engine.gravity.y = 1; 

    // --- ЗЕМЛЯ ---
    let groundY = canvas.height - 80; 
    let ground = Bodies.rectangle(canvas.width / 2, groundY + 50, canvas.width * 5, 100, { isStatic: true });

    // --- СОЗДАЕМ МОТОЦИКЛ ---
    const wheelRadius = 20;
    
    // Заднее колесо
    const wheelRear = Bodies.circle(canvas.width / 2 - 40, 100, wheelRadius, { 
        density: 0.05, friction: 1 
    });
    // Переднее колесо
    const wheelFront = Bodies.circle(canvas.width / 2 + 40, 100, wheelRadius, { 
        density: 0.05, friction: 1 
    });
    // Рама
    const chassis = Bodies.rectangle(canvas.width / 2, 90, 80, 20, { 
        density: 0.1 
    });

    // Подвеска
    const suspensionRear = Constraint.create({
        bodyA: wheelRear, pointB: { x: -40, y: 0 }, bodyB: chassis,
        stiffness: 0.1, damping: 0.1
    });
    const suspensionFront = Constraint.create({
        bodyA: wheelFront, pointB: { x: 40, y: 0 }, bodyB: chassis,
        stiffness: 0.1, damping: 0.1
    });

    const moto = Composite.create({
        bodies: [wheelRear, wheelFront, chassis],
        constraints: [suspensionRear, suspensionFront]
    });

    Composite.add(world, [ground, moto]);

    // --- УПРАВЛЕНИЕ ---
    let isGas = false;
    let isBrake = false;

    window.addEventListener('touchstart', (e) => {
        const touchX = e.touches[0].clientX;
        if (touchX > window.innerWidth / 2) isGas = true;
        else isBrake = true;
    });

    window.addEventListener('touchend', () => {
        isGas = false;
        isBrake = false;
    });

    // --- ОТРИСОВКА ---
    let offset1 = 0, offset2 = 0, offset3 = 0;

    function drawMountainLayer(yOffset, height, color, offset) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        for (let x = 0; x <= canvas.width; x += 10) {
            let y = canvas.height - yOffset 
                    - Math.sin((x + offset) * 0.005) * height 
                    - Math.cos((x + offset) * 0.01) * (height / 2);
            ctx.lineTo(x, y);
        }
        ctx.lineTo(canvas.width, canvas.height);
        ctx.closePath();
        ctx.fill();
    }

    // --- УПРОЩЕННАЯ ЗЕМЛЯ (РОВНАЯ) ---
    function drawTerrain(offset) {
        ctx.fillStyle = '#000000'; 
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        
        // Рисуем ровную линию на уровне физической земли
        ctx.lineTo(0, canvas.height - 80);
        ctx.lineTo(canvas.width, canvas.height - 80);
        
        ctx.lineTo(canvas.width, canvas.height);
        ctx.closePath();
        ctx.fill();

        // Добавляем траву на ровной поверхности
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        for (let x = 0; x <= canvas.width; x += 20) {
            let patch = Math.sin((x + offset) * 0.03); 
            if (patch > 0.6) {
                let y = canvas.height - 80; // Ровная линия
                for (let i = 0; i < 3; i++) {
                    let startX = x + (i * 4) - 4;
                    let lean = Math.sin((x + offset) * 0.1 + i) * 6;
                    let height = 6 + Math.cos((x + offset) * 0.2 + i) * 4;
                    ctx.beginPath();
                    ctx.moveTo(startX, y + 2);
                    ctx.lineTo(startX + lean, y - height);
                    ctx.stroke();
                }
            }
        }
    }

    function drawWheel(wheel) {
        ctx.save();
        ctx.translate(wheel.position.x, wheel.position.y);
        ctx.rotate(wheel.angle);
        ctx.fillStyle = '#000'; 
        ctx.beginPath();
        ctx.arc(0, 0, wheelRadius, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.strokeStyle = '#fff'; 
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-wheelRadius, 0); ctx.lineTo(wheelRadius, 0);
        ctx.moveTo(0, -wheelRadius); ctx.lineTo(0, wheelRadius);
        ctx.stroke();
        ctx.restore();
    }

    function update() {
        if (isGas) {
            Body.setAngularVelocity(wheelRear, 0.3);
            Body.setAngularVelocity(wheelFront, 0.3);
        }
        if (isBrake) {
            Body.setAngularVelocity(wheelRear, -0.1);
            Body.setAngularVelocity(wheelFront, -0.1);
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#1a0b2e');
        gradient.addColorStop(0.4, '#5a2b58');
        gradient.addColorStop(0.7, '#d96b4e');
        gradient.addColorStop(1, '#f5c26b');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#fff3d4';
        ctx.beginPath();
        ctx.arc(canvas.width * 0.75, canvas.height * 0.35, 45, 0, Math.PI * 2);
        ctx.fill();

        drawMountainLayer(120, 60, '#3a2354', offset1);
        drawMountainLayer(60, 100, '#1e1129', offset2);
        drawTerrain(offset3);

        // Рама
        ctx.save();
        ctx.translate(chassis.position.x, chassis.position.y);
        ctx.rotate(chassis.angle);
        ctx.fillStyle = '#000'; 
        ctx.fillRect(-40, -10, 80, 20); 
        ctx.beginPath();
        ctx.arc(0, -25, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        drawWheel(wheelRear);
        drawWheel(wheelFront);

        let bgSpeed = wheelFront.velocity.x * 1.5; 
        offset1 += bgSpeed * 0.3;
        offset2 += bgSpeed * 0.6;
        offset3 += bgSpeed * 1.0;

        requestAnimationFrame(update);
    }

    const runner = Runner.create();
    Runner.run(runner, engine);
    update();

    window.addEventListener('resize', () => {
        resizeCanvas();
        groundY = canvas.height - 80;
        Body.setPosition(ground, { x: canvas.width / 2, y: groundY + 50 });
    });
</script>
</body>
</html>
