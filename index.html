<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nyxride (v15.5)</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            touch-action: none; -webkit-user-select: none; user-select: none; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas { display: block; touch-action: none; }

        /* --- ОБЩИЕ СТИЛИ UI --- */
        .hidden { display: none !important; }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; pointer-events: auto; z-index: 50;
        }

        /* --- ЭКРАН ПОВОРОТА (САМЫЙ ВЫСОКИЙ Z-INDEX) --- */
        #rotateDevice { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 10000;
            display: none; flex-direction: column; align-items: center; justify-content: center; 
            color: white; text-align: center; 
        }
        #rotateDevice svg {
            width: 100px; height: 100px; fill: none; stroke: white; stroke-width: 4;
            margin-bottom: 30px; stroke-linecap: round; stroke-linejoin: round;
            filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));
        }
        #rotateDevice h2 { font-size: 24px; font-weight: 600; margin: 0; line-height: 1.4; padding: 0 20px; }

        /* --- ЗАСТАВКА (SPLASH SCREEN) --- */
        #splashScreen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background-color: #000; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.8s ease-in-out;
        }
        #splashScreen img {
            /* Сохраняем пропорции и не даем логотипу растянуться */
            width: auto; height: auto;
            max-width: 85vw; max-height: 85vh; 
            object-fit: contain;
            animation: pulseLogo 2s ease-in-out infinite;
        }
        @keyframes pulseLogo { 
            0%, 100% { transform: scale(1); opacity: 0.8; filter: drop-shadow(0 0 10px rgba(255,100,0,0.2)); } 
            50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 30px rgba(255,100,0,0.6)); } 
        }

        /* --- ГЛАВНОЕ МЕНЮ --- */
        #mainMenu {
            background: url('menu_bg.jpg') no-repeat center center;
            background-size: cover;
        }
        
        .menu-logo {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            font-size: 52px; font-weight: 900; color: #fff; letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(255,100,0,0.8), 0 5px 15px rgba(0,0,0,0.9);
            text-transform: uppercase; pointer-events: none; font-style: italic;
            z-index: 10;
        }

        .menu-header {
            display: flex; justify-content: space-between; padding: 20px; pointer-events: none; z-index: 10;
        }
        .coin-display {
            display: flex; align-items: center; background: rgba(0,0,0,0.7);
            padding: 5px 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
            color: #fff; font-size: 20px; font-weight: bold; margin-right: 15px;
        }
        .coin-display img { height: 24px; margin-right: 8px; }

        .sprite-btn {
            background-image: url('ui_buttons.png');
            background-size: 500% 200%;
            border: none; pointer-events: auto; cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            background-color: transparent;
        }
        .sprite-btn:active { transform: scale(0.9); filter: brightness(1.5); }

        .btn-shop { background-position: 0% 100%; width: 70px; height: 70px; }
        .btn-settings { background-position: 25% 100%; width: 60px; height: 60px; }
        .btn-quests { background-position: 50% 100%; width: 60px; height: 60px; }
        .btn-left { background-position: 75% 100%; width: 50px; height: 50px; }
        .btn-right { background-position: 100% 100%; width: 50px; height: 50px; }
        
        .btn-play { 
            background-position: 0% 0%; background-size: 100% 200%; 
            width: 220px; height: 75px; position: absolute; bottom: 40px; right: 40px;
            z-index: 20;
        }

        .bike-stats {
            position: absolute; top: 50%; left: 5%; transform: translateY(-50%);
            width: 280px; pointer-events: none;
            background: rgba(0,0,0,0.7); padding: 20px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1); z-index: 10;
            backdrop-filter: blur(5px);
        }
        .bike-name { color: #fff; font-size: 20px; font-weight: bold; text-align: center; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px; }
        .stat-row { display: flex; align-items: center; margin-bottom: 10px; }
        .stat-label { color: #aaa; font-size: 13px; width: 100px; font-weight: bold; }
        .stat-bar-bg { flex-grow: 1; height: 10px; background: #222; border-radius: 5px; overflow: hidden; border: 1px solid #000; }
        .stat-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff3333, #ffcc00, #33ff33); transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        .bike-carousel {
            position: absolute; top: 55%; left: 55%; transform: translate(-50%, -50%);
            display: flex; align-items: center; gap: 20px; pointer-events: auto; z-index: 10;
        }
        #menuBikeCanvas { 
            width: 220px; height: 130px; 
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.8)); 
        }

        /* --- ИГРОВОЙ ИНТЕРФЕЙС --- */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        .top-bar { display: flex; justify-content: space-between; padding: 20px; align-items: flex-start; }
        .stats-left { display: flex; flex-direction: column; gap: 5px; }
        .stat-text { font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.7); text-transform: uppercase; }
        .stats-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        .score { font-size: 32px; font-weight: bold; color: white; text-shadow: 0 2px 5px #000; }
        
        .btn-game { position: absolute; width: 60px; height: 60px; border-radius: 50%; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.2); pointer-events: auto; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-game svg { width: 30px; height: 30px; stroke: white; stroke-width: 2.5; }
        #btnLeanBack { bottom: 140px; left: 20px; } #btnLeanForward { bottom: 60px; left: 60px; }
        #btnGas { bottom: 140px; right: 20px; } #btnBrake { bottom: 60px; right: 60px; }

        #btnPause {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 44px; height: 44px; pointer-events: auto; background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.2); border-radius: 8px;
        }

        /* --- ЭКРАН ПАУЗЫ --- */
        #pauseScreen {
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: auto; z-index: 60; backdrop-filter: blur(5px);
        }
        .pause-title { color: #fff; font-size: 40px; font-weight: 900; margin-bottom: 40px; letter-spacing: 4px; font-style: italic;}
        .pause-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 15px 40px; margin: 10px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; width: 220px; text-align: center; text-transform: uppercase; }
        .pause-btn:active { background: rgba(255,255,255,0.3); }

        /* --- ЭКРАН СМЕРТИ --- */
        #gameOverScreen {
            display: none; background: url('menu_bg.jpg') no-repeat center center; background-size: cover;
            flex-direction: column; justify-content: center; align-items: center; pointer-events: auto; z-index: 40;
        }
        #gameOverScreen::before { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(10,5,15,0.9); z-index: -1; }
        .score-header { font-size: 32px; font-weight: 900; color: #fff; margin-bottom: 20px; font-style: italic; letter-spacing: 2px; }
        .score-list { width: 100%; max-width: 500px; padding: 0 30px; }
        .score-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 16px; color: #ddd; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .score-row.high-score { font-size: 20px; font-weight: bold; color: #fff; border: none; margin-top: 15px; }
        .score-row.reward-row { font-size: 24px; font-weight: bold; color: #ffd700; border: none; margin-top: 10px; align-items: center; }
        
        .gameover-buttons { display: flex; gap: 30px; margin-top: 30px; }
        .icon-btn { cursor: pointer; width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; }
        .icon-btn svg { width: 35px; height: 35px; stroke: #fff; stroke-width: 2.5; }

        .version-text { position: absolute; bottom: 5px; left: 5px; color: rgba(255,255,255,0.3); font-size: 12px; z-index: 100; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/planck-js@0.3/dist/planck.min.js"></script>
</head>
<body>

<!-- ЭКРАН ПОВОРОТА (Самый высокий z-index) -->
<div id="rotateDevice">
    <svg viewBox="0 0 100 100">
        <g fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="35" y="20" width="30" height="60" rx="4" ry="4">
                <animateTransform attributeName="transform" type="rotate"
                    values="0 50 50; 90 50 50; 90 50 50; 0 50 50"
                    keyTimes="0; 0.4; 0.6; 1"
                    dur="3s" repeatCount="indefinite" />
            </rect>
            <circle cx="50" cy="72" r="2">
                <animateTransform attributeName="transform" type="rotate"
                    values="0 50 50; 90 50 50; 90 50 50; 0 50 50"
                    keyTimes="0; 0.4; 0.6; 1"
                    dur="3s" repeatCount="indefinite" />
            </circle>
            <line x1="45" y1="26" x2="55" y2="26">
                <animateTransform attributeName="transform" type="rotate"
                    values="0 50 50; 90 50 50; 90 50 50; 0 50 50"
                    keyTimes="0; 0.4; 0.6; 1"
                    dur="3s" repeatCount="indefinite" />
            </line>
        </g>
    </svg>
    <h2>Пожалуйста, поверните устройство</h2>
</div>

<!-- ЗАСТАВКА -->
<div id="splashScreen">
    <img src="splash.png" alt="Souway Games" onerror="this.src='moto.png'; this.style.width='200px';">
</div>

<!-- ГЛАВНОЕ МЕНЮ -->
<div class="overlay hidden" id="mainMenu">
    <div class="menu-logo">NYXRIDE</div>
    
    <div class="menu-header">
        <div style="display: flex; gap: 10px; pointer-events: auto;">
            <button class="sprite-btn btn-quests" id="btnMenuQuests"></button>
            <button class="sprite-btn btn-settings" id="btnMenuSettings"></button>
        </div>
        <div style="display: flex; align-items: center;">
            <div class="coin-display">
                <img src="coin.png" onerror="this.style.display='none'">
                <span id="menuCoinBalance">0</span>
            </div>
            <button class="sprite-btn btn-shop" id="btnMenuShop"></button>
        </div>
    </div>

    <div class="bike-stats">
        <div class="bike-name" id="menuBikeName">CTM 300 EXC</div>
        <div class="stat-row"><div class="stat-label">SPEED</div><div class="stat-bar-bg"><div class="stat-bar-fill" id="statSpeed"></div></div></div>
        <div class="stat-row"><div class="stat-label">ACCEL</div><div class="stat-bar-bg"><div class="stat-bar-fill" id="statAccel"></div></div></div>
        <div class="stat-row"><div class="stat-label">SUSPENSION</div><div class="stat-bar-bg"><div class="stat-bar-fill" id="statSusp"></div></div></div>
        <div class="stat-row"><div class="stat-label">STABILITY</div><div class="stat-bar-bg"><div class="stat-bar-fill" id="statStabil"></div></div></div>
    </div>

    <div class="bike-carousel">
        <button class="sprite-btn btn-left" id="btnPrevBike"></button>
        <canvas id="menuBikeCanvas" width="220" height="130"></canvas>
        <button class="sprite-btn btn-right" id="btnNextBike"></button>
    </div>

    <button class="sprite-btn btn-play" id="btnMenuPlay"></button>
</div>

<!-- ИГРОВОЙ ИНТЕРФЕЙС -->
<div class="ui-layer hidden" id="gameUI">
    <div class="top-bar">
        <div class="stats-left">
            <div class="stat-text">Best: <span id="bestDistanceText">0</span>m</div>
            <div class="stat-text" style="color: #fff3d4; display: flex; align-items: center;">
                <img src="coin.png" style="height: 20px; margin-right: 5px;" onerror="this.style.display='none'">
                <span id="coinBalanceText">0</span>
            </div>
        </div>
        <div class="stats-right">
            <div class="score"><span id="distanceText">0</span> m</div>
        </div>
    </div>
    
    <button id="btnPause">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>

    <div class="controls" id="controls">
        <div class="btn-game" id="btnLeanBack"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg></div>
        <div class="btn-game" id="btnLeanForward"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg></div>
        <div class="btn-game" id="btnGas"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
        <div class="btn-game" id="btnBrake"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></svg></div>
    </div>
</div>

<!-- ЭКРАН ПАУЗЫ -->
<div class="overlay hidden" id="pauseScreen">
    <div class="pause-title">PAUSED</div>
    <button class="pause-btn" id="btnResume">CONTINUE</button>
    <button class="pause-btn" id="btnRestartPause">RESTART</button>
    <button class="pause-btn" id="btnHomePause">MAIN MENU</button>
</div>

<!-- ЭКРАН СМЕРТИ -->
<div class="overlay" id="gameOverScreen">
    <div class="score-header">SCORE</div>
    <div class="score-list">
        <div class="score-row"><span>Distance</span><span><span id="go-distance">0m</span> <span class="coin-bonus" id="go-coins-dist"></span></span></div>
        <div class="score-row"><span>Max Air Time</span><span><span id="go-airtime">0.0s</span> <span class="coin-bonus" id="go-coins-air"></span></span></div>
        <div class="score-row"><span>Total Flips</span><span><span id="go-flips">0</span> <span class="coin-bonus" id="go-coins-flips"></span></span></div>
        <div class="score-row high-score"><span>BEST DISTANCE</span><span id="go-highscore">0</span></div>
        <div class="score-row reward-row"><span>REWARD</span><span><span id="go-coins">0</span> <img src="coin.png" style="height: 24px; vertical-align: middle;"></span></div>
    </div>

    <div class="gameover-buttons">
        <div class="icon-btn" id="btnHomeGameOver">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div class="icon-btn" id="btnRestartGameOver">
            <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
        </div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>
<div class="version-text">v15.5</div>

<script>
    let gameState = 'splash'; 
    let splashStarted = false;
    
    const BIKE_CATALOG = [
        { id: 'cayo', name: "CAYO 125 TRAIL", density: 2.2, suspension: { freq: 4.5, damp: 0.8 }, motor: { speed: 35, torque: 40, brake: 50 } },
        { id: 'ctm', name: "CTM 300 EXC", density: 1.2, suspension: { freq: 5.5, damp: 0.7 }, motor: { speed: 50, torque: 60, brake: 100 } }
    ];
    let currentBikeIndex = 1; 
    let currentBike = BIKE_CATALOG[currentBikeIndex];

    let totalCoins = parseInt(localStorage.getItem('totalCoins')) || 0;
    let maxDistance = parseInt(localStorage.getItem('bestDistance')) || 0;
    
    let maxAirTime = 0, currentAirTime = 0;
    let frontflipCount = 0, backflipCount = 0;
    let accumulatedRotation = 0, lastAngle = 0, flipCounted = false;
    let maxWheelieTime = 0, currentWheelieTime = 0;
    let maxStoppieTime = 0, currentStoppieTime = 0;
    let particles = [], dustTimer = 0;

    const SCALE = 30; 
    let groundY = 0; 
    const startX = 50000;
    let terrainOffset = 0; 
    let cameraX = 0, cameraY = 0; 
    const zoom = 1.1; 

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        if (window.innerHeight > window.innerWidth) return;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        groundY = canvas.height - 80; 
    }

    // Запуск заставки (только когда игрок в горизонтальном положении)
    function startSplashSequence() {
        if (splashStarted) return;
        splashStarted = true;
        
        setTimeout(() => {
            const splash = document.getElementById('splashScreen');
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.classList.add('hidden');
                document.getElementById('mainMenu').classList.remove('hidden');
                gameState = 'menu';
                updateMenuUI();
            }, 800);
        }, 2000);
    }

    function checkOrientation() {
        const rotate = document.getElementById('rotateDevice');
        if (window.innerHeight > window.innerWidth) {
            // Портретный режим
            rotate.style.display = 'flex';
        } else {
            // Ландшафтный режим
            rotate.style.display = 'none';
            
            // Если мы на экране заставки и телефон только что повернули - запускаем её
            if (gameState === 'splash') {
                startSplashSequence();
            }
        }
    }
    
    window.addEventListener('resize', () => { checkOrientation(); resizeCanvas(); });
    window.addEventListener('orientationchange', () => setTimeout(() => { checkOrientation(); resizeCanvas(); }, 200));

    // --- АУДИО СИСТЕМА ---
    let audioCtx, idleBuffer, popBuffer, windBuffer, revBuffer;
    let idleSource, windSource, revSource;
    let idleGain, revGain, windGain, revFilter, revTremoloGain, revLfoTone, revLfoToneGain, revLfoVol, revLfoVolGain;
    let isAudioInitialized = false, previousGasState = false;
    let popTimer = 0; 

    async function loadAudio(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) return null;
            const arrayBuffer = await response.arrayBuffer();
            return await audioCtx.decodeAudioData(arrayBuffer);
        } catch (e) { return null; }
    }

    function createSeamlessBuffer(buffer, crossfadeTime = 2.0) {
        const sampleRate = buffer.sampleRate;
        const crossfadeSamples = Math.floor(crossfadeTime * sampleRate);
        const originalLength = buffer.length;
        const newLength = originalLength - crossfadeSamples;
        if (newLength <= 0) return buffer;
        const newBuffer = audioCtx.createBuffer(buffer.numberOfChannels, newLength, sampleRate);
        for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
            const originalData = buffer.getChannelData(channel);
            const newData = newBuffer.getChannelData(channel);
            for (let i = 0; i < newLength - crossfadeSamples; i++) newData[i] = originalData[i];
            for (let i = 0; i < crossfadeSamples; i++) {
                const ratio = i / crossfadeSamples;
                newData[newLength - crossfadeSamples + i] = (originalData[newLength - crossfadeSamples + i] * Math.cos(ratio * 0.5 * Math.PI)) + (originalData[i] * Math.sin(ratio * 0.5 * Math.PI));
            }
        }
        return newBuffer;
    }

    async function initAudio() {
        if (isAudioInitialized) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            idleBuffer = await loadAudio('engine_idle.mp3');
            popBuffer = await loadAudio('engine_pop.mp3');
            windBuffer = await loadAudio('wind.mp3');
            let rawRevBuffer = await loadAudio('engine_rev.mp3');
            if (rawRevBuffer) revBuffer = createSeamlessBuffer(rawRevBuffer, 2.0);

            idleGain = audioCtx.createGain(); revGain = audioCtx.createGain(); windGain = audioCtx.createGain(); revTremoloGain = audioCtx.createGain();
            idleGain.gain.value = 0; revGain.gain.value = 0; windGain.gain.value = 0; revTremoloGain.gain.value = 0.9; 
            revFilter = audioCtx.createBiquadFilter(); revFilter.type = 'lowpass'; revFilter.frequency.value = 2500; 
            idleGain.connect(audioCtx.destination); revFilter.connect(revTremoloGain); revTremoloGain.connect(revGain); revGain.connect(audioCtx.destination); windGain.connect(audioCtx.destination);

            revLfoTone = audioCtx.createOscillator(); revLfoTone.type = 'sine'; revLfoTone.frequency.value = 0.3; 
            revLfoToneGain = audioCtx.createGain(); revLfoToneGain.gain.value = 0.01; 
            revLfoTone.connect(revLfoToneGain); revLfoTone.start();
            revLfoVol = audioCtx.createOscillator(); revLfoVol.type = 'sine'; revLfoVol.frequency.value = 0.2; 
            revLfoVolGain = audioCtx.createGain(); revLfoVolGain.gain.value = 0.1; 
            revLfoVol.connect(revLfoVolGain); revLfoVolGain.connect(revTremoloGain.gain); revLfoVol.start();

            if (idleBuffer) { idleSource = audioCtx.createBufferSource(); idleSource.buffer = idleBuffer; idleSource.loop = true; idleSource.connect(idleGain); idleSource.start(); }
            if (revBuffer) { revSource = audioCtx.createBufferSource(); revSource.buffer = revBuffer; revSource.loop = true; revSource.connect(revFilter); revLfoToneGain.connect(revSource.playbackRate); revSource.start(0); }
            
            if (windBuffer) { windSource = audioCtx.createBufferSource(); windSource.buffer = windBuffer; windSource.loop = true; windSource.connect(windGain); windSource.start(); }
            else {
                const bufferSize = audioCtx.sampleRate * 2; const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate); const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1; 
                windSource = audioCtx.createBufferSource(); windSource.buffer = buffer; windSource.loop = true;
                const windFilter = audioCtx.createBiquadFilter(); windFilter.type = 'lowpass'; windFilter.frequency.value = 600; 
                windSource.connect(windFilter); windFilter.connect(windGain); windSource.start();

    function hash32(a, b, c) {
        let h = (a | 0) ^ Math.imul(b | 0, 0x9E3779B1) ^ Math.imul(c | 0, 0x85EBCA77);
        h ^= h >>> 16; h = Math.imul(h, 0x85EBCA6B);
        h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
    }

    let sessionSeed = 0; const zoneCache = new Map(); 
    function getDepthForDist(distM) {
        if (distM < 800)   return null;
        if (distM < 2000)  return { min: 15, max: 20 };
        if (distM < 5000)  return { min: 25, max: 35 };
        if (distM < 10000) return { min: 35, max: 45 };   
        return { min: 45, max: 60 };                       
    }
    function erosionProfile(localX, entryW, floorW, exitW, depth, slope) {
        let total = entryW + floorW + exitW;
        if (localX < 0 || localX > total) return 0;
        if (localX < entryW) { let t = localX / entryW; return depth * t * t * (3 - 2 * t); }
        if (localX < entryW + floorW) { let t = (localX - entryW) / floorW; return depth + slope * t; }
        let t = (localX - entryW - floorW) / exitW; return (depth + slope) * (1 - t * t * (3 - 2 * t));
    }
    function getTerrainYNoErosion(x) {
        let y = groundY; let u = x + terrainOffset; let distFromStart = x - startX;
        let hillScale = Math.min(2.0, 1.0 + (Math.max(0, distFromStart) / 20000));
        let baseHill = Math.sin(u * 0.001) * 80 * hillScale;
        let micro = Math.sin(u * 0.015) * 2; 
        let shape = Math.pow(Math.sin(u * 0.003), 3) * 180;
        let gate = Math.pow(Math.max(0, Math.sin(u * 0.00125)), 6);
        let kicker = shape * gate;
        let mathY = y - baseHill - kicker - micro;
        if (distFromStart < 1000) {
            let factor = Math.max(0, distFromStart / 1000);
            let flatY = groundY - (distFromStart * 0.02);
            return flatY * (1 - factor) + mathY * factor;
        }
        return mathY;
    }
    function isOnKicker(x) {
        let u = x + terrainOffset; let shape = Math.pow(Math.sin(u * 0.003), 3) * 180; let gate = Math.pow(Math.max(0, Math.sin(u * 0.00125)), 6);
        return Math.abs(shape * gate) > 50;
    }
    function buildErosionZone(chunkStart, chunkIndex, zoneIdx, depthRange, widthTier) {
        let entryMin = depthRange.min * 1.5; let entryMax = depthRange.max * 2.5; let exitMin = depthRange.min * 1.2; let exitMax = depthRange.max * 2.0;
        let gapMin, gapMax, countMin, countMax;
        if (widthTier === 1) { gapMin = 15; gapMax = 35; countMin = 1; countMax = 3; } else if (widthTier === 2) { gapMin = 10; gapMax = 25; countMin = 2; countMax = 4; } else { gapMin = 8; gapMax = 20; countMin = 3; countMax = 5; }
        let zoneLength = 600 + hash32(sessionSeed, chunkIndex, 2 + zoneIdx * 10) * 600;
        let zoneStart = chunkStart + 1500 + hash32(sessionSeed, chunkIndex, 1 + zoneIdx * 10) * 6000;
        let attempts = 0;
        while (attempts < 3 && (isOnKicker(zoneStart) || isOnKicker(zoneStart + zoneLength))) { zoneStart += 500; attempts++; }
        if (zoneStart + zoneLength > chunkStart + 9900) return null;
        let count = countMin + Math.floor(hash32(sessionSeed, chunkIndex, 3 + zoneIdx * 10) * (countMax - countMin + 1));
        let holes = [], cursor = 0;
        for (let i = 0; i < count; i++) {
            if (i > 0) cursor += gapMin + hash32(sessionSeed, chunkIndex, 100 + i + zoneIdx * 20) * (gapMax - gapMin);
            let entryW = entryMin + hash32(sessionSeed, chunkIndex, 200 + i + zoneIdx * 20) * (entryMax - entryMin);
            let floorW = 15 + hash32(sessionSeed, chunkIndex, 300 + i + zoneIdx * 20) * 15;
            let exitW  = exitMin + hash32(sessionSeed, chunkIndex, 400 + i + zoneIdx * 20) * (exitMax - exitMin);
            let totalW = entryW + floorW + exitW;
            if (cursor + totalW > zoneLength) break;
            let depth = depthRange.min + hash32(sessionSeed, chunkIndex, 500 + i + zoneIdx * 20) * (depthRange.max - depthRange.min);
            let slope = (hash32(sessionSeed, chunkIndex, 600 + i + zoneIdx * 20) - 0.5) * 6;
            holes.push({ x: zoneStart + cursor, entryW, floorW, exitW, depth, slope });
            cursor += totalW;
        }
        if (holes.length === 0) return null;
        return { type: 'erosion', start: zoneStart, end: zoneStart + zoneLength, holes: holes };
    }
    function computeZones(chunkIndex) {
        let chunkStart = chunkIndex * 10000; let chunkDistM = chunkStart / 10;
        let depthRange = getDepthForDist(chunkDistM); if (!depthRange) return [];
        let zoneCount = 1; if (chunkDistM >= 12000) zoneCount = 3; else if (chunkDistM >= 6000) zoneCount = 2;
        let widthTier = 1; if (chunkDistM >= 10000) widthTier = 3; else if (chunkDistM >= 5000) widthTier = 2;
        let zones = [];
        for (let i = 0; i < zoneCount; i++) { let zone = buildErosionZone(chunkStart, chunkIndex, i, depthRange, widthTier); if (zone) zones.push(zone); }
        return zones;
    }
    function getZonesCached(chunkIndex) {
        if (!zoneCache.has(chunkIndex)) zoneCache.set(chunkIndex, computeZones(chunkIndex));
        return zoneCache.get(chunkIndex);
    }
    function getTerrainY(x) {
        let mathY = getTerrainYNoErosion(x); let zones = getZonesCached(Math.floor(x / 10000));

            if (x >= zone.start && x <= zone.end) {
                for (let h of zone.holes) {
                    let lx = x - h.x;
                    if (lx >= 0 && lx <= h.entryW + h.floorW + h.exitW) mathY += erosionProfile(lx, h.entryW, h.floorW, h.exitW, h.depth, h.slope);
                }

        return mathY;
    }

    function createBike(x, y) {

    }

    function drawMountainLayer(yOffset, height, color, parallaxOffset) {
        ctx.fillStyle = color; ctx.beginPath();
        let startDrawX = Math.floor(cameraX) - 100; let endDrawX = Math.floor(cameraX) + (canvas.width / zoom) + 100;
        ctx.moveTo(startDrawX, groundY + 2000);
        for (let x = startDrawX; x <= endDrawX; x += 10) {
            let worldX = x + parallaxOffset;
            let jagged = Math.abs(Math.sin(worldX * 0.004)) * height;
            let noise = Math.sin(worldX * 0.02) * (height * 0.15) + Math.cos(worldX * 0.01) * (height * 0.1); 
            let y = groundY - yOffset - jagged - noise;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(endDrawX, groundY + 2000); ctx.closePath(); ctx.fill();
    }

    function drawTerrain() {
        ctx.fillStyle = '#000'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4; 
        ctx.beginPath(); ctx.moveTo(cameraX - 100, groundY + 2000);
        let startDrawX = Math.floor(cameraX) - 100; let endDrawX = Math.floor(cameraX) + (canvas.width / zoom) + 100;
        for (let x = startDrawX; x <= endDrawX; x += 2) ctx.lineTo(x, getTerrainY(x));
        ctx.lineTo(endDrawX, groundY + 2000); ctx.closePath(); ctx.fill(); ctx.stroke();
    }

    function drawWheel(wheel) {
        ctx.save(); ctx.translate(wheel.getPosition().x * SCALE, wheel.getPosition().y * SCALE); ctx.rotate(wheel.getAngle());
        let r = wheelRadius * SCALE;
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fillStyle = '#000'; ctx.fill();
        ctx.beginPath(); ctx.arc(0, 0, r - 3.5, 0, Math.PI * 2); ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.stroke();
        ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
        for (let i = 0; i < 6; i++) {
            let a = (i / 6) * Math.PI * 2;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * (r - 3.5), Math.sin(a) * (r - 3.5)); ctx.stroke();
        }
        ctx.restore();
    }

    function spawnDust(x, y, speedX, type) {
        if (particles.length > 80) return;
        let count = type === 'brake' ? 2 : 1, baseVy = type === 'brake' ? -5 : -2;
        for (let i = 0; i < count; i++) {
            particles.push({ x: x + (Math.random() - 0.5) * 8, y: y, baseVx: -Math.random() * 3, vy: baseVy, radius: 3 + Math.random() * 4, growth: 1 + Math.random(), alphaMax: 0.4, alpha: 0.4, age: 0, maxAge: 1.0 + Math.random() });
        }
    }
    function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; p.age += dt; let prog = p.age / p.maxAge;
            if (prog >= 1) { particles.splice(i, 1); continue; }
            p.x += p.baseVx * (1 + prog); p.vy += 0.15; p.y += p.vy; p.radius += p.growth;
            p.alpha = p.alphaMax * Math.pow(1 - prog, 1.5);
            if (p.alpha <= 0.01) particles.splice(i, 1);
        }
    }
    function drawParticles() {
        for (let p of particles) {
            let grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
            grad.addColorStop(0, `rgba(140, 105, 75, ${p.alpha})`); grad.addColorStop(1, 'rgba(200, 160, 120, 0)');
            ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
        }
    }

    let lastTime = performance.now();
    function update() {
        requestAnimationFrame(update);
        let dt = (performance.now() - lastTime) / 1000; lastTime = performance.now();
        if (dt > 0.1) dt = 0.1; 

        if (gameState === 'playing' && chassis) {
            world.step(1/60, dt, 3);

            let wheelSpeed = Math.abs(wheelRear.getAngularVelocity());
            let linearSpeed = Math.abs(chassis.getLinearVelocity().x) * SCALE; 
            
            let chassisX = chassis.getPosition().x * SCALE; let chassisY = chassis.getPosition().y * SCALE;
            let groundUnder = getTerrainY(chassisX);
            let isAirborne = (chassisY < groundUnder - 25); 
            
            let angle = chassis.getAngle(); let deltaAngle = angle - lastAngle;
            if (deltaAngle > Math.PI) deltaAngle -= 2 * Math.PI;
            if (deltaAngle < -Math.PI) deltaAngle += 2 * Math.PI;
            
            if (isAirborne) {
                accumulatedRotation += deltaAngle; currentAirTime += dt;
                if (currentAirTime > maxAirTime) maxAirTime = currentAirTime;
                if (!flipCounted && Math.abs(accumulatedRotation) >= Math.PI * 1.7 && currentAirTime > 0.3) {
                    if (accumulatedRotation > 0) frontflipCount++; else backflipCount++; 
                    flipCounted = true;
                }
            } else {
                currentAirTime = 0; accumulatedRotation = 0; flipCounted = false;
                if (angle < -0.3 && linearSpeed > 5) { currentWheelieTime += dt; if (currentWheelieTime > maxWheelieTime) maxWheelieTime = currentWheelieTime; } else { currentWheelieTime = 0; }
                if (angle > 0.3 && linearSpeed > 5) { currentStoppieTime += dt; if (currentStoppieTime > maxStoppieTime) maxStoppieTime = currentStoppieTime; } else { currentStoppieTime = 0; }

                if (linearSpeed > 5) {
                    dustTimer += dt;
                    if (dustTimer > 0.06) {
                        let wp = wheelRear.getPosition(); let dx = wp.x * SCALE; let dy = wp.y * SCALE + (wheelRadius * SCALE);
                        if (window.isBrake && linearSpeed > 10) spawnDust(dx, dy, chassis.getLinearVelocity().x * SCALE, 'brake');
                        else if (window.isGas) spawnDust(dx, dy, chassis.getLinearVelocity().x * SCALE, 'gas');
                        else if (linearSpeed > 15) spawnDust(dx, dy, chassis.getLinearVelocity().x * SCALE, 'roll');
                        dustTimer = 0;
                    }
                } else { dustTimer = 0.05; }
            }
            lastAngle = angle; 

            if (window.isGas) { jointRear.setMotorSpeed(currentBike.motor.speed); jointFront.setMotorSpeed(currentBike.motor.speed); jointRear.setMaxMotorTorque(currentBike.motor.torque); jointFront.setMaxMotorTorque(currentBike.motor.torque); } 
            else if (window.isBrake) { jointRear.setMotorSpeed(0); jointFront.setMotorSpeed(0); jointRear.setMaxMotorTorque(currentBike.motor.brake); jointFront.setMaxMotorTorque(currentBike.motor.brake); } 
            else { jointRear.setMaxMotorTorque(0); jointFront.setMaxMotorTorque(0); }

            let tiltPower = 20; let maxTiltSpeed = 2.5;  
            if (window.isLeanBack) { if (chassis.getAngularVelocity() > -maxTiltSpeed) chassis.applyTorque(-tiltPower, true); } 
            else if (window.isLeanForward) { if (chassis.getAngularVelocity() < maxTiltSpeed) chassis.applyTorque(tiltPower, true); }

            if (isAudioInitialized) {
                if (window.isGas) { idleGain.gain.cancelScheduledValues(audioCtx.currentTime); idleGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05); } 
                else { idleGain.gain.cancelScheduledValues(audioCtx.currentTime); idleGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.1); }

                let targetRev = window.isGas ? 0.8 : 0; let targetWind = Math.min(0.3, 0.05 + wheelSpeed * 0.15); 
                revGain.gain.setTargetAtTime(targetRev, audioCtx.currentTime, 0.1); windGain.gain.setTargetAtTime(targetWind, audioCtx.currentTime, 0.1);

                if (window.isGas && revSource) {
                    let targetRate = 1.0 + (wheelSpeed * 0.3); let finalRate = Math.min(1.3, targetRate);
                    revSource.playbackRate.setTargetAtTime(finalRate, audioCtx.currentTime, 0.1);
                    let targetFreq = Math.max(1000, 2500 - (wheelSpeed * 1000));
                    revFilter.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
                    previousGasState = true;
                } else { previousGasState = false; }

                if (!window.isGas && wheelSpeed > 2) {
                    popTimer += dt; if (popTimer > 1.0 && Math.random() < 0.02) { playPop(); popTimer = 0; }
                } else { popTimer = 0; }
            }

            if (chassis.getPosition().y > groundY + 1000) triggerGameOver();

            let targetCameraX = (chassis.getPosition().x * SCALE) - ((canvas.width * 0.3) / zoom);
            cameraX += (targetCameraX - cameraX) * 0.1; 
            let targetCameraY = (canvas.height * 0.5) - (chassis.getPosition().y * SCALE);
            cameraY += (targetCameraY - cameraY) * 0.1;
            
            generateTerrain(); cleanupTerrain(); updateParticles(dt);

            let currentDistance = Math.max(0, Math.floor(((chassis.getPosition().x * SCALE) - startX) / 10));
            document.getElementById('distanceText').innerText = currentDistance; 
            document.getElementById('coinBalanceText').innerText = totalCoins + Math.floor(currentDistance / 100);
            if (currentDistance > maxDistance) { maxDistance = currentDistance; localStorage.setItem('bestDistance', maxDistance); document.getElementById('bestDistanceText').innerText = maxDistance; }
        }

        if (gameState === 'playing' || gameState === 'gameover' || gameState === 'paused') {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#2b0b46'); gradient.addColorStop(0.4, '#842a66'); gradient.addColorStop(0.7, '#e65c41'); gradient.addColorStop(1, '#f5a354');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

            let sunX = canvas.width * 0.75; let sunY = canvas.height * 0.35;
            let sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 150);
            sunGlow.addColorStop(0, 'rgba(255, 243, 212, 0.8)'); sunGlow.addColorStop(1, 'rgba(255, 243, 212, 0)');
            ctx.fillStyle = sunGlow; ctx.beginPath(); ctx.arc(sunX, sunY, 150, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff3d4'; ctx.beginPath(); ctx.arc(sunX, sunY, 45, 0, Math.PI * 2); ctx.fill();

            ctx.save(); ctx.scale(zoom, zoom); ctx.translate(-cameraX, cameraY); 
            drawMountainLayer(180, 120, '#2d163d', cameraX * 0.2); 
            drawMountainLayer(100, 180, '#15081c', cameraX * 0.5);
            ctx.restore();

            ctx.save(); ctx.scale(zoom, zoom); ctx.translate(0, cameraY); ctx.translate(-cameraX, 0);
            drawTerrain();
            if (gameState !== 'gameover' && chassis) {
                drawParticles(); 
                ctx.save(); ctx.translate(chassis.getPosition().x * SCALE, chassis.getPosition().y * SCALE); ctx.rotate(chassis.getAngle());
                if (bikeImage.complete) ctx.drawImage(bikeImage, -45, -45, 90, 54); 
                ctx.restore();
                drawWheel(wheelRear); drawWheel(wheelFront);
            }
            ctx.restore(); 
        }
    }

    // Инициализация
    window.addEventListener('load', checkOrientation); // Проверка при загрузке
    checkOrientation(); 
    resizeCanvas(); 
    update();
</script>
</body>
