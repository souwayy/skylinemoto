<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skyline Moto (v11.1)</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            touch-action: none; -webkit-user-select: none; user-select: none; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas { display: block; touch-action: none; }

        #rotateDevice {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center; padding: 20px; box-sizing: border-box;
        }
        #rotateDevice svg {
            width: 120px; height: 120px; fill: none; stroke: white; stroke-width: 4;
            margin-bottom: 24px; stroke-linecap: round; stroke-linejoin: round;
            filter: drop-shadow(0 0 16px rgba(255,255,255,0.2));
        }
        .phone-group {
            transform-box: fill-box;
            transform-origin: center;
            animation: rotatePhone 2s ease-in-out infinite alternate;
        }
        @keyframes rotatePhone {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(90deg); }
        }
        #rotateDevice h2 { font-size: 24px; font-weight: 600; margin: 0; line-height: 1.3; }

        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }
        .top-bar {
            display: flex; justify-content: space-between; padding: 20px;
            align-items: flex-start;
        }
        .stats-left { display: flex; flex-direction: column; gap: 5px; }
        .stat-text {
            font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.7);
            text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center;
        }
        .stats-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        .clock { font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.8); font-family: monospace; }
        .score { font-size: 32px; font-weight: bold; color: white; line-height: 1; }

        .btn {
            position: absolute; width: 55px; height: 55px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.4) 100%);
            border: 2px solid rgba(255, 255, 255, 0.3); pointer-events: auto; color: white;
            display: flex; align-items: center; justify-content: center;
        }
        .btn svg { width: 28px; height: 28px; fill: none; stroke: rgba(255, 255, 255, 0.9); stroke-width: 2.5; }
        
        #btnLeanBack    { bottom: 130px; left: 15px; }
        #btnLeanForward { bottom: 60px;  left: 50px; }
        #btnGas         { bottom: 130px; right: 15px; }
        #btnBrake       { bottom: 60px;  right: 50px; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6); pointer-events: auto; z-index: 20;
        }
        .overlay h1 {
            font-size: 42px; color: white; text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8); margin-bottom: 20px;
        }
        .overlay p { font-size: 18px; color: rgba(255,255,255,0.8); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        
        #gameOverScreen { 
            display: none; background: #0f1410; flex-direction: column;
            justify-content: center; align-items: center; pointer-events: auto; z-index: 20;
            width: 100%; height: 100%; position: absolute; top: 0; left: 0;
        }
        .score-header { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 10px; text-transform: uppercase; }
        .score-list { width: 100%; max-width: 600px; padding: 0 20px; }
        .score-row {
            display: flex; justify-content: space-between; padding: 6px 0; 
            font-size: 15px; color: #e0e0e0; border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        .coin-bonus { color: #a6ff00; font-size: 13px; margin-left: 6px; }
        .coin-bonus-icon { height: 14px; vertical-align: middle; margin-left: 3px; margin-bottom: 2px; }
        .score-row.high-score { font-size: 18px; font-weight: bold; color: #fff; border: none; margin-top: 10px; }
        .score-row.reward-row { font-size: 20px; font-weight: bold; color: #fff3d4; border: none; align-items: center; margin-top: 5px; }
        .coin-icon { height: 18px; vertical-align: middle; margin-left: 6px; }
        
        .gameover-buttons { display: flex; justify-content: center; gap: 30px; margin-top: 20px; width: 100%; }
        .icon-btn {
            cursor: pointer; pointer-events: auto; width: 55px; height: 55px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.4) 100%);
            border: 2px solid rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center;
        }
        .icon-btn svg { width: 28px; height: 28px; fill: none; stroke: #fff; stroke-width: 2.5; }
        
        .version-text { position: absolute; bottom: 5px; left: 5px; color: rgba(255,255,255,0.3); font-size: 12px; z-index: 100; }
        .hidden { display: none !important; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/planck-js@0.3/dist/planck.min.js"></script>
</head>
<body>

<div id="rotateDevice">
    <svg viewBox="0 0 100 100">
        <g fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <!-- Верхняя дуга -->
            <path d="M 22 32 A 34 34 0 0 1 78 32" />
            <polyline points="66 20 78 32 66 44" />
            
            <!-- Нижняя дуга -->
            <path d="M 78 68 A 34 34 0 0 1 22 68" />
            <polyline points="34 80 22 68 34 56" />
        </g>
        
        <g class="phone-group" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="40" y="25" width="20" height="50" rx="3" ry="3" />
            <line x1="50" y1="66" x2="50.01" y2="66" stroke-width="4" />
        </g>
    </svg>
    <h2>Пожалуйста, поверните устройство</h2>
</div>

<div class="ui-layer hidden" id="gameUI">
    <div class="top-bar">
        <div class="stats-left">
            <div class="stat-text">Best: <span id="bestDistanceText">0</span>m</div>
            <div class="stat-text" style="color: #fff3d4;">
                <img src="coin.png" id="coinIconTop" class="coin-icon" style="height: 20px; margin-right: 5px;" onerror="this.style.display='none'">
                <span id="coinBalanceText">0</span>
            </div>
        </div>
        
        <div class="stats-right">
            <div class="clock" id="clockText">00:00</div>
            <div class="score"><span id="distanceText">0</span> m</div>
        </div>
    </div>
    
    <div class="controls" id="controls">
        <div class="btn" id="btnLeanBack">
            <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
        </div>
        <div class="btn" id="btnLeanForward">
            <svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg>
        </div>
        <div class="btn" id="btnGas">
            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
        <div class="btn" id="btnBrake">
            <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></svg>
        </div>
    </div>

    <div id="gameOverScreen">
        <div class="score-header">SCORE</div>
        
        <div class="score-list">
            <div class="score-row">
                <span>Distance</span>
                <span>
                    <span id="go-distance">0m</span> 
                    <span class="coin-bonus" id="go-coins-dist">(+0)</span>
                    <img src="coin.png" class="coin-bonus-icon" onerror="this.style.display='none'">
                </span>
            </div>
            <div class="score-row">
                <span>Max Air Time</span>
                <span>
                    <span id="go-airtime">0.0s</span> 
                    <span class="coin-bonus" id="go-coins-air">(+0)</span>
                    <img src="coin.png" class="coin-bonus-icon" onerror="this.style.display='none'">
                </span>
            </div>
            <div class="score-row">
                <span>Max Stoppie</span>
                <span>
                    <span id="go-stoppie">0.0s</span> 
                    <span class="coin-bonus" id="go-coins-stoppie">(+0)</span>
                    <img src="coin.png" class="coin-bonus-icon" onerror="this.style.display='none'">
                </span>
            </div>
            <div class="score-row">
                <span>Max Wheelie</span>
                <span>
                    <span id="go-wheelie">0.0s</span> 
                    <span class="coin-bonus" id="go-coins-wheelie">(+0)</span>
                    <img src="coin.png" class="coin-bonus-icon" onerror="this.style.display='none'">
                </span>
            </div>
            <div class="score-row">
                <span>Total Flips</span>
                <span>
                    <span id="go-flips">0</span> 
                    <span class="coin-bonus" id="go-coins-flips">(+0)</span>
                    <img src="coin.png" class="coin-bonus-icon" onerror="this.style.display='none'">
                </span>
            </div>
            
            <div class="score-row high-score">
                <span>BEST DISTANCE</span>
                <span id="go-highscore">0</span>
            </div>
            
            <div class="score-row reward-row">
                <span>REWARD</span>
                <span>
                    <span id="go-coins">0</span>
                    <img src="coin.png" class="coin-icon" onerror="this.style.display='none'">
                </span>
            </div>
        </div>

        <div class="gameover-buttons">
            <div class="icon-btn" id="btnHome">
                <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </div>
            <div class="icon-btn" id="btnRestart">
                <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
            </div>
        </div>
    </div>
</div>

<div class="overlay hidden" id="startScreen">
    <h1>Skyline Moto</h1>
    <p>Нажми, чтобы начать</p>
</div>

<canvas id="gameCanvas"></canvas>
<div class="version-text">v11.1</div>

<script>
    let isGameRunning = false;
    let gameState = 'start'; 

    function checkOrientation() {
        const rotateDiv = document.getElementById('rotateDevice');
        const startScreen = document.getElementById('startScreen');
        const gameUI = document.getElementById('gameUI');
        const canvas = document.getElementById('gameCanvas');

        if (window.innerHeight > window.innerWidth) {
            rotateDiv.style.display = 'flex';
            startScreen.classList.add('hidden');
            gameUI.classList.add('hidden');
            canvas.style.display = 'none';
        } else {
            rotateDiv.style.display = 'none';
            canvas.style.display = 'block';
            if (gameState === 'start') {
                startScreen.classList.remove('hidden');
                gameUI.classList.add('hidden');
            } else if (gameState === 'playing' || gameState === 'gameover') {
                startScreen.classList.add('hidden');
                gameUI.classList.remove('hidden');
            }
            if (typeof resizeCanvas === 'function') resizeCanvas();
        }
    }
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 200));

    const ENABLE_AUDIO = true; 
    const SCALE = 30; 
    let groundY = 0; 

    const BIKE_CATALOG = {
        cayo_125: { name: "CAYO 125 TRAIL", density: 2.2, suspension: { freq: 3.5, damp: 0.8 }, motor: { speed: 35, torque: 40, brake: 50 } },
        ctm_300_exc: { name: "CTM 300 EXC", density: 1.2, suspension: { freq: 4.5, damp: 0.7 }, motor: { speed: 50, torque: 60, brake: 100 } }
    };
    let currentBike = BIKE_CATALOG.ctm_300_exc;

    let totalCoins = parseInt(localStorage.getItem('totalCoins')) || 0;
    let sessionCoins = 0;
    document.getElementById('coinBalanceText').innerText = totalCoins;
    
    let maxAirTime = 0, currentAirTime = 0;
    let frontflipCount = 0, backflipCount = 0;
    let accumulatedRotation = 0, lastAngle = 0, flipCounted = false;
    let maxWheelieTime = 0, currentWheelieTime = 0;
    let maxStoppieTime = 0, currentStoppieTime = 0;
    let particles = [], dustTimer = 0;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        if (window.innerHeight > window.innerWidth) return;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        groundY = canvas.height - 80; 
    }
    resizeCanvas();

    const pl = planck;
    const world = new pl.World({ gravity: pl.Vec2(0, 10) });

    world.on('begin-contact', (contact) => {
        if (gameState !== 'playing') return;
        const fixA = contact.getFixtureA();
        const fixB = contact.getFixtureB();
        const dataA = fixA.getUserData();
        const dataB = fixB.getUserData();

        if ((dataA === 'head' && dataB === 'terrain') || (dataB === 'head' && dataA === 'terrain')) {
            triggerGameOver();
        }
    });

    const startX = 50000;
    let terrainOffset = 0; 
    let maxDistance = parseInt(localStorage.getItem('bestDistance')) || 0;
    document.getElementById('bestDistanceText').innerText = maxDistance;
    
    let cameraX = startX - (canvas.width * 0.3);
    let cameraY = 0; 
    const zoom = 1.1; 

    // -----------------------------------------------------
    //  ХЭШ И КЭШ ЗОН
    // -----------------------------------------------------

    function hash32(a, b, c) {
        let h = (a | 0) ^ Math.imul(b | 0, 0x9E3779B1) ^ Math.imul(c | 0, 0x85EBCA77);
        h ^= h >>> 16; h = Math.imul(h, 0x85EBCA6B);
        h ^= h >>> 13; h = Math.imul(h, 0xC2B2AE35);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
    }

    let sessionSeed = 0;
    const zoneCache = new Map();  // chunkIndex -> Array<zone>

    // Пороги сложности по дистанции (в метрах) — СМЯГЧЕНО
    function getDepthForDist(distM) {
        if (distM < 800)   return null;
        if (distM < 1500)  return { min: 12, max: 15 };
        if (distM < 3000)  return { min: 16, max: 22 };
        if (distM < 5000)  return { min: 20, max: 25 };   // было 22-28
        if (distM < 7000)  return { min: 25, max: 28 };   // новый порог
        if (distM < 10000) return { min: 28, max: 32 };   
        if (distM < 15000) return { min: 32, max: 35 };   
        if (distM < 20000) return { min: 34, max: 36 };   
        return { min: 35, max: 38 };                       
    }

    // Профиль промоины (глубина положительная)
    function erosionProfile(localX, entryW, floorW, exitW, depth, slope) {
        let total = entryW + floorW + exitW;
        if (localX < 0 || localX > total) return 0;
        if (localX < entryW) {
            let t = localX / entryW;
            return depth * t * t * (3 - 2 * t);
        }
        if (localX < entryW + floorW) {
            let t = (localX - entryW) / floorW;
            return depth + slope * t;
        }
        let t = (localX - entryW - floorW) / exitW;
        return (depth + slope) * (1 - t * t * (3 - 2 * t));
    }

    // Профиль оврага (линейный step-down + flat + step-up)
    function ravineProfile(localX, dropW, floorW, riseW, depth) {
        let total = dropW + floorW + riseW;
        if (localX < 0 || localX > total) return 0;
        if (localX < dropW) {
            return depth * (localX / dropW);
        }
        if (localX < dropW + floorW) {
            return depth;
        }
        let t = (localX - dropW - floorW) / riseW;
        return depth * (1 - t);
    }

    // Whoops — визуальная гребёнка, не наказание
    function whoopsProfile(localX, totalWidth, step, amplitude) {
        if (localX < 0 || localX > totalWidth) return 0;
        let progress = localX / totalWidth;
        let envelope = 1;
        if (progress < 0.15) envelope = progress / 0.15;
        else if (progress > 0.85) envelope = (1 - progress) / 0.15;
        let phase = (localX * Math.PI) / step;
        return Math.sin(phase) * amplitude * envelope;
    }

    function getTerrainYNoErosion(x) {
        let y = groundY;
        let u = x + terrainOffset;

        let baseHill = Math.sin(u * 0.001) * 80;
        let micro = Math.sin(u * 0.015) * 6;

        let shape = Math.pow(Math.sin(u * 0.003), 3) * 180;
        let gate = Math.pow(Math.max(0, Math.sin(u * 0.00125)), 6);
        let kicker = shape * gate;

        let mathY = y - baseHill - kicker - micro;

        let distFromStart = x - startX;
        if (distFromStart < 1000) {
            let factor = Math.max(0, distFromStart / 1000);
            let flatY = groundY - (distFromStart * 0.02);
            return flatY * (1 - factor) + mathY * factor;
        }
        return mathY;
    }

    function isOnKicker(x) {
        let u = x + terrainOffset;
        let shape = Math.pow(Math.sin(u * 0.003), 3) * 180;
        let gate = Math.pow(Math.max(0, Math.sin(u * 0.00125)), 6);
        return Math.abs(shape * gate) > 50;
    }

    // -----------------------------------------------------
    //  БИЛДЕРЫ ЗОН
    // -----------------------------------------------------

    function buildErosionZone(chunkStart, chunkIndex, zoneIdx, depthRange, widthTier) {
        let entryMin, entryMax, gapMin, gapMax, countMin, countMax;
        if (widthTier === 1) {
            entryMin = 40; entryMax = 60;
            gapMin = 15; gapMax = 40;
            countMin = 1; countMax = 4;
        } else if (widthTier === 2) {
            entryMin = 60; entryMax = 90;
            gapMin = 10; gapMax = 25;
            countMin = 2; countMax = 5;
        } else {
            entryMin = 70; entryMax = 100;
            gapMin = 8; gapMax = 20;
            countMin = 3; countMax = 6;
        }

        let zoneLength = 600 + hash32(sessionSeed, chunkIndex, 2 + zoneIdx * 10) * 600;
        let zoneStart = chunkStart + 1500 + hash32(sessionSeed, chunkIndex, 1 + zoneIdx * 10) * 6000;

        let attempts = 0;
        while (attempts < 3 && (isOnKicker(zoneStart) || isOnKicker(zoneStart + zoneLength))) {
            zoneStart += 500;
            attempts++;
        }
        if (zoneStart + zoneLength > chunkStart + 9900) return null;

        let count = countMin + Math.floor(hash32(sessionSeed, chunkIndex, 3 + zoneIdx * 10) * (countMax - countMin + 1));
        let holes = [];
        let cursor = 0;

        for (let i = 0; i < count; i++) {
            if (i > 0) {
                let gap = gapMin + hash32(sessionSeed, chunkIndex, 100 + i + zoneIdx * 20) * (gapMax - gapMin);
                cursor += gap;
            }
            let entryW = entryMin + hash32(sessionSeed, chunkIndex, 200 + i + zoneIdx * 20) * (entryMax - entryMin);
            let floorW = 10 + hash32(sessionSeed, chunkIndex, 300 + i + zoneIdx * 20) * 15;
            // ИСПРАВЛЕНО: exitW увеличен до 35-50, чтобы не было трамплина
            let exitW  = 35 + hash32(sessionSeed, chunkIndex, 400 + i + zoneIdx * 20) * 15;
            let totalW = entryW + floorW + exitW;
            if (cursor + totalW > zoneLength) break;

            let depthRnd = hash32(sessionSeed, chunkIndex, 500 + i + zoneIdx * 20);
            let depth = depthRange.min + depthRnd * (depthRange.max - depthRange.min);
            let slope = (hash32(sessionSeed, chunkIndex, 600 + i + zoneIdx * 20) - 0.5) * 6;

            holes.push({
                x: zoneStart + cursor,
                entryW: entryW, floorW: floorW, exitW: exitW,
                depth: depth, slope: slope
            });
            cursor += totalW;
        }

        if (holes.length === 0) return null;

        let pebbles = [];
        let pebbleCount = 3 + Math.floor(hash32(sessionSeed, chunkIndex, 700 + zoneIdx * 10) * 6);
        let firstHole = holes[0];
        for (let i = 0; i < pebbleCount; i++) {
            let pxOff = -25 + hash32(sessionSeed, chunkIndex, 800 + i + zoneIdx * 10) * 20;
            let px = firstHole.x + pxOff;
            let py = getTerrainYNoErosion(px) - 1;
            let r  = 1 + hash32(sessionSeed, chunkIndex, 900 + i + zoneIdx * 10) * 1.5;
            let shade = 20 + Math.floor(hash32(sessionSeed, chunkIndex, 1000 + i + zoneIdx * 10) * 40);
            pebbles.push({ x: px, y: py, r: r, shade: shade });
        }

        return { type: 'erosion', start: zoneStart, end: zoneStart + zoneLength, holes: holes, pebbles: pebbles };
    }

    function buildRavineZone(chunkStart, chunkIndex, zoneIdx) {
        let dropW  = 50 + hash32(sessionSeed, chunkIndex, 20 + zoneIdx * 10) * 20;
        let floorW = 120 + hash32(sessionSeed, chunkIndex, 21 + zoneIdx * 10) * 80;
        let riseW  = 50 + hash32(sessionSeed, chunkIndex, 22 + zoneIdx * 10) * 20;
        let depth  = 20 + hash32(sessionSeed, chunkIndex, 23 + zoneIdx * 10) * 10;
        let totalW = dropW + floorW + riseW;

        let zoneStart = chunkStart + 1500 + hash32(sessionSeed, chunkIndex, 24 + zoneIdx * 10) * 6000;
        let attempts = 0;
        while (attempts < 3 && (isOnKicker(zoneStart) || isOnKicker(zoneStart + totalW))) {
            zoneStart += 500;
            attempts++;
        }
        if (zoneStart + totalW > chunkStart + 9900) return null;

        return {
            type: 'ravine',
            start: zoneStart,
            end: zoneStart + totalW,
            ravine: { dropW: dropW, floorW: floorW, riseW: riseW, depth: depth }
        };
    }

    function buildWhoopsZone(chunkStart, chunkIndex, zoneIdx) {
        let width = 100 + hash32(sessionSeed, chunkIndex, 30 + zoneIdx * 10) * 150;
        let step  = 40 + hash32(sessionSeed, chunkIndex, 31 + zoneIdx * 10) * 20;
        let amp   = 6 + hash32(sessionSeed, chunkIndex, 32 + zoneIdx * 10) * 2;

        let zoneStart = chunkStart + 1500 + hash32(sessionSeed, chunkIndex, 33 + zoneIdx * 10) * 6000;
        let attempts = 0;
        while (attempts < 3 && (isOnKicker(zoneStart) || isOnKicker(zoneStart + width))) {
            zoneStart += 500;
            attempts++;
        }
        if (zoneStart + width > chunkStart + 9900) return null;

        return { type: 'whoops', start: zoneStart, end: zoneStart + width, whoops: { width: width, step: step, amplitude: amp } };
    }

    function buildComboZone(chunkStart, chunkIndex, zoneIdx, depthRange) {
        let dropW  = 50 + hash32(sessionSeed, chunkIndex, 40 + zoneIdx * 10) * 20;
        let floorW = 120 + hash32(sessionSeed, chunkIndex, 41 + zoneIdx * 10) * 80;
        let riseW  = 50 + hash32(sessionSeed, chunkIndex, 42 + zoneIdx * 10) * 20;
        let depth  = 20 + hash32(sessionSeed, chunkIndex, 43 + zoneIdx * 10) * 10;
        let ravineW = dropW + floorW + riseW;

        let gap = 80 + hash32(sessionSeed, chunkIndex, 44 + zoneIdx * 10) * 70;
        let entryW = 60 + hash32(sessionSeed, chunkIndex, 45 + zoneIdx * 10) * 20;
        let holeFloorW = 15 + hash32(sessionSeed, chunkIndex, 46 + zoneIdx * 10) * 15;
        // ИСПРАВЛЕНО: exitW увеличен до 35-50
        let exitW = 35 + hash32(sessionSeed, chunkIndex, 47 + zoneIdx * 10) * 15;
        let holeW = entryW + holeFloorW + exitW;
        let holeDepth = depthRange.min + hash32(sessionSeed, chunkIndex, 48 + zoneIdx * 10) * (depthRange.max - depthRange.min);
        let holeSlope = (hash32(sessionSeed, chunkIndex, 49 + zoneIdx * 10) - 0.5) * 6;

        let totalW = ravineW + gap + holeW;
        let zoneStart = chunkStart + 1500 + hash32(sessionSeed, chunkIndex, 51 + zoneIdx * 10) * 6000;

        let attempts = 0;
        while (attempts < 3 && (isOnKicker(zoneStart) || isOnKicker(zoneStart + totalW))) {
            zoneStart += 500;
            attempts++;
        }
        if (zoneStart + totalW > chunkStart + 9900) return null;

        return {
            type: 'combo',
            start: zoneStart,
            end: zoneStart + totalW,
            ravine: { dropW: dropW, floorW: floorW, riseW: riseW, depth: depth },
            hole: {
                x: zoneStart + ravineW + gap,
                entryW: entryW, floorW: holeFloorW, exitW: exitW,
                depth: holeDepth, slope: holeSlope
            }
        };
    }

    function computeZones(chunkIndex) {
        let chunkStart = chunkIndex * 10000;
        let chunkDistM = chunkStart / 10;

        let depthRange = getDepthForDist(chunkDistM);
        if (!depthRange) return [];

        // СМЯГЧЕНО: 2 зоны только с 20 км, 3 зоны с 30 км
        let zoneCount = 1;
        if (chunkDistM >= 30000) zoneCount = 3;
        else if (chunkDistM >= 20000) zoneCount = 2;

        // СМЯГЧЕНО: widthTier 2 с 6 км, widthTier 3 с 10 км
        let widthTier = 1;
        if (chunkDistM >= 10000) widthTier = 3;
        else if (chunkDistM >= 6000) widthTier = 2;

        // СМЯГЧЕНО: whoops и ravine реже
        let whoopsChance = 0;
        if (chunkDistM >= 7000) whoopsChance = 0.10;

        let ravineChance = 0;
        if (chunkDistM >= 20000)      ravineChance = 0.30;
        else if (chunkDistM >= 15000) ravineChance = 0.25;
        else if (chunkDistM >= 10000) ravineChance = 0.20;
        else if (chunkDistM >= 7000)  ravineChance = 0.10;

        let comboChance = 0;
        if (chunkDistM >= 20000)      comboChance = 0.15;
        else if (chunkDistM >= 15000) comboChance = 0.10;

        let zones = [];
        for (let i = 0; i < zoneCount; i++) {
            let typeHash = hash32(sessionSeed, chunkIndex, 60 + i * 5);
            let zone = null;

            if (typeHash < comboChance) {
                zone = buildComboZone(chunkStart, chunkIndex, i, depthRange);
            } else if (typeHash < comboChance + ravineChance) {
                zone = buildRavineZone(chunkStart, chunkIndex, i);
            } else if (typeHash < comboChance + ravineChance + whoopsChance) {
                zone = buildWhoopsZone(chunkStart, chunkIndex, i);
            } else {
                zone = buildErosionZone(chunkStart, chunkIndex, i, depthRange, widthTier);
            }

            if (zone) zones.push(zone);
        }

        return zones;
    }

    function getZonesCached(chunkIndex) {
        if (!zoneCache.has(chunkIndex)) {
            zoneCache.set(chunkIndex, computeZones(chunkIndex));
        }
        return zoneCache.get(chunkIndex);
    }

    function getTerrainY(x) {
        let mathY = getTerrainYNoErosion(x);
        let chunkIndex = Math.floor(x / 10000);
        let zones = getZonesCached(chunkIndex);

        for (let z = 0; z < zones.length; z++) {
            let zone = zones[z];
            if (x < zone.start || x > zone.end) continue;

            if (zone.type === 'erosion') {
                for (let i = 0; i < zone.holes.length; i++) {
                    let h = zone.holes[i];
                    let lx = x - h.x;
                    if (lx >= 0 && lx <= h.entryW + h.floorW + h.exitW) {
                        mathY += erosionProfile(lx, h.entryW, h.floorW, h.exitW, h.depth, h.slope);
                    }
                }
            } else if (zone.type === 'whoops') {
                let lx = x - zone.start;
                mathY += whoopsProfile(lx, zone.whoops.width, zone.whoops.step, zone.whoops.amplitude);
            } else if (zone.type === 'ravine') {
                let lx = x - zone.start;
                mathY += ravineProfile(lx, zone.ravine.dropW, zone.ravine.floorW, zone.ravine.riseW, zone.ravine.depth);
            } else if (zone.type === 'combo') {
                let ravineW = zone.ravine.dropW + zone.ravine.floorW + zone.ravine.riseW;
                let lx = x - zone.start;
                if (lx >= 0 && lx < ravineW) {
                    mathY += ravineProfile(lx, zone.ravine.dropW, zone.ravine.floorW, zone.ravine.riseW, zone.ravine.depth);
                }
                let holeLx = x - zone.hole.x;
                if (holeLx >= 0 && holeLx <= zone.hole.entryW + zone.hole.floorW + zone.hole.exitW) {
                    mathY += erosionProfile(holeLx, zone.hole.entryW, zone.hole.floorW, zone.hole.exitW, zone.hole.depth, zone.hole.slope);
                }
            }
        }
        return mathY;
    }

    function drawPebbles() {
        let viewStart = cameraX - 200;
        let viewEnd   = cameraX + (canvas.width / zoom) + 200;
        let startChunk = Math.floor(viewStart / 10000);
        let endChunk   = Math.floor(viewEnd / 10000);

        for (let ci = startChunk; ci <= endChunk; ci++) {
            let zones = getZonesCached(ci);
            for (let z = 0; z < zones.length; z++) {
                let zone = zones[z];
                if (zone.type !== 'erosion' || !zone.pebbles) continue;
                for (let i = 0; i < zone.pebbles.length; i++) {
                    let p = zone.pebbles[i];
                    if (p.x < viewStart || p.x > viewEnd) continue;
                    ctx.fillStyle = 'rgb(' + p.shade + ',' + p.shade + ',' + p.shade + ')';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }
    }

    let terrainBodies = [];

    function generateTerrain() {
        while (lastGeneratedX < cameraX + (canvas.width / zoom) + 1000) {
            let vertices = [];
            for (let i = 0; i <= chunkSize; i++) {
                let px = lastGeneratedX + (i * chunkWidth);
                let py = getTerrainY(px);
                vertices.push(pl.Vec2(px / SCALE, py / SCALE));
            }
            
            const chain = world.createBody();
            const chainShape = pl.Chain(vertices, false);
            let terrainFixture = chain.createFixture(chainShape, { friction: 1.0, restitution: 0.0 });
            terrainFixture.setUserData('terrain');
            
            terrainBodies.push({ body: chain, startX: lastGeneratedX, endX: lastGeneratedX + (chunkSize * chunkWidth) });
            lastGeneratedX += chunkSize * chunkWidth;
        }
    }

    function cleanupTerrain() {
        for (let i = terrainBodies.length - 1; i >= 0; i--) {
            if (terrainBodies[i].endX < cameraX - 1500) {

                terrainBodies.splice(i, 1);
            }
        }
    }

        if (particles.length > 80) return;

        let count, baseVx, baseVy, baseRadius, baseGrowth, baseAlpha, lifeMin, lifeMax;

        if (type === 'brake') {

            baseAlpha = 0.4 + Math.random() * 0.2; // было 0.6-0.9, стало 0.4-0.6
            lifeMin = 0.8; lifeMax = 1.4;
        } else if (type === 'gas') {
            count = 1; // было 2, стало 1
            baseVx = -1 - Math.random() * 2;
            baseVy = -Math.random() * 2 - 1;
            baseRadius = 3 + Math.random() * 4; // было 5-11, стало 3-7
            baseGrowth = 1.5 + Math.random() * 1.5;
            baseAlpha = 0.3 + Math.random() * 0.2; // было 0.55-0.8, стало 0.3-0.5
            lifeMin = 1.2; lifeMax = 2.0;
        } else {
            count = 1;
            baseVx = -1 - Math.random() * 1;
            baseVy = -Math.random() * 1;
            baseRadius = 2 + Math.random() * 2; // было 3-6, стало 2-4
            baseGrowth = 1 + Math.random() * 1;
            baseAlpha = 0.2 + Math.random() * 0.1; // было 0.3-0.5, стало 0.2-0.3
            lifeMin = 0.6; lifeMax = 1.0;
        }

        for (let i = 0; i < count; i++) {
            particles.push({
                x: x + (Math.random() - 0.5) * 8,
                y: y - Math.random() * 4,
                baseVx: baseVx * (0.7 + Math.random() * 0.6),
                vy: baseVy * (0.7 + Math.random() * 0.6),
                radius: baseRadius * (0.7 + Math.random() * 0.6),
                growth: baseGrowth * (0.8 + Math.random() * 0.4),
                alphaMax: baseAlpha * (0.8 + Math.random() * 0.4),
                alpha: baseAlpha * (0.8 + Math.random() * 0.4),
                age: 0,
                maxAge: lifeMin + Math.random() * (lifeMax - lifeMin)
            });
        }
    }

    function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.age += dt;
            let progress = p.age / p.maxAge;
            if (progress >= 1) { particles.splice(i, 1); continue; }
            p.x += p.baseVx * (1 + progress * 1.2);
            p.vy += 0.15;
            p.y += p.vy;
            p.radius += p.growth;
            p.alpha = p.alphaMax * Math.pow(1 - progress, 1.5);
            if (p.alpha <= 0.01) particles.splice(i, 1);
        }
    }

    function drawParticles() {
        for (let p of particles) {
            let grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius);
            grad.addColorStop(0, `rgba(140, 105, 75, ${p.alpha})`);
            grad.addColorStop(0.6, `rgba(180, 140, 100, ${p.alpha * 0.5})`);
            grad.addColorStop(1, 'rgba(200, 160, 120, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function createSeamlessBuffer(buffer, crossfadeTime = 2.0) {
        const sampleRate = buffer.sampleRate;
        const crossfadeSamples = Math.floor(crossfadeTime * sampleRate);
        const originalLength = buffer.length;
        const newLength = originalLength - crossfadeSamples;
        if (newLength <= 0) return buffer;
        const newBuffer = audioCtx.createBuffer(buffer.numberOfChannels, newLength, sampleRate);
        for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
            const originalData = buffer.getChannelData(channel);
            const newData = newBuffer.getChannelData(channel);
            for (let i = 0; i < newLength - crossfadeSamples; i++) newData[i] = originalData[i];
            for (let i = 0; i < crossfadeSamples; i++) {
                const ratio = i / crossfadeSamples;
                newData[newLength - crossfadeSamples + i] = (originalData[newLength - crossfadeSamples + i] * Math.cos(ratio * 0.5 * Math.PI)) + (originalData[i] * Math.sin(ratio * 0.5 * Math.PI));
            }
        }
        return newBuffer;
    }

    async function initAudio() {
        if (!ENABLE_AUDIO || isAudioInitialized) return;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            idleBuffer = await loadAudio('engine_idle.mp3');
            popBuffer = await loadAudio('engine_pop.mp3');
            windBuffer = await loadAudio('wind.mp3');
            let rawRevBuffer = await loadAudio('engine_rev.mp3');
            if (rawRevBuffer) revBuffer = createSeamlessBuffer(rawRevBuffer, 2.0);

            idleGain = audioCtx.createGain(); revGain = audioCtx.createGain(); windGain = audioCtx.createGain(); revTremoloGain = audioCtx.createGain();
            idleGain.gain.value = 0; revGain.gain.value = 0; windGain.gain.value = 0; revTremoloGain.gain.value = 0.9; 
            revFilter = audioCtx.createBiquadFilter(); revFilter.type = 'lowpass'; revFilter.frequency.value = 2500; 
            idleGain.connect(audioCtx.destination); revFilter.connect(revTremoloGain); revTremoloGain.connect(revGain); revGain.connect(audioCtx.destination); windGain.connect(audioCtx.destination);

            revLfoTone = audioCtx.createOscillator(); revLfoTone.type = 'sine'; revLfoTone.frequency.value = 0.3; 
            revLfoToneGain = audioCtx.createGain(); revLfoToneGain.gain.value = 0.01; 
            revLfoTone.connect(revLfoToneGain); revLfoTone.start();
            revLfoVol = audioCtx.createOscillator(); revLfoVol.type = 'sine'; revLfoVol.frequency.value = 0.2; 
            revLfoVolGain = audioCtx.createGain(); revLfoVolGain.gain.value = 0.1; 
            revLfoVol.connect(revLfoVolGain); revLfoVolGain.connect(revTremoloGain.gain); revLfoVol.start();

            if (idleBuffer) { idleSource = audioCtx.createBufferSource(); idleSource.buffer = idleBuffer; idleSource.loop = true; idleSource.connect(idleGain); idleSource.start(); }
            if (revBuffer) { revSource = audioCtx.createBufferSource(); revSource.buffer = revBuffer; revSource.loop = true; revSource.connect(revFilter); revLfoToneGain.connect(revSource.playbackRate); revSource.start(0); }
            if (windBuffer) { windSource = audioCtx.createBufferSource(); windSource.buffer = windBuffer; windSource.loop = true; windSource.connect(windGain); windSource.start(); }
            else {
                const bufferSize = audioCtx.sampleRate * 2; const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate); const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1; 
                windSource = audioCtx.createBufferSource(); windSource.buffer = buffer; windSource.loop = true;
                const windFilter = audioCtx.createBiquadFilter(); windFilter.type = 'lowpass'; windFilter.frequency.value = 600; 
                windSource.connect(windFilter); windFilter.connect(windGain); windSource.start();
            }
            isAudioInitialized = true;
        } catch (e) { console.log("Ошибка аудио: ", e); }
    }

    function startRevSound() {
        if (!isAudioInitialized || !revBuffer) return;
        if (revSource) { try { revSource.stop(); revLfoToneGain.disconnect(revSource.playbackRate); } catch(e){} }
        revSource = audioCtx.createBufferSource(); revSource.buffer = revBuffer; revSource.loop = true;
        revLfoToneGain.connect(revSource.playbackRate); revSource.connect(revFilter);
        const randomOffset = Math.random() * (revBuffer.duration - 1); revSource.start(0, randomOffset);
    }

        if (ENABLE_AUDIO && isAudioInitialized) {
            idleGain.gain.setValueAtTime(0, audioCtx.currentTime);
            revGain.gain.setValueAtTime(0, audioCtx.currentTime);
            windGain.gain.setValueAtTime(0, audioCtx.currentTime);
        }
    });

    function drawMountainLayer(yOffset, height, color, parallaxOffset) {
        ctx.fillStyle = color;
        ctx.beginPath();
        let startDrawX = Math.floor(cameraX) - 100; 
        let endDrawX = Math.floor(cameraX) + (canvas.width / zoom) + 100;
        
        ctx.moveTo(startDrawX, groundY + 2000);
        for (let x = startDrawX; x <= endDrawX; x += 10) {
            let worldX = x + parallaxOffset;
            let y = groundY - yOffset - Math.sin(worldX * 0.005) * height - Math.cos(worldX * 0.01) * (height / 2);
            ctx.lineTo(x, y);
        }
        ctx.lineTo(endDrawX, groundY + 2000); 
        ctx.closePath(); 
        ctx.fill();
    }

    function drawTerrain() {
        ctx.fillStyle = '#000'; 
        ctx.strokeStyle = '#000'; 
        ctx.lineWidth = 4; 
        
        ctx.beginPath(); 
        ctx.moveTo(cameraX - 100, groundY + 2000);
        
        let startDrawX = Math.floor(cameraX) - 100;
        let endDrawX = Math.floor(cameraX) + (canvas.width / zoom) + 100;
        
        for (let x = startDrawX; x <= endDrawX; x += 2) {
            ctx.lineTo(x, getTerrainY(x));
        }
        
        ctx.lineTo(endDrawX, groundY + 2000); 
        ctx.closePath(); 
        ctx.fill(); 
        ctx.stroke();
    }

    function drawWheel(wheel) {
        ctx.save();
        ctx.translate(wheel.getPosition().x * SCALE, wheel.getPosition().y * SCALE);
        ctx.rotate(wheel.getAngle());
        
        let r = wheelRadius * SCALE;

        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = '#000';
        ctx.fill();

        if (currentBike.name === "CTM 300 EXC") {
            ctx.strokeStyle = '#111'; 
            ctx.lineWidth = 2;
            for (let i = 0; i < 16; i++) {
                let angle = (i / 16) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(Math.cos(angle) * (r - 1.5), Math.sin(angle) * (r - 1.5));
                ctx.lineTo(Math.cos(angle) * (r + 1), Math.sin(angle) * (r + 1));
                ctx.stroke();
            }
        }

        ctx.beginPath();
        ctx.arc(0, 0, r - 3.5, 0, Math.PI * 2);
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.strokeStyle = '#555';
        ctx.lineWidth = 1;
        let spokes = currentBike.name === "CTM 300 EXC" ? 6 : 8;
        for (let i = 0; i < spokes; i++) {
            let angle = (i / spokes) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(angle) * (r - 3.5), Math.sin(angle) * (r - 3.5));
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(0, 0, 2, 0, Math.PI * 2);
        ctx.fillStyle = '#444';
        ctx.fill();

        ctx.restore();
    }

    let lastDisplayedDistance = -1;
    let lastTime = performance.now();

    function update() {
        requestAnimationFrame(update);
        let currentTime = performance.now();
        let dt = (currentTime - lastTime) / 1000;
        lastTime = currentTime;
        if (dt > 0.1) dt = 0.1; 

        if (gameState === 'playing' || gameState === 'gameover') {
            world.step(1/60, dt, 3);
        }

        if (gameState === 'playing' && chassis) {
            let wheelSpeed = Math.abs(wheelRear.getAngularVelocity());
            let linearSpeed = Math.abs(chassis.getLinearVelocity().x) * SCALE; 
            
            let chassisX = chassis.getPosition().x * SCALE;
            let chassisY = chassis.getPosition().y * SCALE;
            let groundUnder = getTerrainY(chassisX);
            let isAirborne = (chassisY < groundUnder - 15); 
            
            let angle = chassis.getAngle();
            let deltaAngle = angle - lastAngle;
            if (deltaAngle > Math.PI) deltaAngle -= 2 * Math.PI;
            if (deltaAngle < -Math.PI) deltaAngle += 2 * Math.PI;
            
            if (isAirborne) {
                accumulatedRotation += deltaAngle;
                currentAirTime += dt;
                if (currentAirTime > maxAirTime) maxAirTime = currentAirTime;

                if (!flipCounted && Math.abs(accumulatedRotation) >= Math.PI * 1.7) {
                    if (accumulatedRotation > 0) frontflipCount++; 
                    else backflipCount++; 
                    flipCounted = true;
                }
            } else {
                currentAirTime = 0;
                accumulatedRotation = 0; 
                flipCounted = false;

                if (angle < -0.3 && linearSpeed > 5) {
                    currentWheelieTime += dt;
                    if (currentWheelieTime > maxWheelieTime) maxWheelieTime = currentWheelieTime;
                } else {
                    currentWheelieTime = 0;
                }

                if (angle > 0.3 && linearSpeed > 5) {
                    currentStoppieTime += dt;
                    if (currentStoppieTime > maxStoppieTime) maxStoppieTime = currentStoppieTime;
                } else {
                    currentStoppieTime = 0;
                }

                if (linearSpeed > 5) {
                    // ИСПРАВЛЕНО: интервалы увеличены (реже пыль)
                    let dustInterval = 0.06; 
                    if (window.isBrake && linearSpeed > 10) dustInterval = 0.03;
                    else if (!window.isGas && linearSpeed < 20) dustInterval = 0.1;

                    dustTimer += dt;
                    if (dustTimer > dustInterval) {
                        let wheelPos = wheelRear.getPosition();
                        let dustX = wheelPos.x * SCALE;
                        let dustY = wheelPos.y * SCALE + (wheelRadius * SCALE);

                        if (window.isBrake && linearSpeed > 10) {
                            spawnDust(dustX, dustY, chassis.getLinearVelocity().x * SCALE, 'brake');
                        } else if (window.isGas) {
                            spawnDust(dustX, dustY, chassis.getLinearVelocity().x * SCALE, 'gas');
                        } else if (linearSpeed > 15) {
                            spawnDust(dustX, dustY, chassis.getLinearVelocity().x * SCALE, 'roll');
                        }
                        dustTimer = 0;
                    }
                } else {
                    dustTimer = 0.05;
                }
            }
            lastAngle = angle; 

            if (window.isGas) {
                jointRear.setMotorSpeed(currentBike.motor.speed); jointFront.setMotorSpeed(currentBike.motor.speed);
                jointRear.setMaxMotorTorque(currentBike.motor.torque); jointFront.setMaxMotorTorque(currentBike.motor.torque);
            } else if (window.isBrake) {
                jointRear.setMotorSpeed(0); jointFront.setMotorSpeed(0);
                jointRear.setMaxMotorTorque(currentBike.motor.brake); jointFront.setMaxMotorTorque(currentBike.motor.brake);
            } else {
                jointRear.setMaxMotorTorque(0); jointFront.setMaxMotorTorque(0);
            }

            let tiltPower = 20; let maxTiltSpeed = 2.5;  
            if (window.isLeanBack) { if (chassis.getAngularVelocity() > -maxTiltSpeed) chassis.applyTorque(-tiltPower, true); } 
            else if (window.isLeanForward) { if (chassis.getAngularVelocity() < maxTiltSpeed) chassis.applyTorque(tiltPower, true); }

            if (ENABLE_AUDIO && isAudioInitialized) {
                if (window.isGas) {
                    idleGain.gain.cancelScheduledValues(audioCtx.currentTime);
                    idleGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.05);
                } else {
                    idleGain.gain.cancelScheduledValues(audioCtx.currentTime);
                    idleGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.1);
                }

                let targetRev = window.isGas ? 0.8 : 0;    
                let targetWind = Math.min(0.3, 0.05 + wheelSpeed * 0.15); 

                revGain.gain.setTargetAtTime(targetRev, audioCtx.currentTime, 0.1);
                windGain.gain.setTargetAtTime(targetWind, audioCtx.currentTime, 0.1);

                if (window.isGas && revSource) {
                    let targetRate = 1.0 + (wheelSpeed * 0.3); 
                    let finalRate = Math.min(1.3, targetRate);
                    
                    revSource.playbackRate.setTargetAtTime(finalRate, audioCtx.currentTime, 0.1);
                    
                    let targetFreq = Math.max(1000, 2500 - (wheelSpeed * 1000));
                    revFilter.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
                    
                    previousGasState = true;
                } else {
                    previousGasState = false;
                }

                if (!window.isGas && wheelSpeed > 2) {
                    popTimer += dt;
                    if (popTimer > 1.0 && Math.random() < 0.02) { 
                        playPop();
                        popTimer = 0; 
                    }
                } else {
                    popTimer = 0;
                }
            }

            if (chassis.getPosition().y > groundY + 1000) {
                triggerGameOver();
            }

            let targetCameraX = (chassis.getPosition().x * SCALE) - ((canvas.width * 0.3) / zoom);
            cameraX += (targetCameraX - cameraX) * 0.1; 
            let targetCameraY = (canvas.height * 0.5) - (chassis.getPosition().y * SCALE);
            cameraY += (targetCameraY - cameraY) * 0.1;
            
            generateTerrain(); cleanupTerrain(); updateParticles(dt);

            let currentDistance = Math.max(0, Math.floor(((chassis.getPosition().x * SCALE) - startX) / 10));
            
            if (currentDistance !== lastDisplayedDistance) { 
                document.getElementById('distanceText').innerText = currentDistance; 
                lastDisplayedDistance = currentDistance; 
                
                sessionCoins = Math.floor(currentDistance / 100);
                document.getElementById('coinBalanceText').innerText = totalCoins + sessionCoins;
            }
            
            if (currentDistance > maxDistance) { 
                maxDistance = currentDistance; 
                localStorage.setItem('bestDistance', maxDistance); 
                document.getElementById('bestDistanceText').innerText = maxDistance; 
            }
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (gameState !== 'start') {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1a0b2e'); gradient.addColorStop(0.4, '#5a2b58'); gradient.addColorStop(0.7, '#d96b4e'); gradient.addColorStop(1, '#f5c26b');
            ctx.fillStyle = gradient; ctx.fillRect(0, 0, canvas.width, canvas.height);

            let sunX = canvas.width * 0.75; let sunY = canvas.height * 0.35;
            let sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 150);
            sunGlow.addColorStop(0, 'rgba(255, 243, 212, 0.8)'); sunGlow.addColorStop(0.5, 'rgba(255, 243, 212, 0.2)'); sunGlow.addColorStop(1, 'rgba(255, 243, 212, 0)');
            ctx.fillStyle = sunGlow; ctx.beginPath(); ctx.arc(sunX, sunY, 150, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#fff3d4'; ctx.beginPath(); ctx.arc(sunX, sunY, 45, 0, Math.PI * 2); ctx.fill();

            ctx.save(); 
            ctx.scale(zoom, zoom); 
            ctx.translate(-cameraX, cameraY); 
            drawMountainLayer(200, 60, '#3a2354', cameraX * 0.2); 
            drawMountainLayer(100, 100, '#1e1129', cameraX * 0.5);
            ctx.restore();

            ctx.save(); 
            ctx.scale(zoom, zoom); 
            ctx.translate(0, cameraY); 
            ctx.translate(-cameraX, 0);
            
            drawTerrain();
            drawPebbles();

            if (gameState !== 'gameover' && chassis) {
                drawParticles(); 

                ctx.save();
                ctx.translate(chassis.getPosition().x * SCALE, chassis.getPosition().y * SCALE);
                ctx.rotate(chassis.getAngle());
                
                if (isImageLoaded) ctx.drawImage(bikeImage, -45, -45, 90, 54); 
                
                ctx.restore();
                
                drawWheel(wheelRear); 
                drawWheel(wheelFront);
            }

            ctx.restore(); 
        }
    }

    checkOrientation();
    update();
</script>
