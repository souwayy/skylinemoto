<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skyline Moto</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
    <!-- Подключаем физику Matter.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    // --- НАСТРОЙКА ЭКРАНА ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // --- НАСТРОЙКА ФИЗИКИ ---
    const Engine = Matter.Engine,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite;

    const engine = Engine.create();
    const world = engine.world;
    engine.gravity.y = 0.8; 

    // --- ФИЗИЧЕСКАЯ ЗЕМЛЯ ---
    const ground = Bodies.rectangle(
        canvas.width / 2, 
        canvas.height - 50, 
        canvas.width * 5, 
        100, 
        { isStatic: true }
    );

    // --- ТЕСТОВЫЙ ОБЪЕКТ (Мотоцикл) ---
    const testBike = Bodies.rectangle(
        canvas.width / 2, 
        100, 
        60, 30, 
        { 
            density: 0.05, 
            friction: 0.5
        }
    );

    Composite.add(world, [ground, testBike]);

    // --- ПАРАЛЛАКС ---
    let offset1 = 0, offset2 = 0, offset3 = 0;

    function drawMountainLayer(yOffset, height, color, offset) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        for (let x = 0; x <= canvas.width; x += 10) {
            let y = canvas.height - yOffset 
                    - Math.sin((x + offset) * 0.005) * height 
                    - Math.cos((x + offset) * 0.01) * (height / 2);
            ctx.lineTo(x, y);
        }
        ctx.lineTo(canvas.width, canvas.height);
        ctx.closePath();
        ctx.fill();
    }

    // --- НОВАЯ ФУНКЦИЯ: РИСУЕМ ТРАВУ НА ЗЕМЛЕ ---
    function drawGrass(offset) {
        ctx.fillStyle = '#000000'; // Черная трава
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        
        // Рисуем рваный край (траву)
        for (let x = 0; x <= canvas.width; x += 20) {
            // Математика для создания "зубчиков" травы
            let y = canvas.height - 50 - Math.sin((x + offset) * 0.01) * 15 - Math.cos((x + offset) * 0.03) * 5;
            ctx.lineTo(x, y);
            ctx.lineTo(x + 10, y - 10); // Зубчик травинки
        }
        
        ctx.lineTo(canvas.width, canvas.height);
        ctx.closePath();
        ctx.fill();
    }

    function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Закат
        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#1a0b2e');
        gradient.addColorStop(0.4, '#5a2b58');
        gradient.addColorStop(0.7, '#d96b4e');
        gradient.addColorStop(1, '#f5c26b');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 2. Солнце
        ctx.fillStyle = '#fff3d4';
        ctx.beginPath();
        ctx.arc(canvas.width * 0.75, canvas.height * 0.35, 45, 0, Math.PI * 2);
        ctx.fill();

        // 3. Горы (Фон)
        drawMountainLayer(120, 60, '#3a2354', offset1);
        drawMountainLayer(60, 100, '#1e1129', offset2);
        
        // 4. Земля (Черная, как ты просил)
        drawMountainLayer(0, 50, '#000000', offset3);
        
        // 5. Трава (Поверх земли, тоже черная)
        drawGrass(offset3);

        // 6. Рисуем мотоцикл (Без обводки, чистый черный)
        ctx.save();
        ctx.translate(testBike.position.x, testBike.position.y);
        ctx.rotate(testBike.angle);
        ctx.fillStyle = '#000000'; 
        ctx.fillRect(-30, -15, 60, 30); 
        ctx.restore();

        // 7. Движение фона (Привязано к скорости объекта)
        let bgSpeed = testBike.velocity.x * 1.5; 
        offset1 += bgSpeed * 0.3;
        offset2 += bgSpeed * 0.6;
        offset3 += bgSpeed * 1.0;

        requestAnimationFrame(update);
    }

    // --- БЛОКИРОВКА ОРИЕНТАЦИИ ЭКРАНА ---
    // Сработает после первого тапа по экрану
    document.body.addEventListener('touchstart', () => {
        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('portrait').catch((error) => {
                console.log("Браузер не поддерживает блокировку ориентации:", error);
            });
        }
    }, { once: true }); // Срабатывает только один раз

    const runner = Runner.create();
    Runner.run(runner, engine);
    update();

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
</script>
</body>
</html>
