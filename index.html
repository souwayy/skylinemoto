<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Skyline Moto</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    resizeCanvas();

    const Engine = Matter.Engine,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Composite = Matter.Composite,
          Constraint = Matter.Constraint,
          Body = Matter.Body;

    const engine = Engine.create();
    const world = engine.world;
    engine.gravity.y = 1; 

    // --- ЗЕМЛЯ (Очень длинная) ---
    let groundY = canvas.height - 80; 
    // Делаем землю длиной 100 000 пикселей, чтобы она не заканчивалась
    let ground = Bodies.rectangle(50000, groundY + 50, 100000, 100, { isStatic: true });

    // --- МОТОЦИКЛ ---
    const wheelRadius = 20;
    const wheelRear = Bodies.circle(canvas.width / 2 - 40, 100, wheelRadius, { density: 0.05, friction: 1 });
    const wheelFront = Bodies.circle(canvas.width / 2 + 40, 100, wheelRadius, { density: 0.05, friction: 1 });
    const chassis = Bodies.rectangle(canvas.width / 2, 90, 80, 20, { density: 0.1 });

    const suspensionRear = Constraint.create({
        bodyA: wheelRear, pointB: { x: -40, y: 0 }, bodyB: chassis, stiffness: 0.1, damping: 0.1
    });
    const suspensionFront = Constraint.create({
        bodyA: wheelFront, pointB: { x: 40, y: 0 }, bodyB: chassis, stiffness: 0.1, damping: 0.1
    });

    const moto = Composite.create({
        bodies: [wheelRear, wheelFront, chassis],
        constraints: [suspensionRear, suspensionFront]
    });

    Composite.add(world, [ground, moto]);

    // --- УПРАВЛЕНИЕ ---
    let isGas = false;
    let isBrake = false;

    window.addEventListener('touchstart', (e) => {
        const touchX = e.touches[0].clientX;
        if (touchX > window.innerWidth / 2) isGas = true;
        else isBrake = true;
    });

    window.addEventListener('touchend', () => {
        isGas = false;
        isBrake = false;
    });

    // --- КАМЕРА ---
    let cameraX = 0; // Позиция камеры в мире

    function drawMountainLayer(yOffset, height, color, cameraOffset) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        for (let x = 0; x <= canvas.width; x += 10) {
            // Используем cameraOffset для движения гор
            let worldX = x + cameraOffset;
            let y = canvas.height - yOffset 
                    - Math.sin(worldX * 0.005) * height 
                    - Math.cos(worldX * 0.01) * (height / 2);
            ctx.lineTo(x, y);
        }
        ctx.lineTo(canvas.width, canvas.height);
        ctx.closePath();
        ctx.fill();
    }

    function drawTerrain(cameraOffset) {
        ctx.fillStyle = '#000000'; 
        ctx.beginPath();
        ctx.moveTo(0, canvas.height);
        
        // Рисуем ровную землю
        ctx.lineTo(0, canvas.height - 80);
        ctx.lineTo(canvas.width, canvas.height - 80);
        
        ctx.lineTo(canvas.width, canvas.height);
        ctx.closePath();
        ctx.fill();

        // Трава (привязана к камере)
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        for (let x = 0; x <= canvas.width; x += 20) {
            let worldX = x + cameraOffset;
            let patch = Math.sin(worldX * 0.03); 
            if (patch > 0.6) {
                let y = canvas.height - 80; 
                for (let i = 0; i < 3; i++) {
                    let startX = x + (i * 4) - 4;
                    let lean = Math.sin(worldX * 0.1 + i) * 6;
                    let height = 6 + Math.cos(worldX * 0.2 + i) * 4;
                    ctx.beginPath();
                    ctx.moveTo(startX, y + 2);
                    ctx.lineTo(startX + lean, y - height);
                    ctx.stroke();
                }
            }
        }
    }

    function drawWheel(wheel) {
        ctx.save();
        // Вычитаем камеру, чтобы колесо рисовалось на правильном месте экрана
        ctx.translate(wheel.position.x - cameraX, wheel.position.y);
        ctx.rotate(wheel.angle);
        ctx.fillStyle = '#000'; 
        ctx.beginPath();
        ctx.arc(0, 0, wheelRadius, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.strokeStyle = '#fff'; 
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-wheelRadius, 0); ctx.lineTo(wheelRadius, 0);
        ctx.moveTo(0, -wheelRadius); ctx.lineTo(0, wheelRadius);
        ctx.stroke();
        ctx.restore();
    }

    function update() {
        // --- УПРАВЛЕНИЕ ---
        if (isGas) {
            Body.setAngularVelocity(wheelRear, 0.3);
            Body.setAngularVelocity(wheelFront, 0.3);
        }
        if (isBrake) {
            // ТОРМОЗ: просто обнуляем скорость вращения колес, трение земли сделает остальное
            Body.setAngularVelocity(wheelRear, 0);
            Body.setAngularVelocity(wheelFront, 0);
        }

        // --- ЛОГИКА КАМЕРЫ ---
        // Камера должна следить за рамой (chassis) и держать её на 30% слева от края
        let targetCameraX = chassis.position.x - (canvas.width * 0.3);
        // Плавно (с задержкой) двигаем камеру к цели
        cameraX += (targetCameraX - cameraX) * 0.1; 
        
        // Защита: если мотоцикл упал в пропасть, возвращаем его
        if (chassis.position.y > canvas.height + 200) {
            Body.setPosition(chassis, { x: cameraX + canvas.width * 0.3, y: 100 });
            Body.setPosition(wheelRear, { x: cameraX + canvas.width * 0.3 - 40, y: 100 });
            Body.setPosition(wheelFront, { x: cameraX + canvas.width * 0.3 + 40, y: 100 });
            Body.setVelocity(chassis, { x: 0, y: 0 });
            Body.setVelocity(wheelRear, { x: 0, y: 0 });
            Body.setVelocity(wheelFront, { x: 0, y: 0 });
        }

        // --- ОТРИСОВКА ---
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, '#1a0b2e');
        gradient.addColorStop(0.4, '#5a2b58');
        gradient.addColorStop(0.7, '#d96b4e');
        gradient.addColorStop(1, '#f5c26b');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#fff3d4';
        ctx.beginPath();
        ctx.arc(canvas.width * 0.75, canvas.height * 0.35, 45, 0, Math.PI * 2);
        ctx.fill();

        // Рисуем горы (привязываем к камере)
        drawMountainLayer(120, 60, '#3a2354', cameraX * 0.2);
        drawMountainLayer(60, 100, '#1e1129', cameraX * 0.5);
        drawTerrain(cameraX);

        // Рама (вычитаем камеру)
        ctx.save();
        ctx.translate(chassis.position.x - cameraX, chassis.position.y);
        ctx.rotate(chassis.angle);
        ctx.fillStyle = '#000'; 
        ctx.fillRect(-40, -10, 80, 20); 
        ctx.beginPath();
        ctx.arc(0, -25, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        drawWheel(wheelRear);
        drawWheel(wheelFront);

        requestAnimationFrame(update);
    }

    const runner = Runner.create();
    Runner.run(runner, engine);
    update();

    window.addEventListener('resize', () => {
        resizeCanvas();
        // Пересчитываем землю
        groundY = canvas.height - 80;
        Body.setPosition(ground, { x: 50000, y: groundY + 50 });
    });
</script>
</body>
</html>
